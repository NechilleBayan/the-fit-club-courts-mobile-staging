<head>

<title>Admin console - The Fit Club Courts</title>

<!-- ============================================================
     THE CONTACT SHEET IS GONE.
     This file used to be a hand-maintained index of all twenty-six console
     screens, four sections of rows, kept in step with the folder by whoever
     remembered. The staging harness in the customer build now lists every one of
     them under Every screen, beside the customer routes, from the same array the
     harness has always used. Two hand-maintained indexes of one folder is one
     too many, and the second one to be edited would have been the wrong one.

     What is left is the reason this filename still has to exist: a request for
     admin/ with no trailing document resolves here, and a static server with no
     index would answer it with a directory listing or a 404. Neither is a
     sensible place to land. The dashboard is.

     Three redirects, because each covers a case the others do not. The script
     runs first and uses replace() so this page never enters the history and Back
     does not bounce the reader straight back into it. The meta refresh covers
     scripting being off. The link covers both being off, and is the only one a
     screen reader will ever announce, which is why it reads as a sentence rather
     than as the word "here".
     ============================================================ -->
<script>location.replace("dashboard.html");</script>
<meta http-equiv="refresh" content="0; url=dashboard.html">
<link rel="canonical" href="dashboard.html">
<link rel="stylesheet" href="admin.css">
</head>
<body data-title="Admin console">
<div id="shell">
<main id="main">
  <h1 class="screen" tabindex="-1">Admin console</h1>
  <p class="lede">This address opens the dashboard.
    <a href="dashboard.html">Continue to the dashboard</a> if it has not already.</p>
  <p class="legal">Looking for the full screen index? It lives in the staging
  harness in the customer build, under Every screen.</p>
</main>
</div>
</body>
</html>
