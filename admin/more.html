<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Console - Admin - The Fit Club Courts</title>
<meta name="color-scheme" content="light dark">
<!-- The staging bridge, shared with the customer build one level up. Synchronous
     and ahead of the stylesheet because the first thing it does is settle the
     theme, and a theme settled after the first paint is a flash of the wrong
     one. system is this console's own default, which is what the Settings
     screen ships with selected; it applies only while nobody has chosen. -->
<script src="../staging-state.js" data-default-theme="system"></script>
<script src="../console-nav.js"></script>
<script src="../club.js"></script>
<script src="../scenarios.js"></script>
<link rel="stylesheet" href="admin.css">
<!-- The desktop rail, shared with the customer build. After admin.css, so the
     component's own rules win over the generic ones it happens to share a class
     name with. -->
<link rel="stylesheet" href="../console-nav.css">
</head>
<body data-title="Console" data-nav="console">
<div id="shell">
<main id="main">

  <h1 class="screen" tabindex="-1">Console</h1>
  <p class="legal">Every destination in this console, in one list.</p>

  <!-- ---------- WHY THIS PAGE STILL EXISTS ----------
       It used to be the place the bottom bar's fifth tab went, holding the eight
       tools that were used often enough to matter and not often enough to earn a
       tab. That is not what it is any more. The fifth tab opens the launcher now,
       which draws this same list over whatever page the reader was already on,
       and this page is what is left when that does not happen: a reader who typed
       the URL, a bookmark, a link from somewhere else.

       IT IS RENDERED, NOT WRITTEN. The list below comes from CONSOLE_NAV, the
       same array the rail, the tab bar, and the launcher draw. It used to be
       markup, and being markup is how five destinations ended up living here and
       in no navigation at all. A hand written copy of a list that exists
       elsewhere is a copy that will disagree with it, and this page is the proof:
       it disagreed for long enough that Check-in was unreachable from a laptop.

       WHAT WOULD HAVE TO BE TRUE TO DELETE IT. Three things, and none of them is
       true today. The Console control would have to be reachable on every screen
       a reader can land on, including the ones that draw a back arrow instead of
       a menu. Nothing would have to link here, which means the tab bar's href
       and the rail row's href both stop being real URLs and become buttons.
       And the launcher would have to be the answer for a reader whose script did
       not run, which it cannot be, because it is script. Until then this URL
       resolves to something rather than to a 404. -->
  <div id="moreList"></div>

  <!-- The honest version of the no-script story. The list above needs script,
       because it is drawn from the model rather than typed out, and the whole
       reason it is drawn from the model is that the typed out version drifted.
       Saying so is better than a silently empty page, and better than a second
       hand written list that would drift again. -->
  <noscript>
    <div class="card card--sunken">
      <p class="lede">This list is drawn from the console's navigation model,
      which needs script to render. With script off it cannot draw itself, and a
      second copy written by hand is the thing this page was changed to stop
      being.</p>
      <p class="lede">Every screen is still a real page in this folder. The
      dashboard is the way in.</p>
      <a class="textbtn" href="dashboard.html" style="margin-top:8px;">Open the Dashboard <span data-icon="arrowR"></span></a>
    </div>
  </noscript>

  <p class="sandbox">
    <span data-icon="info"></span>
    <span>Sandbox: Counts on this page are sample data.</span>
  </p>

</main>
</div>
<script src="admin.js"></script>
</body>
</html>
