      '<p class="legal" style="text-align:center">Arrival window: To be confirmed.</p></div>';
  } else {
    html += '<div class="qrbox">' +
      '<div class="qrlive" id="qrlive">' + qrMatrix(p.token) + "</div>" +
      '<p class="legal" style="text-align:center;max-width:34ch">Sample pattern. Not scannable in this prototype. ' +
      'This code works once: the first scan admits this participant and any later scan of the same code is refused.</p></div>';
  }
  html += "</div></div>";

  /* Both of these were a window.prompt and a window.alert. A modal browser dialog
     is the one control on the page that cannot be styled, cannot be read by the
     status region, and blocks the whole document, so both are inline disclosures. */
  const nameKey = "pn" + o.id + "-" + p.n;
  const shareKey = "ps" + o.id + "-" + p.n;
  html += '<div class="section"><ul class="rows">' +
    "<li>" + discloseRow(nameKey, "person", p.name ? "Change the name" : "Add a name", "Helps the front desk find this player") +
      (S.reveal[nameKey] ? passNamePanel(o, p, nameKey, "Display name for this pass", "Save the name",
        "A name only helps the front desk find this player by hand. The pass works without one, and the name is not inside the token.") : "") +
      "</li>" +
    "<li>" + discloseRow(shareKey, "share", "Send to this player", "They get their own pass link") +
      (S.reveal[shareKey]
        ? '<div class="card" style="margin-top:var(--s3)"><h3 class="sec">This pass\'s own link</h3>' +
          '<p class="code" style="margin-top:var(--s3);font-size:var(--fs-label);word-break:break-all">' + esc(passLink(p)) + "</p>" +
          '<div class="btn-stack" style="margin-top:var(--s3)">' +
          '<button class="btn btn--secondary btn--sm" data-action="copy" data-value="' + esc(passLink(p)) + '">Copy the link</button>' +
          navBtn("/t/pass/" + p.share,"Open it here") +
          "</div>" +
          '<p class="legal" style="margin-top:var(--s3)">' + icon("flask") +
          " <strong>Nothing is sent from this prototype.</strong> Copy the link and open it yourself to see what the player sees. " +
          "In the real build the organizer hands this out, and it opens this one pass only: Not the booking, not the other players, and not the organizer's details.</p>" +
          '<p class="legal" style="margin-top:var(--s2)">Whether these may go out by SMS is an open owner decision.</p></div>'
        : "") +
      "</li>" +
    "</ul></div>";

  html += '<div class="section"><div class="card card--sunken"><h2 class="sec">If the scan fails</h2>' +
    '<p class="code" style="margin-top:var(--s3)">' + esc(o.bookingCode) + "</p>" +
    '<p class="legal" style="margin-top:var(--s3)">Read out this code and the organizer name. Your name and number are not inside the pass.</p></div></div>';

  if (state === "live"){
    html += '<div class="card card--sunken hatch" style="margin-top:var(--s6);border:2px dashed var(--border-default)">' +
      '<p class="legal"><strong>Staging control.</strong></p>' +
      '<p style="margin-top:var(--s3)"><button class="btn btn--secondary btn--sm" data-action="passscan" data-id="' + esc(o.id) + '" data-n="' + p.n + '">Simulate a door scan</button></p></div>';
  } else {
    html += arrivalToggle();
  }

  return { id:"pub-pass", shell:"task", title:"Pass " + p.n, html:html,
    back:{ label:"All passes", to:"/booking/" + encodeURIComponent(o.bookingCode) + "/passes" },
    mount: null,
    dock:null };
}

/* ============================================================
   QR PASS MODAL
   The organizer's window onto every pass under one booking. One participant at a
   time; a carousel only when there is more than one participant to move between.
   ============================================================ */
var qrOpener = null;       /* the control that opened the modal, so focus can go back */

function qrOrder(){ return S.qr ? S.orders[S.qr.orderId] : null; }
function qrList(){ const o = qrOrder(); return o ? passesOf(o) : []; }

function passesLabel(o){
  const n = passesOf(o).length;
  return n === 1 ? "View QR pass" : "View " + n + " QR passes";
}

function qrPassMarkup(o, p){
  const list = passesOf(o);
  const st = passStatus(o, p);
  const scannable = st.key === "valid" || st.key === "checked_in";
  let h = '<article class="pass" aria-label="Pass ' + p.n + " of " + list.length + '">';
  h += '<div class="pass__top"><span class="pass__who">' + esc(p.name || ("Participant " + p.n)) + "</span>" +
    '<span class="pass__of">' + p.n + " of " + list.length + "</span></div>";

  if (scannable){
    h += '<div class="pass__qr"><div class="pass__qrbox">' + qrMatrix(p.token) + "</div></div>";
  } else {
    h += '<div class="pass__qr" style="background:transparent"><div class="pass__dead">' + icon(passStatusIcon(st.key)) +
      "<span>" + esc(st.key === "pending" ? "No QR code yet. Passes are generated once payment is confirmed."
        : st.key === "cancelled" ? "This pass was cancelled. The code no longer resolves."
        : "This pass has expired. The session has already ended.") + "</span></div></div>";
  }

  h += '<dl class="pass__facts">' +
    "<div><dt>Status</dt><dd>" + esc(st.label) + "</dd></div>" +
    "<div><dt>Booking number</dt><dd>" + esc(o.bookingCode) + "</dd></div>" +
    "<div><dt>Booking type</dt><dd>" + esc(bookingTypeLabel(o)) + "</dd></div>" +
    "<div><dt>Date and time</dt><dd>" + esc(o.meta.when) + "</dd></div>" +
    "<div><dt>Venue</dt><dd>" + esc(VENUE.name) + "</dd></div>" +
    (o.product === "court" ? "<div><dt>Court</dt><dd>Assigned on arrival</dd></div>"
                           : "<div><dt>Session</dt><dd>Open Play rotation</dd></div>") +
    "</dl>";
  h += '<p class="pass__note">Present this pass at the entrance.' +
    (st.note ? " " + esc(st.note) : "") + "</p>";
  h += "</article>";
  return h;
}

function paintQrModal(){
  const d = document.getElementById("qrmodal");
  const o = qrOrder();
  if (!o) return;
  const list = passesOf(o);
  const many = list.length > 1;
  const i = Math.max(0, Math.min(S.qr.index, list.length - 1));
  S.qr.index = i;
  const p = list[i];
  const st = passStatus(o, p);
  const downloadable = st.key === "valid" || st.key === "checked_in";

  const arrow = function(dir, where){
    const dis = dir < 0 ? i === 0 : i === list.length - 1;
    return '<button type="button" class="qrm__arrow" id="qrm-' + where + (dir < 0 ? "-prev" : "-next") + '"' +
      ' data-action="qrstep" data-d="' + dir + '"' + (dis ? " disabled" : "") +
      ' aria-label="' + (dir < 0 ? "Previous participant pass" : "Next participant pass") + '">' +
      icon(dir < 0 ? "arrow-l" : "arrow-r") + "</button>";
  };

  let h = '<div class="qrm">';
  h += '<div class="qrm__head"><div><h2 id="qrm-title">' + (many ? "Entry passes" : "Entry pass") + "</h2>" +
    '<p class="legal">' + esc(o.bookingCode) + " &middot; " + esc(bookingTypeLabel(o)) + "</p></div>" +
    '<button type="button" class="qrm__close" data-action="qrclose" aria-label="Close entry passes">' + icon("x") + "</button></div>";

  h += '<div class="qrm__body">' +
    '<div class="qrm__track" id="qrm-track" aria-live="polite">' + qrPassMarkup(o, p) + "</div>";
  if (many){
    h += '<p class="legal" style="margin-top:var(--s5);text-align:center">Swipe, or use the left and right arrow keys.</p>';
  }
  h += "</div>";

  /* The pager lives in the footer, not in the scrolling body. A previous button
     you have to scroll down to find is not a previous button. */
  h += '<div class="qrm__foot">';
  if (many){
    h += '<div class="qrm__pager">' + arrow(-1,"pg") +
      '<span class="qrm__meter">' +
      '<span class="qrm__dots" aria-hidden="true">' +
      list.map(function(_,k){ return "<i" + (k === i ? ' data-on="1"' : "") + "></i>"; }).join("") +
      "</span>" +
      '<span class="qrm__count">' + (i+1) + " of " + list.length + "</span>" +
      "</span>" + arrow(1,"pg") + "</div>";
  }
  h += '<button type="button" class="btn btn--primary' + (many ? "" : " btn--full") + '" data-action="qrdownload"' +
    (downloadable ? "" : " disabled") + '>' + icon("download") + "Download QR</button>";
  if (many){
    h += '<button type="button" class="btn btn--secondary" data-action="qrdownloadall">' + icon("download") + "Download all</button>";
    /* Saving several files in a row is a permission in every current browser, and
       it is asked for on the second file, not the first. Saying so here is the
       difference between a reader who allows it and a reader who thinks the
       button is broken. */
    h += '<p class="legal qrm__hint">One named PNG per participant. If your browser blocks multiple downloads, use Download QR on each pass.</p>';
  }
  h += "</div></div>";

  d.innerHTML = h;
}

function openQrModal(orderId, index){
  const o = S.orders[orderId];
  if (!o) return;
  qrOpener = document.activeElement;
  S.qr = { orderId:orderId, index: index || 0 };
  const d = document.getElementById("qrmodal");
  paintQrModal();
  if (!d.open) d.showModal();
  const c = d.querySelector(".qrm__close");
  if (c) c.focus();
}
function closeQrModal(){
  const d = document.getElementById("qrmodal");
  if (d.open) d.close();
}
function qrStep(delta, fromId){
  const list = qrList();
  if (!list.length) return;
  const next = S.qr.index + delta;
  if (next < 0 || next >= list.length) return;
  S.qr.index = next;
  paintQrModal();
  const d = document.getElementById("qrmodal");
  /* Keep the key or the tap on the same control it was pressed on, unless that
     control has just become the disabled end of the run. */
  let back = fromId ? d.querySelector("#" + fromId) : null;
  if (!back || back.disabled) back = d.querySelector(".qrm__arrow:not([disabled])") || d.querySelector(".qrm__close");
  if (back) back.focus();
  announce("Pass " + (next+1) + " of " + list.length + ", " + (list[next].name || ("participant " + list[next].n)));
}

/* ---------- the downloaded pass ----------
   More than the bare code: the mark, the participant, the booking, when and
   where, and one instruction. Drawn at 3x so the modules stay hard edged. */
var PASS_W = 1080, PASS_H = 1640;
function logoDataUrl(){
  const v = getComputedStyle(document.documentElement).getPropertyValue("--img-logo");
  const m = /url\(["']?(data:[^"')]+)["']?\)/.exec(v || "");
  return m ? m[1] : null;
}
function renderPassCanvas(o, p, cb){
  const c = document.createElement("canvas");
  c.width = PASS_W; c.height = PASS_H;
  const x = c.getContext("2d");
  const F = '"Helvetica Neue", Helvetica, Arial, sans-serif';
  const M = 84;                       /* page margin */
  const INK = "#141618", DIM = "#5C6169", RULE = "#D8D5CE";

  x.fillStyle = "#FFFFFF"; x.fillRect(0,0,PASS_W,PASS_H);

  function rule(y){ x.fillStyle = RULE; x.fillRect(M, y, PASS_W - M*2, 2); }
  function text(s, y, size, weight, color, align){
    x.fillStyle = color || INK;
    x.font = (weight || 400) + " " + size + "px " + F;
    x.textAlign = align || "left";
    x.textBaseline = "alphabetic";
    x.fillText(s, align === "center" ? PASS_W/2 : M, y);
  }
  function fact(label, value, y){
    x.font = "600 26px " + F; x.fillStyle = DIM; x.textAlign = "left";
    x.fillText(String(label).toUpperCase(), M, y);
    x.font = "700 32px " + F; x.fillStyle = INK; x.textAlign = "right";
    x.fillText(String(value), PASS_W - M, y);
    x.fillStyle = RULE; x.fillRect(M, y + 22, PASS_W - M*2, 1);
  }

  const st = passStatus(o, p);
  const list = passesOf(o);

  function paintRest(){
    /* Clear of the mark above it. The wordmark is close to 1.9:1, so a 300px
       drawing of it is 158 tall and finishes at 246. */
    let y = 306;
    text("ENTRY PASS", y, 26, 700, DIM); y += 14;
    x.font = "700 26px " + F; x.textAlign = "right"; x.fillStyle = DIM;
    x.fillText(bookingTypeLabel(o).toUpperCase(), PASS_W - M, y - 14);
    y += 20; rule(y); y += 78;

    /* participant */
    x.textAlign = "left";
    let name = p.name || ("Participant " + p.n);
    x.font = "800 62px " + F;
    while (x.measureText(name).width > PASS_W - M*2 && name.length > 8) name = name.slice(0, -2);
    text(name, y, 62, 800, INK); y += 38;
    text("Pass " + p.n + " of " + list.length, y, 30, 600, DIM);

    /* the code, with a real quiet zone around it */
    const qz = 44;
    const box = 560;
    const bx = (PASS_W - box) / 2, by = y + 54;
    x.fillStyle = "#FFFFFF"; x.fillRect(bx, by, box, box);
    x.strokeStyle = RULE; x.lineWidth = 2; x.strokeRect(bx + 1, by + 1, box - 2, box - 2);
    if (st.key === "valid" || st.key === "checked_in"){
      drawQrOnCanvas(x, p.token, bx + qz, by + qz, box - qz*2);
    } else {
      x.fillStyle = DIM; x.font = "700 34px " + F; x.textAlign = "center";
      x.fillText(st.label, PASS_W/2, by + box/2);
    }
    y = by + box + 66;

    fact("Booking number", o.bookingCode, y); y += 74;
    fact("Date and time", o.meta.when, y); y += 74;
    fact("Venue", VENUE.name, y); y += 74;
    fact("Status", st.label, y); y += 92;

    x.textAlign = "center";
    text("Present this pass at the entrance.", y, 34, 700, INK, "center"); y += 44;
    text(VENUE.area, y, 26, 400, DIM, "center"); y += 52;
    text("Staging sample. This pattern is not a scannable code.", y, 22, 400, DIM, "center");

    cb(c);
  }

  const src = logoDataUrl();
  if (!src){ paintRest(); return; }
  const img = new Image();
  img.onload = function(){
    const w = 300, h = w * (img.height / img.width);
    x.drawImage(img, (PASS_W - w)/2, 88, w, h);
    paintRest();
  };
  img.onerror = function(){ paintRest(); };
  img.src = src;
}

function slugPart(s){ return String(s || "").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function passFilename(o, p){
  return "TFC-BOOKING-" + slugPart(o.bookingCode) + "-" +
    (slugPart(p.name) || ("Pass-" + p.n)) + "-QR.png";
}
function triggerDownload(href, filename){
  const a = document.createElement("a");
  a.href = href; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function saveCanvas(c, filename){
  if (c.toBlob){
    c.toBlob(function(blob){
      if (!blob){ triggerDownload(c.toDataURL("image/png"), filename); return; }
      const url = URL.createObjectURL(blob);
      triggerDownload(url, filename);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
    }, "image/png");
  } else {
    triggerDownload(c.toDataURL("image/png"), filename);
  }
}
function downloadPass(o, p){
  renderPassCanvas(o, p, function(c){ saveCanvas(c, passFilename(o, p)); });
  announce("Downloading the pass for " + (p.name || ("participant " + p.n)) + ".");
}
/* No ZIP: this build carries no archiver and fetches nothing, so Download all is
   one clearly named PNG per participant, saved in sequence. Browsers gate the
   second and later files behind an allow-multiple-downloads permission, so the
   run is paced and the modal says plainly that the prompt is coming. A declined
   prompt costs the reader nothing: Download QR on each pass still works. */
function downloadAllPasses(o){
  const list = passesOf(o).filter(function(p){
    const k = passStatus(o, p).key;
    return k === "valid" || k === "checked_in";
  });
  if (!list.length){ announce("There are no downloadable passes on this booking."); return; }
  let i = 0;
  (function next(){
    if (i >= list.length){ announce("Saved " + list.length + " " + plural(list.length,"pass","passes") + "."); return; }
    const p = list[i++];
    renderPassCanvas(o, p, function(c){
      saveCanvas(c, passFilename(o, p));
      setTimeout(next, 400);
    });
  })();
  announce("Downloading " + list.length + " " + plural(list.length,"pass","passes") + ", one file each.");
}

/* ---------- SCR pub-find ---------- */
function scrFind(){
  const stage = S.findStage || "entry";
  let html = '<h1 class="screen">Find My Booking</h1>';
  html += '<p class="lede" style="margin-top:var(--s3)">Enter your booking code and the organizer mobile number. A code on its own is not enough to open a booking.</p>';
  if (stage === "entry"){
    html += '<form class="form section" id="findform" novalidate>' +
      fieldHtml("code","Booking code",{ value:S.findCode || "", placeholder:"ABCD EFGH" }) +
      fieldHtml("fmobile","Organizer mobile",{ type:"tel", inputmode:"tel", autocomplete:"tel", placeholder:"09XX XXX XXXX", hint:"We accept 09, +639, spaces, and hyphens." }) +
      "</form>";
    html += '<div class="section"><div class="btn-stack">' + navBtn("/signin","Sign in instead") + navBtn("/visit","Contact the front desk") + "</div></div>";
    return { id:"pub-find", shell:"browse", title:"Find My Booking", html:html,
      dock:{ action:{ label:"Find my booking", action:"findsubmit" }, note:"For privacy, the same message is shown whether or not a booking matches." } };
  }
  if (stage === "sent"){
    html += '<div class="section">' + plate("verification_sent",{
      truth:["If those details match a booking, a verification step has been sent."],
      meta:["Verification channel: To be confirmed.","You can ask for a new code shortly."] }) + "</div>";
    html += '<form class="form section" id="otpform" novalidate>' +
      fieldHtml("otp","Verification code",{ inputmode:"numeric", autocomplete:"one-time-code", placeholder:"Paste or type the code" }) + "</form>";
    html += '<div class="section"><button class="btn btn--ghost" data-action="findreset">Use different details</button></div>';
    return { id:"pub-find", shell:"browse", title:"Find My Booking", html:html,
      dock:{ action:{ label:"Verify and open my booking", action:"findverify" },
             note:"On this staging build any code opens the most recent simulated booking." } };
  }
  html += '<div class="section">' + plate("no_match",{
    truth:["We could not open a booking with those details."],
    meta:["This message is the same whether or not a booking exists, so nothing is revealed about anyone's phone number."] }) + "</div>";
  return { id:"pub-find", shell:"browse", title:"Find My Booking", html:html,
    dock:{ action:{ label:"Try different details", action:"findreset" } } };
}

/* ---------- SCR sys-link ---------- */
function scrLink(params){
  const kind = (params && params.kind) || "invalid";
  const map = {
    expired:"This link has expired.",
    revoked:"This link is no longer usable.",
    invalid:"This link is not valid."
  };
  let html = '<h1 class="screen">' + esc(map[kind] || map.invalid) + "</h1>";
  html += '<p class="lede" style="margin-top:var(--s3)">We are not showing what it pointed at. That protects the booking behind it.</p>';
  html += '<div class="section"><div class="card"><p class="legal">Reference for support: FCC-' + esc(String(1000 + (S.seq * 37) % 8999)) + "</p></div></div>";
  html += '<div class="section"><div class="btn-stack">' + navBtn("/find","Find My Booking") + navBtn("/visit","Visit / Contact") + navBtn("/","Go to the home screen") + "</div></div>";
  return { id:"sys-link", shell:"token", title:"Link not valid", html:html,
    dock:{ action:{ label:"Find My Booking", action:"nav", to:"/find" } } };
}

/* ---------- SCR sys-interruption ---------- */
function scrInterruption(){
  let html = '<h1 class="screen">Some things are paused</h1>';
  html += '<div class="section">' + plate("interruption",{
    truth:["We are not accepting new bookings while this is happening."],
    meta:["Last updated " + clockTime(now()), "Nothing has been reserved or charged."] }) + "</div>";
  html += '<div class="section"><h2 class="sec">What still works</h2><ul class="rows">' +
    ["Opening an existing booking with your code","Directions and contact details","Prices"].map(function(t){
      return '<li class="row"><span class="row__main"><span class="row__title" style="font-size:var(--fs-body);font-weight:400">' + esc(t) + "</span></span>" + chip("available") + "</li>";
    }).join("") + "</ul></div>";
  html += '<div class="section"><div class="btn-stack">' + navBtn("/find","Find My Booking") + navBtn("/visit","Visit / Contact") + navBtn("/rates","Rates &amp; How It Works") + "</div></div>";
  return { id:"sys-interruption", shell:"token", title:"Service interruption", html:html,
    dock:{ action:{ label:"Try again", action:"retry" } } };
}

<script>

/* ---------- SCR pub-openplay ---------- */
function scrOpenPlay(){
  let html = '<p class="sampleband">' + icon("flask") +
    "<span>Sample data: The Open Play schedule is not confirmed yet. These windows are placeholders.</span></p>";
  html += '<h1 class="screen" style="margin-top:var(--s5)">Open Play</h1>';
  html += '<p class="lede" style="margin-top:var(--s3)">An individual admission where you join and rotate with other attendees. You do not reserve a whole court. ₱150 per player.</p>';

    html += '<div class="section"><div class="card"><p><strong>No Open Play is scheduled yet.</strong></p>' +

      '<div style="display:flex;justify-content:space-between;width:100%;gap:var(--s3);align-items:flex-start">' +

      chip(full ? "full" : cap === "almost" ? "almost" : "places") + "</div>" +
      (full
        ? '<p class="legal">This window is full. Nothing is being kept for you.</p>'

/* ---------- SCR pub-op-window ---------- */
function scrOpWindow(params){
  const w = OP_WINDOWS[params.windowId];
  if (!w) return scrLink({});
  const cap = windowCapacityState(w.id);
  const full = cap === "full";
  const closed = w.state === "registration_closed";
  const qty = S.draft.qty;
  const total = RATE_OPENPLAY * qty;

  let html = stepRail(1,4,"Choose your window");
  html += '<h1 class="screen">' + esc(windowTitle(w)) + "</h1>";
  html += '<p class="txn" style="margin-top:var(--s2)">' + esc(w.start + " to " + w.end) + "</p>";
  html += '<p style="margin-top:var(--s3)">' + chip(full ? "full" : closed ? "regclosed" : cap === "almost" ? "almost" : "places") + "</p>";
  html += '<p class="lede" style="margin-top:var(--s4)">₱150 per player.</p>';

  html += '<div class="section"><div class="card"><h2 class="sec">What you are buying</h2>' +
    '<p style="margin-top:var(--s2)">This is an individual admission, not a court rental. Players rotate with other attendees.</p>' +
    '<p class="legal" style="margin-top:var(--s3)">Arrival information: To be confirmed.</p></div></div>';

  if (full){
    html += '<div class="section"><div class="banner">' + icon("alert") +
      "<div><p><strong>This window is full.</strong></p>" +
      '<p class="legal">There is nothing to buy on this screen and no place is being kept for you. Two things are open right now.</p></div></div>' +
      '<div style="margin-top:var(--s4)">' + duoCTA() + "</div></div>";
    html += footerBlock();
    return { id:"pub-op-window", shell:"task", title:"Open Play window", html:html,
      back:{ label:"Change window", to:"/openplay" }, dock:null };
  }

  /* Minus, the number, and plus in one frame. The number is the field: typing into
     it and pressing either end are the same edit to the same value, which is why
     they are no longer two controls in two places on the screen.
     Both ends refuse at the same numbers the typed value is clamped to, so nothing
     here can put a quantity on the order that the window cannot sell. */
  const atCap = qty >= DEMO_QTY_CAP;
  html += '<div class="section"><h2 class="sec" id="lbl-qty">How many admissions?</h2>' +
    '<div class="qtysel' + (atCap ? " is-max" : "") + '" role="group" aria-labelledby="lbl-qty">' +
    '<button class="qtysel__btn" data-action="qty" data-d="-1" data-fk="qtyminus" aria-label="One fewer admission"' +
      (qty <= 1 ? " disabled" : "") + ">" + icon("minus") + "</button>" +
    '<input class="qtysel__num" id="qtyinput" type="text" inputmode="numeric" autocomplete="off"' +
      ' value="' + qty + '" data-action="qtyinput" aria-label="Number of admissions"' +
      (atCap ? ' aria-describedby="qty-cap"' : "") + ">" +
    '<button class="qtysel__btn" data-action="qty" data-d="1" data-fk="qtyplus" aria-label="One more admission"' +
      (atCap ? " disabled" : "") + ">" + icon("plus") + "</button>" +
    "</div>" +
    '<p class="qtysel__unit">' + qty + " " + plural(qty,"admission","admissions") + " at ₱150 each</p>" +
    (atCap
      ? '<p class="atcap" id="qty-cap" style="margin-top:var(--s3)">' + icon("alert") +
        "<span>Limit reached. Open Play is at its " + OP_CAPACITY + "-player capacity.</span></p>"
      : "") +
    '<p class="legal" style="margin-top:var(--s3)">Capacity for the window is ' + OP_CAPACITY + " admissions by default.</p></div>";

  return { id:"pub-op-window", shell:"task", title:"Open Play window", html:html,
    back:{ label:"Change window", to:"/openplay" },
    dock:{ summary:{ label:"₱150 per player", value:peso(total) },
           action:{ label:"Continue with " + qty + " " + plural(qty,"admission","admissions"), action:"gotoplayers", id:w.id },
           note:"Nothing is held yet. The next step collects your details." } };
}

/* ---------- SCR pub-op-players ---------- */
function scrOpPlayers(params){
  const w = OP_WINDOWS[params.windowId];
  if (!w) return scrLink({});
  const d = S.draft;
  const qty = d.qty;

  html += '<div class="section"><div class="card"><dl class="dl">' +
    "<div><dt>Window</dt><dd>" + esc(windowTitle(w)) + "</dd></div>" +

    '<p class="legal" style="margin-top:var(--s3)">₱150 x ' + qty + " " + esc(plural(qty,"admission","admissions")) + " = " + esc(peso(total)) + ". No fees or taxes are added to this total.</p></div></div>";

    fieldHtml("email","Email",{ type:"email", inputmode:"email", autocomplete:"email", optional:true, value:d.email }) +

  html += '<div class="section form">' +
    '<div class="check' + (S.formErrors.policy ? " is-invalid" : "") + '"><input type="checkbox" id="policy"' + (d.policy ? " checked" : "") + (S.formErrors.policy ? ' aria-describedby="policy-err"' : "") + '><label for="policy"><span>I have read the booking terms and I understand that these places are confirmed only after payment is verified.</span></label></div>' +
    (S.formErrors.policy ? '<p class="fielderr" id="policy-err">' + icon("alert") + "<span>" + esc(S.formErrors.policy) + "</span></p>" : "") +
    '<div class="check check--detached"><input type="checkbox" id="marketing"><label for="marketing"><span>Send me news about Open Play schedules. This is optional and separate from your booking messages.</span></label></div>' +
    "</div>";

  html += '<p class="legal section">Nothing is held yet. Places are held as one block.</p>';

  return { id:"pub-op-players", shell:"task", title:"Organizer and player names", html:html,

    dock:{ summary:{ label:"Total due", value:peso(total) },
           action:{ label:"Hold " + qty + " " + plural(qty,"admission","admissions"), action:"holdop", id:w.id },
           note:"No payment is taken on this step. Places are held for " + HOLD_MINUTES + " minutes while you pay." } };
}

/* ---------- SCR pub-save-details ---------- */
function scrSave(params){
  const o = S.orders[params.orderId];
  if (!o) return scrLink({});
  if (o.orderStatus !== "confirmed" && o.orderStatus !== "checked_in") return scrLink({ kind:"invalid" });
  const stage = S.saveStage || "offer";
  let html = '<h1 class="screen">Save your details?</h1>';
  if (stage === "done"){
    html += '<div class="section">' + plate("saved",{ meta:["Bookings made with this verified mobile number are now linked to you."] }) + "</div>";
    html += '<p class="legal section">No booking is linked because two records share a name. Only a verified contact channel links anything.</p>';
    return { id:"pub-save-details", shell:"task", title:"Save your details", html:html,
      back:{ label:"Back to booking", to:"/booking/" + encodeURIComponent(o.bookingCode) },
      dock:{ action:{ label:"See what is upcoming", action:"nav", to:"/me" } } };
  }
  html += '<p class="lede" style="margin-top:var(--s3)">Everything below is already filled in from this booking. There is nothing to retype and no password to create.</p>';
  html += '<div class="section"><div class="card"><dl class="dl">' +
    "<div><dt>Name</dt><dd>" + esc(o.organizer.name) + "</dd></div>" +
    "<div><dt>Mobile</dt><dd>" + esc(o.organizer.mobile) + "</dd></div>" +
    "</dl><p class=\"legal\" style=\"margin-top:var(--s3)\">Verification channel: To be confirmed.</p></div></div>";
  html += '<div class="section"><h2 class="sec">What an account gives you</h2><ul class="rows">' +
    ["Checkout prefilled next time","Your upcoming bookings in one place","Your booking history","Saved groups for Open Play"].map(function(t){
      return '<li class="row"><span class="row__main"><span class="row__title" style="font-size:var(--fs-body);font-weight:400">' + esc(t) + "</span></span></li>";
    }).join("") + "</ul></div>";
  html += '<div class="section form"><div class="check check--detached"><input type="checkbox" id="marketing2"><label for="marketing2"><span>Send me news about Open Play schedules. Optional, and separate from your booking messages.</span></label></div></div>';
  html += '<div class="section"><button class="btn btn--secondary btn--sm" data-action="declinesave" data-id="' + esc(o.id) + '">No thanks</button>' +
    '<p class="legal" style="margin-top:var(--s2)">Declining changes nothing about this booking.</p></div>';
  return { id:"pub-save-details", shell:"task", title:"Save your details", html:html,
    back:{ label:"Back to booking", to:"/booking/" + encodeURIComponent(o.bookingCode) },
    dock:{ action:{ label:"Save my details", action:"dosave", id:o.id } } };
}


/* ---------- SCR tok-name ---------- */
function scrTokName(params){
  const t = params.token;
  if (t === "expired") return scrLink({ kind:"expired" });
  if (t === "revoked") return scrLink({ kind:"revoked" });
  const o = S.orders[t];
  if (!o || o.product !== "openplay") return scrLink({});
  /* Names are collected against confirmed admissions only. Inviting someone to
     name a place that is unpaid or released would assert a booking that is not there. */
  const stn = displayStatus(o);
  if (stn.key !== "confirmed" && stn.key !== "checked_in"){
    let h = '<h1 class="screen">Names cannot be added yet</h1>';
    h += '<div class="section">' + plate(stn.key,{ phrase:stn.phrase,
      truth:["These admissions are not confirmed, so there is nothing to name yet."],
      meta:["Order reference " + o.bookingCode] }) + "</div>";
    return { id:"tok-name", shell:"token", title:"Add your display name", html:h, dock:null };
  }
  const named = o.admissions.filter(function(a){ return a.name; }).length;
  let html = '<h1 class="screen">Add player names</h1>';
  html += '<p class="lede" style="margin-top:var(--s3)">' + esc(o.meta.when) + "</p>";
  html += '<p class="legal" style="margin-top:var(--s2)">A name on every admission is what lets the front desk match a pass to the person holding it.</p>';
  html += '<div class="section form" id="nameform">';
  o.admissions.forEach(function(a,i){
    html += fieldHtml("n" + i, "Player " + (i+1) + " display name", { optional:true, value:a.name || "" });
  });
  html += "</div>";
  html += '<p class="legal section">' + named + " of " + o.admissions.length + " named. The booking stays fully valid either way.</p>";
  html += '<p class="legal">No other participant\'s contact details are shown here, and neither are the organizer\'s.</p>';
  return { id:"tok-name", shell:"token", title:"Add your display name", html:html,
    dock:{ action:{ label:"Save player names", action:"savenames", id:o.id } } };
}

/* ---------- SCR tok-pass ----------
   One pass, opened by the player it was sent to. It deliberately shows less than
   the organizer's pass screen: No pass list, no other players, no organizer name
   or number, and no way to reach the booking. The token is the only thing the
   holder has, and it must not become a key to the rest of the order. */
function scrTokPass(params){
  const t = params.token;
  if (t === "expired") return scrLink({ kind:"expired" });
  if (t === "revoked") return scrLink({ kind:"revoked" });
  const hit = findShared(t);
  if (!hit) return scrLink({});
  const o = hit.o, p = hit.p;
  const state = passState(o, p);

  /* A pass is only ever as true as the booking under it, and this holder cannot
     see the booking, so the reason has to be stated here in full. */
  if (state === "none"){
    const st = displayStatus(o);
    let h = '<h1 class="screen">This pass is not active</h1>';
    h += '<div class="section">' + plate(st.key,{ phrase:st.phrase,
      truth:["There is no confirmed booking behind this pass, so there is nothing to scan."],
      meta:["Ask the organizer who sent you this link."] }) + "</div>";
    return { id:"tok-pass", shell:"token", title:"Pass not active", html:h, dock:null };
  }

  let html = '<h1 class="screen">Your pass</h1>';
  html += '<p class="lede" style="margin-top:var(--s3)">' + esc(o.meta.when) + "</p>";
  html += '<p class="legal" style="margin-top:var(--s2)">Pass ' + p.n + " of " + passesOf(o).length +
    ", sent to you by the organizer. It admits one person.</p>";

  html += '<div class="section"><div class="passcard">' +
    '<div class="passcard__top">' + icon(o.product === "court" ? "court" : "users") +
    '<span class="passcard__n">' + esc(p.name || ("Player " + p.n)) + "</span>" +
    '<span style="flex:1"></span>' + passChip(state) + "</div>";

  if (state === "used"){
    html += '<div class="stamp">' + icon("check-double") +
      '<p class="display" style="margin-top:var(--s3)">Checked in</p>' +
      '<p class="legal" style="margin-top:var(--s3);color:var(--text-inverse-secondary)">' +
      esc(clockTime(p.usedAt)) + " by " + esc(p.usedBy || "Front Desk") + ". This pass cannot be used again.</p></div>";
  } else if (state === "dormant"){
    html += '<div class="qrbox"><div class="qrdead">' + icon("clock") +
      "<span>Opens 30 minutes before your time. There is nothing to scan yet.</span></div>" +
      '<p class="legal" style="text-align:center">Arrival window: To be confirmed.</p></div>';
  } else {
    html += '<div class="qrbox">' +
      '<div class="qrlive" id="qrlive">' + qrMatrix(p.token) + "</div>" +
      '<p class="legal" style="text-align:center;max-width:34ch">Sample pattern. Not scannable in this prototype. ' +
      'This code works once: the first scan admits this participant and any later scan of the same code is refused.</p></div>';
  }
  html += "</div></div>";

  const nameKey = "tp" + p.share;
  html += '<div class="section"><ul class="rows"><li>' +
    discloseRow(nameKey, "person", p.name ? "Change your name" : "Add your name", "Helps the front desk find you") +
    (S.reveal[nameKey] ? passNamePanel(o, p, nameKey, "Your display name", "Save my name",
      "A name only helps the front desk find you by hand. Your pass works without one, and the name is not inside the token.") : "") +
    "</li></ul></div>";

  html += '<div class="section"><div class="card card--sunken"><h2 class="sec">If the scan fails</h2>' +
    '<p class="legal" style="margin-top:var(--s3)">Give the front desk your name and say who organized the booking. ' +
    "For privacy, the booking code is not shown on a shared pass: Ask the organizer for it.</p></div></div>";

  if (state === "live"){
    html += '<div class="card card--sunken hatch" style="margin-top:var(--s6);border:2px dashed var(--border-default)">' +
      '<p class="legal"><strong>Staging control.</strong></p>' +
      '<p style="margin-top:var(--s3)"><button class="btn btn--secondary btn--sm" data-action="passscan" data-id="' + esc(o.id) + '" data-n="' + p.n + '">Simulate a door scan</button></p></div>';
  } else if (state === "dormant"){
    html += arrivalToggle();
  }

  return { id:"tok-pass", shell:"token", title:"Your pass", html:html,
    mount: null,
    dock:null };
}

/* ---------- SCR tok-quote ---------- */
function scrTokQuote(params){
  const inq = S.inquiries[params.token];
  if (!inq) return scrLink({});
  let html = '<h1 class="screen">Private Event quote</h1>';
