<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Club Courts Staging</title>

<!-- The staging bridge. Synchronous and in the head, not deferred and not at the
     foot with the rest of the script, because the first thing it does is settle
     the theme, and a theme settled after the first paint is a flash of the wrong
     one. It is also the only external script this document loads: the build is
     otherwise self contained, and it stops being so here because the admin
     console is a separate document and a dial they both read cannot live inside
     either of them. See staging-state.js for what crosses and what does not. -->
<script src="staging-state.js" data-default-theme="dark"></script>

<!-- The console's destination list. The staff shell draws the same desktop
     sidebar the admin console does, from the same array, so a screen added to
     one navigation is added to both. Deferred is fine here: nothing it holds is
     needed before the first paint, unlike the theme above it. Not deferred, all
     the same: the router at the foot of this file calls render() while the
     document is still parsing, and a deferred script would not have run yet. -->
<script src="console-nav.js"></script>

<!-- The club itself: One address, one pair of opening times, read by both
     builds. See club.js for which build won which argument. -->
<script src="club.js"></script>

<!-- The eleven scenarios, shared with the console. Each one carries its own
     seed and its own description of what the console should show, so the
     harness applies a recipe rather than branching on a key. -->
<script src="scenarios.js"></script>

<!-- The desktop rail. Same component, same stylesheet, both builds. It names no
     colours: every value is a token, and this document declares all of them, which
     is what lets one sheet serve two palettes that are inverses of each other.
     Layout is not in it. How this shell reflows around the rail is below, with the
     rest of this document's desktop rules. -->
<link rel="stylesheet" href="console-nav.css">

<!-- Fonts are served from ./fonts, not from a font CDN. The faces are declared in the
     sheet below. Only these two are preloaded: they are the ones the first screen
     paints with, and preloading the other eight would compete with them for the same
     connection to no purpose, since the browser fetches the rest on demand. -->
<link rel="preload" href="fonts/archivo-black-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ============================================================
   FONTS, SELF HOSTED
   Both families are served from ./fonts. Nothing here reaches a font CDN, so the
   typography survives with no network beyond this origin and there is no third
   party in the request path for a page that shows someone's booking.

   Two files per face, split latin and latin-ext, which is how both families are
   published. The split is not busywork: the peso sign is U+20B1, and U+20B1 sits in
   latin-ext rather than in latin. Ship only the latin file and every price on the
   site renders its numerals in Archivo Black and its currency symbol in whatever
   the fallback font is, mid-word. The unicode-range on each pair is what lets the
   browser fetch the second file only when a page actually needs it.

   font-display:swap. The fallback stack is metric-wrong either way, so a flash of
   fallback text beats a flash of no text.

   SIL Open Font License 1.1, both families. See fonts/OFL.txt.
   ============================================================ */
@font-face{
  font-family:"Archivo Black"; font-style:normal; font-weight:400; font-display:swap;
  src:url("fonts/archivo-black-latin-400.woff2") format("woff2");
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face{

  src:url("fonts/archivo-black-latin-ext-400.woff2") format("woff2");
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;

  /* Two colours and their tints. The ink is #171717 and the paper is #F5F3DC, a warm
     cream rather than a cold off white, and every surface below is one of the two with
     a little of the other mixed in. The palette rule is unchanged: no third hue. */

  --ink-700:#333330;
  --ink-600:#57574E;
  --ink-400:#8B8B7F;
  --ink-200:#C9C7B2;
  --paper-000:#FAF9EA;
  --paper-100:#F5F3DC;

  --surface-sunken:#E9E6CB;

  --text-secondary:#57574E;

  --border-strong:#171717;

     down onto it. Same ink as every other shadow here, only carried further,
     because a lifted control is further from what it sits on. */
  --shadow-lift:rgba(23,23,23,0.26);
  --shadow-press:rgba(23,23,23,0.14);
}

/* ---------- DARK tokens. Near black, and warm cream on top of it. ----------
   The base surface is #171717 flat. The two surfaces either side of it are the same
   near black lifted or dropped, never tinted toward another hue, so a full screen of
   it stays one colour. Declared twice on purpose: once for the system preference and
   once for the explicit toggle, because the toggle has to be able to win in both
   directions. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#171717; --surface-raised:#1F1F1F; --surface-sunken:#101010;
    --surface-inverse:#F5F3DC; --text-primary:#F5F3DC; --text-secondary:#A9A794;
    --text-inverse:#171717; --text-inverse-secondary:#4A4A42;
    --border-default:#6F6F63; --border-strong:#F5F3DC; --hairline:#2F2F2C;
    --focus-ring:#F5F3DC; --focus-halo:#171717;
    --ghost-fill:8,8,8; --ghost-edge:246,244,221;
    --overlay:rgba(8,8,8,0.80); --hatch:rgba(245,243,220,0.18);
    --hatch-strong:rgba(245,243,220,0.28); --shadow-print:rgba(0,0,0,0.55);
    --shadow-dock:rgba(0,0,0,0.45); --shadow-card:rgba(0,0,0,0.35);
    --shadow-lift:rgba(0,0,0,0.62); --shadow-press:rgba(0,0,0,0.42);
  }
}
:root[data-theme="dark"]{
  --surface:#171717; --surface-raised:#1F1F1F; --surface-sunken:#101010;
  --surface-inverse:#F5F3DC; --text-primary:#F5F3DC; --text-secondary:#A9A794;
  --text-inverse:#171717; --text-inverse-secondary:#4A4A42;
  --border-default:#6F6F63; --border-strong:#F5F3DC; --hairline:#2F2F2C;
  --focus-ring:#F5F3DC; --focus-halo:#171717;
  --ghost-fill:8,8,8; --ghost-edge:246,244,221;
  --overlay:rgba(8,8,8,0.80); --hatch:rgba(245,243,220,0.18);
  --hatch-strong:rgba(245,243,220,0.28); --shadow-print:rgba(0,0,0,0.55);
  --shadow-dock:rgba(0,0,0,0.45); --shadow-card:rgba(0,0,0,0.35);
  --shadow-lift:rgba(0,0,0,0.62); --shadow-press:rgba(0,0,0,0.42);
}

/* ---------- TYPE, SPACE, SHAPE ---------- */
:root{
  /* Two families and nothing else. Archivo Black sets anything that names a thing:
     headings and the label on a call to action. IBM Plex Mono sets everything else,
     which is most of the page. The split is the hierarchy, so the mono never has to
     shout and the black never has to carry a paragraph. */
  --font-display:"Archivo Black","Archivo",Impact,"Haettenschweiler","Arial Black",sans-serif;
  --font:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  /* The weight ladder, and the whole of it sits a step higher than it first did.
     IBM Plex Mono runs lighter than a proportional face at the same number, and at
     200 the note text was reading as grey rather than as type. Every rung moved up
     one: the relationships are unchanged, so notes are still the lightest thing on
     the page and the navigation is still lighter than body copy, but the floor is
     no longer thin. 200 is not loaded any more because nothing uses it. */
  --fw-note:300; --fw-nav:400; --fw-body:500; --fw-med:600;
  /* Faux bold would smear Archivo Black, which has no second face to interpolate to,
     so the browser is told never to invent one. */
  font-synthesis-weight:none;
  --fs-display:34px; --lh-display:38px;
  --fs-h1:30px;  --lh-h1:34px;
  --fs-h2:22px;  --lh-h2:28px;
  --fs-h3:18px;  --lh-h3:25px;
  --fs-body:18px;--lh-body:27px;
  --fs-txn:22px; --lh-txn:28px;
  --fs-amount:34px; --lh-amount:38px;
  --fs-code:26px; --lh-code:32px;
  --fs-label:16px; --lh-label:22px;
  --fs-legal:15px; --lh-legal:23px;
  --fs-eyebrow:13px; --lh-eyebrow:17px;
  --fs-tab:12px; --lh-tab:14px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:56px;
  --gutter:20px; --card-pad:20px; --block-gap:24px; --section-gap:32px;
  --pad-top:20px;
  /* Controls and cards are soft now. Photography is not: the hero, the film strip,
     and every photograph stay at 90 degrees, which is what keeps the rounding
     legible as a property of the interface rather than of the page. */
  --r-chip:999px; --r-input:12px; --r-card:16px; --r-btn:14px; --r-plate:14px; --r-sheet:20px; --r-pill:999px;

  /* GHOST GLASS. Two tint directions, as rgb triples so opacity can be chosen at
     each use. --ghost-fill is the wash inside a surface and --ghost-edge is the
     hairline around it. In the dark theme the wash is near black and the edge is
     cream; in the light theme both are ink, because a cream edge on a cream page is
     not an edge. Anything sitting on the hero photograph overrides --ghost-edge to
     cream locally, whatever the theme is doing. */
  --ghost-fill:23,23,23;
  --ghost-edge:23,23,23;
  /* Blur is deliberately tiny everywhere. The photograph is the dominant layer and a
     heavy blur is how you lose it while pretending you have not. */
  --ghost-blur:1px;
  --bar-w:6px;
  --tap-min:48px; --tap-row:52px; --tap-decision:58px;
  --appbar-h:56px; --tabbar-h:62px;
  --dock-h:0px;
  /* Three widths, deliberately separate. --shell-max is the page container and
     grows to a real desktop width. --measure is the longest a line of body copy
     may get, whatever the container does. --content-max stays the small-screen
     reading column that the bottom sheet and the dock are built around. */
  --content-max:34rem;
  --shell-max:34rem;
  --measure:34rem;
  /* FULL BLEED. The distance from the edge of the content column out to the edge of
     the viewport, resolved against whichever element uses it: 50% is half that
     element's containing block, 50vw is half the viewport. A negative margin of
     --bleed takes a section out to both viewport edges; the same figure as padding
     puts its words back on the content column, so photography can run edge to edge
     while type stays on the 1280 to 1400px grid. Both halves are measured the same
     way, so they cannot drift apart and no gutter can survive between them.
     It self corrects for the scrollbar: 50vw counts it and 50% does not, so the
     section overhangs by half a scrollbar at each end and is clipped there. That
     is deliberate. The alternative, subtracting nothing, leaves a visible sliver of
     page background down one side. Nothing scrolls sideways as a result, because
     body already clips the horizontal overflow. */
  --bleed:calc(50vw - 50%);
  --dur-fast:120ms; --dur-sheet:180ms; --dur-ui:200ms; --ease:cubic-bezier(.2,.7,.3,1);
}
@media (max-width:359px){ :root{ --card-pad:16px; } }
@media (prefers-reduced-motion: reduce){ :root{ --dur-fast:0.01ms; --dur-sheet:0.01ms; --dur-ui:0.01ms; } }

/* ---------- RESET ---------- */
*,*::before,*::after{ box-sizing:border-box; }
/* No accent hue may reach the page, including the ones the browser paints
   itself: text selection, form controls, and the UA form-control theme. */
/* color-scheme has to track the theme this app is actually painting, not the one
   the operating system is set to. Declared as "light dark" it left the decision to
   the platform, so forcing the night theme on a machine set to day gave every
   native control a light rendering on a near black page: white date pickers, white
   select menus, a white scrollbar. Named per theme, the two always agree.
   The three declarations mirror the token blocks above and for the same reason:
   the explicit toggle has to be able to win in both directions. */
:root{ color-scheme:light; accent-color:var(--text-primary); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
:root[data-theme="light"]{ color-scheme:light; }
::selection{ background:var(--surface-inverse); color:var(--text-inverse); }
::-moz-selection{ background:var(--surface-inverse); color:var(--text-inverse); }
html{ scroll-padding-bottom:calc(var(--dock-h) + var(--tabbar-h) + var(--s6)); scroll-padding-top:calc(var(--header-h) + var(--s4)); }
body{
  margin:0; background:var(--surface); color:var(--text-primary);
  font-family:var(--font); font-size:var(--fs-body); line-height:var(--lh-body);
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
h1,h2,h3,p,ul,ol,dl,dd,figure{ margin:0; }
ul,ol{ padding:0; list-style:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; text-align:left; }
a{ color:inherit; text-underline-offset:3px; }
svg{ display:block; width:20px; height:20px; flex:none; }
#sprite{ width:0!important; height:0!important; position:absolute; }
:where(a,button,input,select,textarea,summary,[tabindex]:not([tabindex="-1"])):focus-visible{
  outline:3px solid var(--focus-ring); outline-offset:2px;
  box-shadow:0 0 0 5px var(--focus-halo); border-radius:2px;
}
/* A route change moves focus to the screen heading so a screen reader announces the
   new page, and tabindex="-1" is how that heading is made focusable. It is not a
   control, so it must not be painted like one. Left in the group above it matched
   the ring, and the ring carries a 5px --focus-halo shadow: over the hero, where
   the halo is off white and the photograph is near black, that is the white
   rectangle that appeared around the headline and then vanished. outline:none on
   its own would not have removed it, because the rectangle is the shadow.
   The focus move stays, only the paint goes. Every real control keeps its ring:
   the group above still covers links, buttons, form controls, summary, and any
   author-tabbable element, and nothing here is a blanket outline:none. */
:where([tabindex="-1"]):focus,
:where([tabindex="-1"]):focus-visible{ outline:none; box-shadow:none; }
.vh{ position:absolute!important; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }
.tnum{ font-variant-numeric:tabular-nums; }

/* ---------- SCROLLBARS ----------
   No track, no gutter, no permanent bar. What a reader gets instead is a short
   translucent cue that appears while the page is moving under them and fades out
   once it stops, which is what a phone has always done and what a desktop browser
   still will not do on its own.
   Desktop scrollbars are removed outright rather than made transparent. A
   transparent bar still occupies its width, and a bar that appears and disappears
   with the content would take that width with it and reflow the column: the exact
   layout shift this is meant to avoid. With the bar gone the column is one width
   whether the page scrolls or not, and the cue is painted over the top of it by
   the scroll-cue block near the end of this document.
   A coarse pointer is left completely alone. Every touch platform already overlays
   its own indicator, on its own timing, over content it has not reserved any space
   from, and a second one drawn on top of it would be two. */
@media (hover:hover) and (pointer:fine){
  *{ scrollbar-width:none; -ms-overflow-style:none; }
  ::-webkit-scrollbar{ width:0; height:0; background:transparent; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner{ background:transparent; }
}

/* The cue itself. Fixed, so one pair of elements serves the page and every panel,
   drawer, sheet, and calendar inside it; pointer-events:none, so it is an
   indicator and never something in the way of the content under it. It reports
   position and it does not accept a drag, which is the trade a control that is
   invisible most of the time has to make. Wheel, trackpad, touch, keyboard, and
   every assistive scroll are untouched: nothing here changes how anything
   scrolls, only what is drawn while it does. */
.scrollcue{
  position:fixed; z-index:2147483000; pointer-events:none;
  border-radius:99px;
  background:color-mix(in srgb, var(--text-primary) 34%, transparent);
  opacity:0; transition:opacity 240ms var(--ease);
}
.scrollcue[data-on="1"]{ opacity:1; }
.scrollcue--v{ width:6px; }
.scrollcue--h{ height:6px; }
@media (prefers-reduced-motion:reduce){ .scrollcue{ transition:none; } }
@media (prefers-contrast:more){
  .scrollcue{ background:var(--text-primary); }
}

/* ---------- PATTERNS AND ELEVATION ---------- */
.hatch{ background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); }
.hatch-strong{ background-image:repeating-linear-gradient(45deg,var(--hatch-strong) 0 4px,transparent 4px 10px); }
.lvl1{ background:var(--surface-raised); border:1px solid var(--hairline); box-shadow:0 1px 0 var(--shadow-card); }

/* ---------- APP SHELL ---------- */
/* overflow-x:clip, not hidden. A full bleed section is 100vw wide and 100vw counts
   the scrollbar, so it overhangs by half a scrollbar at each end. Something has to
   absorb that. hidden would make this a scroll container, which would move the
   scrollport off the viewport and break the sticky header inside it; clip does not
   create a scroll container, so the header still sticks to the viewport and the
   overhang contributes nothing to the document's scroll width. The vertical axis is
   left visible, which is legal beside clip and is not coerced to auto the way it
   would be beside hidden. */
#shell{ min-height:100svh; display:flex; flex-direction:column; overflow-x:clip; }

/* ---------- HEADER GROUP ----------
   The utility strip and the navigation strip are one sticky unit. Sticking the
   group rather than either strip is what guarantees the three things that matter:
   they cannot separate, they cannot overlap, and neither can scroll while the
   other holds. Because the group sticks in normal flow it also occupies its own
   height at the top of the document, so the hero starts below the combined height
   without anything having to be measured or subtracted. --header-h is that
   combined height, published for scroll padding and anything else that has to
   clear the header. */
:root{ --utilbar-h:0px; --header-h:var(--appbar-h); }
/* GHOST NAVIGATION.
   There is no navbar rectangle. The two strips carry no background and no border of
   their own; the group behind them fades from a thin wash at the very top to nothing
   at the bottom, so the header has no edge to see and the photograph behind it stays
   the dominant layer. Blur is 1px, which settles the type without dissolving the
   picture. Over anything other than the hero the same fade is made of the page's own
   surface, so the effect is identical and the ink stays the theme's ink. */
/* Past the hero there is no photograph to preserve, and the fade is mixed from the
   page's own surface, so a strong wash here is free: it is the page colour over the
   page colour. It stays a fade rather than a plate, which is what keeps the bottom
   edge from drawing itself, and it is what stops a heading scrolling under the
   navigation from printing through the links. The sheer treatment is for glass over
   a picture, not for glass over nothing. */
.headergroup{
  position:sticky; top:0; z-index:40;
  border:0;
  background:linear-gradient(to bottom,
    color-mix(in srgb, var(--surface) 97%, transparent) 0%,
    color-mix(in srgb, var(--surface) 93%, transparent) 58%,
    color-mix(in srgb, var(--surface) 58%, transparent) 84%,
    transparent 100%);
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
}
/* Over the hero photograph the fade is near black and the type is cream, whatever the
   theme is set to, because the picture underneath is dark in both. The class is put on
   the root element by an observer watching the hero, and --ghost-edge is redeclared
   here so every control inside the header inherits the cream edge with it. */
:root.over-hero .headergroup{
  --ghost-edge:246,244,221;
  color:#F5F3DC;
  /* Nudged up one step from .42/.20/.06. The fade still ends at nothing and the
     photograph still reads straight through it; what the extra few percent buys is
     a steadier seat for the navigation over the bright end of the frame. */
  background:linear-gradient(to bottom,
    rgba(5,5,5,.50) 0%, rgba(5,5,5,.26) 45%, rgba(5,5,5,.09) 75%, rgba(5,5,5,0) 100%);
  /* The surface is sheer; the type is not. A shadow on the glyphs is what carries the
     navigation over the bright end of the photograph, and it costs nothing in
     transparency, which is what a heavier wash or a stronger blur would have cost. */
  text-shadow:0 1px 8px rgba(5,5,5,.62), 0 0 2px rgba(5,5,5,.45);
}
.utilbar{ display:none; }
.appbar{
  display:grid; grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr);
  align-items:center; gap:var(--s2);
  min-height:var(--appbar-h); padding:max(0px,env(safe-area-inset-top)) var(--s3) 0;
  background:none; border:0;
}
body.shell-staff .headergroup{
  background:linear-gradient(to bottom,
    color-mix(in srgb, var(--surface-inverse) 88%, transparent) 0%,
    color-mix(in srgb, var(--surface-inverse) 62%, transparent) 55%,
    color-mix(in srgb, var(--surface-inverse) 18%, transparent) 100%);
  color:var(--text-inverse);
}
.appbar__slot{ display:flex; align-items:center; min-height:var(--appbar-h); }
.appbar__slot--end{ justify-content:flex-end; }
/* Three controls on the right cannot coexist with a centred wordmark at 360px:
   the side columns are only (360-118)/2 wide, and three 44px targets are not.
   With the account controls present the brand goes left, which is the ordinary
   app bar arrangement anyway. */
.appbar--ends{ grid-template-columns:auto 1fr auto; }
.appbar--ends #bar-mid{ justify-self:start; }
.wordmark{ display:flex; align-items:center; gap:8px; min-height:var(--tap-min); font-size:13px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; line-height:1.1; }
.appbar .clock{ font-size:var(--fs-label); font-weight:600; letter-spacing:.02em; }
.iconbtn{ display:inline-flex; flex:none; align-items:center; justify-content:center; gap:6px; min-width:var(--tap-min); min-height:var(--tap-min); padding:0 var(--s2); border:1px solid var(--border-default); border-radius:var(--r-btn); font-size:var(--fs-eyebrow); font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
.iconbtn--demo{ border-style:dashed; }
/* Borderless, so the two account controls do not compete with the Demo button. */
.iconbtn--bare{ border-color:transparent; padding:0; min-width:var(--tap-min); }
.iconbtn--bare svg{ width:22px; height:22px; }
.appbar__slot--end{ gap:6px; }
.textbtn{ display:inline-flex; align-items:center; gap:6px; min-height:var(--tap-min); padding-right:var(--s2); font-size:var(--fs-label); font-weight:600; }
.textbtn svg{ width:18px; height:18px; }

/* ---------- HEADER ACCOUNT AND OVERFLOW ----------
   The account control is present at every width now. It is the only thing standing
   between a phone reader and their bookings, and burying it behind a menu on the one
   screen where the hero has nothing to say about accounts was the wrong trade.
   The menu button beside it is a phone control: from 1024px up its two build
   controls are in the utility strip and its destinations are in the navigation
   strip, so it is display:none rather than duplicated. */
.headeraccount{ display:flex; align-items:center; }
.barmenu{ display:inline-flex; }

/* ---------- THE SWAP SLOT ----------
   On a phone the account control and the booking action are the same slot, one
   showing at a time, because a 360px bar cannot carry the wordmark, two 100px
   controls, and a menu button. Stacking them in one grid cell rather than swapping
   one out for the other is what holds the bar still: the cell is as wide as the
   wider of the two at all times, so nothing to its left or right can move when the
   contents change. From 1024px up there is room for both and the slot becomes a
   row, where the hidden action still reserves its width for the same reason. */
.navswap{ display:grid; justify-items:end; align-items:center; }
.navswap > *{ grid-area:1 / 1; }

/* ---------- THE SCROLLED BOOKING ACTION ----------
   Absent while the hero's own two cards are on screen, because a third copy of an
   action the reader is already looking at is noise. It arrives when they leave, and
   it arrives as one action rather than two: the hero offers the choice, the header
   offers the way back to it.
   visibility, not display. display:none cannot be transitioned, and opacity alone
   would leave a control that is invisible and still tabbable. visibility is both
   animatable, by delaying it to the end of the fade, and honest, because a hidden
   subtree is out of the tab order and out of the accessibility tree.
   --dur-ui is 200ms and is already zeroed under prefers-reduced-motion, so the token
   carries the reduced-motion requirement instead of a second rule repeating it. */
.nav-book-cta{
  display:inline-flex; align-items:center; gap:8px;
  min-height:40px; padding:0 var(--s5);
  background:rgba(var(--ghost-edge),.08); color:inherit;
  border:1px solid rgba(var(--ghost-edge),.42); border-radius:var(--r-btn);
  font-size:var(--fs-label); line-height:1; font-weight:700; white-space:nowrap;
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  opacity:0; visibility:hidden; transform:translateX(8px); pointer-events:none;
  transition:opacity var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease),
             background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease),
             visibility 0s linear var(--dur-ui);
}
:root.nav-cta .nav-book-cta{
  opacity:1; visibility:visible; transform:none; pointer-events:auto;
  transition:opacity var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease),
             background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease),
             visibility 0s;
}
/* The other half of the phone swap. Above 1024px this is cancelled and both are
   shown; the account is only stood down where there is no room for both, and where
   it is, the menu below it carries the same actions. */
.navswap .headeraccount{
  transition:opacity var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease), visibility 0s;
}
:root.nav-cta .navswap .headeraccount{
  opacity:0; visibility:hidden; transform:translateX(-8px); pointer-events:none;
  transition:opacity var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease),
             visibility 0s linear var(--dur-ui);
}

/* The one prominent action in the header, and it is prominent by being the only
   bordered thing up there rather than by being a filled block. Ghost like the rest:
   a 4% wash and a thin edge. The colour is inherited, so it is cream over the hero
   and the theme's ink everywhere else, and a soft corner, not a pill. */
.btn-login{
  display:inline-flex; align-items:center; gap:8px;
  min-height:40px; padding:0 var(--s5);
  background:rgba(var(--ghost-edge),.04); color:inherit;
  border:1px solid rgba(var(--ghost-edge),.35); border-radius:var(--r-btn);
  font-size:var(--fs-label); line-height:1; font-weight:700; white-space:nowrap;
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease);
}

/* The signed-in replacement. A name and a chevron, no avatar: there is no photo in
   this build and a grey circle with initials in it is a placeholder pretending to
   be content. */
.acct{ position:relative; }
.acct__btn{
  display:inline-flex; align-items:center; gap:8px;
  min-height:40px; padding:0 var(--s3);
  background:rgba(var(--ghost-fill),.06);
  border:1px solid rgba(var(--ghost-edge),.28); border-radius:var(--r-btn);
  font-size:var(--fs-label); line-height:1; font-weight:600; white-space:nowrap;
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  transition:border-color var(--dur-ui) var(--ease), background var(--dur-ui) var(--ease);
}
.acct__btn svg{ width:18px; height:18px; }
.acct__btn .chev{ transition:transform var(--dur-ui) var(--ease); }
.acct.is-open .acct__btn{ background:rgba(var(--ghost-fill),.18); border-color:rgba(var(--ghost-edge),.6); }
.acct.is-open .acct__btn .chev{ transform:rotate(180deg); }
/* The one place a sheer surface is wrong. A dropdown has to be read against whatever
   it happens to land on, which on this page is a moving photograph, so it keeps an
   opaque surface. Ghost glass is for things that sit still. */
.acct__menu{
  position:absolute; top:calc(100% + 6px); right:0; z-index:5;
  min-width:min(200px, 100%); display:none;
  /* Never wider than the window it hangs in, whatever the header does around it. */
  max-width:min(18rem, calc(100dvw - (2 * var(--gutter))));
  background:var(--surface-raised); color:var(--text-primary);
  border:1px solid var(--border-strong);
  border-radius:var(--r-card); box-shadow:0 10px 28px var(--shadow-print);
  overflow:hidden;
  /* Its right edge is its button's right edge, so it opens out of the corner it
     belongs to rather than fading in over the top of it. */
  transform-origin:calc(100% - 26px) 0;
}
.acct.is-open .acct__menu{ display:block; }
.acct__menu button{
  display:flex; align-items:center; gap:10px; width:100%;
  min-height:var(--tap-min); padding:0 var(--s4);
  font-size:var(--fs-label); font-weight:600;
  transition:background var(--dur-ui) var(--ease);
}
.acct__menu button + button{ border-top:1px solid var(--hairline); }
.acct__menu svg{ width:18px; height:18px; color:var(--text-secondary); }
.acct__who{
  padding:var(--s3) var(--s4); border-bottom:1px solid var(--hairline);
  font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary);
}
.acct__who strong{ display:block; color:var(--text-primary); font-size:var(--fs-label); }
@media (prefers-reduced-motion:reduce){
  .btn-login, .acct__btn, .acct__btn .chev, .acct__menu button{ transition:none; }
}

main{
  flex:1 1 auto; width:100%; max-width:var(--shell-max); margin:0 auto;
  padding:var(--pad-top) var(--gutter) calc(var(--dock-h) + var(--s6) + env(safe-area-inset-bottom));
}
/* When a browse route carries both, the dock stacks ABOVE the tab bar and the
   content reserves room for both. Neither may cover the other. */
body.has-tabbar main{ padding-bottom:calc(var(--tabbar-h) + var(--dock-h) + var(--s6) + env(safe-area-inset-bottom)); }
body.has-tabbar .dock{ bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom:var(--s3); }
body.has-tabbar .dock.dock-static{ bottom:auto; }
main:focus{ outline:none; }

/* ---------- TAB BAR ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  background:var(--surface-raised); border-top:1px solid var(--border-default);
  padding-bottom:max(0px,env(safe-area-inset-bottom));
}
body.shell-staff .tabbar{ background:var(--surface-inverse); color:var(--text-inverse); border-top-color:var(--border-strong); }
.tabbar a{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  min-height:var(--tabbar-h); padding:6px 2px; text-decoration:none;
  font-size:var(--fs-tab); line-height:var(--lh-tab); font-weight:600; text-align:center;
}
.tabbar a svg{ width:22px; height:22px; }
.tabbar a .tabpill{ display:grid; place-items:center; width:38px; height:26px; border-radius:var(--r-pill); }
.tabbar a[aria-current="page"] .tabpill{ background:var(--surface-inverse); color:var(--text-inverse); }
body.shell-staff .tabbar a[aria-current="page"] .tabpill{ background:var(--text-inverse); color:var(--surface-inverse); }
.tabbar a[aria-current="page"]{ font-weight:700; }

/* ---------- DOCK ---------- */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:46;
  background:var(--surface-raised); border-top:1px solid var(--border-default);
  box-shadow:0 -8px 24px var(--shadow-dock);
  padding:var(--s3) var(--gutter) calc(var(--s3) + max(0px,env(safe-area-inset-bottom)));
}
.dock.dock-static{ position:static; box-shadow:none; margin-top:var(--s6); }
.dock__inner{ width:100%; max-width:var(--content-max); margin:0 auto; }
.dock__summary{ display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3); margin-bottom:var(--s2); }
.dock__summary small{ font-size:var(--fs-legal); color:var(--text-secondary); }
.dock__summary strong{ font-size:var(--fs-txn); font-weight:800; font-variant-numeric:tabular-nums; }
.dock__note{ margin-top:var(--s2); font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }

/* ---------- BUTTONS ----------
   Soft cards, and sheer ones. A call to action is a rounded rectangle with a thin
   edge and a wash you can see straight through, never an opaque plate. The label and
   the icon stay at full strength: nothing here uses opacity on the component, only a
   low alpha on the surface behind it, so a sheer button never means faint type.
   Two tint directions. The secondary and ghost buttons wash toward the fill colour
   and the primary washes toward the edge colour, which in the dark theme is the
   cream. That is the whole distinction, and it survives at 8% because the border
   weight and the type carry it. */
.btn{
  display:flex; align-items:center; justify-content:center; gap:var(--s2); width:100%;
  min-height:var(--tap-decision); padding:var(--s3) var(--s4);
  border-radius:var(--r-btn); border:1px solid rgba(var(--ghost-edge),.35);
  font-size:var(--fs-h3); font-weight:700; line-height:1.25; text-align:center;
  color:var(--text-primary); background:rgba(var(--ghost-fill),.08);
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease),
             transform var(--dur-ui) var(--ease), box-shadow var(--dur-ui) var(--ease), color var(--dur-ui) var(--ease);
}
.btn small{ display:block; font-size:var(--fs-legal); font-weight:600; opacity:.92; }
.btn svg{ width:20px; height:20px; flex:none; transition:transform var(--dur-ui) var(--ease); }
.btn--primary{
  background:rgba(var(--ghost-edge),.08);
  color:var(--text-primary); border-color:rgba(var(--ghost-edge),.42);
}
.btn--secondary{ background:rgba(var(--ghost-fill),.08); color:var(--text-primary); border-color:rgba(var(--ghost-edge),.35); }
.btn--ghost{ background:rgba(var(--ghost-fill),.05); border-width:1px; border-style:dashed; border-color:rgba(var(--ghost-edge),.32); min-height:var(--tap-min); font-size:var(--fs-label); }
.btn--sm{ min-height:var(--tap-min); font-size:var(--fs-label); }
.btn[disabled]{ cursor:not-allowed; border-style:dashed; background:rgba(var(--ghost-fill),.04); color:var(--text-secondary); }
.btn-col{ display:grid; gap:var(--s3); }
.btn-stack{ display:grid; gap:var(--s2); }

/* ---------- TEXT UTILITIES ---------- */
.eyebrow{ font-size:var(--fs-eyebrow); line-height:var(--lh-eyebrow); font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
.display{ font-size:var(--fs-display); line-height:var(--lh-display); font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
h1.screen{ font-size:var(--fs-h1); line-height:var(--lh-h1); font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
h2.sec, h3.sub{ text-wrap:balance; }
.lede, .plate__truth{ text-wrap:pretty; }
h1.screen:focus{ outline:none; }
h2.sec{ font-size:var(--fs-h2); line-height:var(--lh-h2); font-weight:700; }
h3.sub{ font-size:var(--fs-h3); line-height:var(--lh-h3); font-weight:600; }
.lede{ font-size:var(--fs-body); line-height:var(--lh-body); }
.muted{ color:var(--text-secondary); }
.legal{ font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }
.amount{ font-size:var(--fs-amount); line-height:var(--lh-amount); font-weight:800; font-variant-numeric:tabular-nums; }
.txn{ font-size:var(--fs-txn); line-height:var(--lh-txn); font-weight:700; font-variant-numeric:tabular-nums; }
.code{ font-size:var(--fs-code); line-height:var(--lh-code); font-weight:700; letter-spacing:.12em; font-variant-numeric:tabular-nums; }
.stack{ display:grid; gap:var(--block-gap); }
.stack-sm{ display:grid; gap:var(--s3); }
.stack-xs{ display:grid; gap:var(--s2); }
.section{ display:grid; gap:var(--block-gap); margin-top:var(--section-gap); }
.rule{ height:1px; background:var(--hairline); border:0; margin:0; }

/* ---------- SAMPLE AND TBD MARKS ---------- */
.sample{ display:inline-flex; align-items:center; gap:4px; padding:1px 8px; border:1px dashed var(--border-default); border-radius:var(--r-pill); font-size:var(--fs-eyebrow); line-height:18px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; vertical-align:middle; }
.tbd{ font-size:var(--fs-legal); line-height:var(--lh-legal); border-bottom:2px dotted var(--border-default); }
.sampleband{ display:flex; align-items:flex-start; gap:var(--s2); padding:var(--s3); border:1px dashed var(--border-default); border-radius:var(--r-card); font-size:var(--fs-legal); line-height:var(--lh-legal); }
.sampleband svg{ width:18px; height:18px; flex:none; margin-top:2px; }
.unapproved{ display:inline-block; margin-top:4px; padding:1px 6px; border:1px dotted var(--border-default); font-size:var(--fs-eyebrow); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }

/* ---------- CARD ----------
   Sheer, like everything else. What tells a card from the page is its edge and the
   type inside it, not a fill you cannot see through. */
.card{
  background:rgba(var(--ghost-fill),.07);
  border:1px solid rgba(var(--ghost-edge),.22);
  border-radius:var(--r-card); padding:var(--card-pad);
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease);
}
.card--sunken{ background:rgba(var(--ghost-fill),.12); }
.card--strong{ border:1.5px solid rgba(var(--ghost-edge),.45); }
.card__head{ display:flex; justify-content:space-between; align-items:flex-start; gap:var(--s3); }

/* ---------- STATUS PLATE ---------- */
.plate{ position:relative; border-radius:var(--r-plate); padding:var(--s4) var(--s4) var(--s4) calc(var(--s4) + var(--bar-w)); background:rgba(var(--ghost-fill),.10); border:1.5px solid rgba(var(--ghost-edge),.45); overflow:hidden; -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur)); }
.plate__bar{ position:absolute; left:0; top:0; bottom:0; width:var(--bar-w); }
.plate__bar--solid{ background:var(--border-strong); }
.plate__bar--hatched{ background:var(--surface-sunken); background-image:repeating-linear-gradient(45deg,var(--hatch-strong) 0 4px,transparent 4px 10px); border-right:1px solid var(--border-default); }
.plate__hazard{ position:absolute; left:0; right:0; top:0; height:8px; }
.plate__head{ display:flex; align-items:center; gap:var(--s2); }
.plate__head svg{ width:20px; height:20px; flex:none; }
.plate__phrase{ margin-top:var(--s2); font-size:var(--fs-txn); line-height:var(--lh-txn); font-weight:700; font-variant-numeric:tabular-nums; }
.plate__truth{ margin-top:var(--s2); font-size:var(--fs-body); line-height:var(--lh-body); }
.plate__meta{ margin-top:var(--s2); font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }
.plate--hold{ border:3px double var(--border-strong); padding-top:var(--s5); }
.plate--dotted{ border:3px dotted var(--border-strong); }
.plate--dotted2{ border:2px dotted var(--border-strong); }
.plate--terminal{ background:var(--surface-sunken); border:2px dashed var(--border-strong); background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); }
.plate--terminal .plate__phrase{ color:var(--text-primary); }
.plate--strike .plate__phrase{ text-decoration:line-through; text-decoration-thickness:2px; }
.plate--rule{ border:0; border-top:3px double var(--border-strong); border-bottom:3px double var(--border-strong); border-radius:0; padding-left:var(--s4); }
.plate--fullbleed{
  margin-inline:calc(-1 * var(--gutter)); border-radius:0; border:0;
  background:var(--surface-inverse); color:var(--text-inverse);
  padding:var(--s6) var(--gutter); box-shadow:3px 3px 0 var(--shadow-print);
}
.plate--fullbleed .plate__meta{ color:var(--text-inverse-secondary); }
.plate--fullbleed .plate__code{ margin-top:var(--s3); font-size:var(--fs-code); font-weight:700; letter-spacing:.12em; font-variant-numeric:tabular-nums; }
.plate--checkedin{ box-shadow:inset 0 0 0 2px var(--text-inverse), 3px 3px 0 var(--shadow-print); }
.plate--checkedin .plate__head{ border-bottom:4px dotted var(--text-inverse); padding-bottom:var(--s2); }
.plate__pole{ position:absolute; left:0; right:0; top:0; height:8px; background-image:repeating-linear-gradient(45deg,var(--hatch-strong) 0 4px,transparent 4px 10px); background-size:14px 14px; }
@media (prefers-reduced-motion: no-preference){
  .plate__pole--live{ animation:pole 1.2s linear infinite; }
}
@keyframes pole{ from{ background-position:0 0; } to{ background-position:14px 0; } }
.plate--urgent{ border-width:3px; }
.plate--urgent .plate__phrase{ font-weight:800; }
/* When the plate states its status once, the eyebrow carries it at status size. */
.plate--lead .plate__head{ font-size:var(--fs-txn); line-height:var(--lh-txn); letter-spacing:.06em; font-weight:800; }
.plate--lead .plate__head svg{ width:24px; height:24px; }
.plate--fullbleed .plate__head{ font-size:var(--fs-h1); line-height:var(--lh-h1); letter-spacing:.04em; font-weight:800; }
.plate--fullbleed .plate__head svg{ width:28px; height:28px; }

/* ---------- CHIP ---------- */
.chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--r-chip); border:1px solid rgba(var(--ghost-edge),.22); background:rgba(var(--ghost-fill),.07); font-size:var(--fs-label); line-height:20px; font-weight:600; }
.chip svg{ width:18px; height:18px; flex:none; }
.chip--strong{ border:2px solid var(--border-strong); font-weight:700; }
.chip--full{ background:var(--surface-sunken); border:2px dashed var(--border-strong); font-weight:700; background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); }
.chip--quiet{ background:var(--surface); border:1px solid var(--hairline); color:var(--text-secondary); font-weight:400; }
.chip--closed{ background:var(--surface-sunken); border:1px solid var(--border-default); color:var(--text-secondary); }
.chip--bar{ position:relative; padding-left:16px; }
.chip--bar::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:var(--bar-w); background-image:repeating-linear-gradient(45deg,var(--hatch-strong) 0 4px,transparent 4px 10px); border-right:1px solid var(--border-default); }
.chip--barsolid::before{ background:var(--border-strong); background-image:none; }
.chip__sfx{ font-size:var(--fs-eyebrow); font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding-left:6px; border-left:1px solid var(--border-default); }

/* ---------- STEP RAIL ---------- */
.steprail{ display:grid; gap:var(--s2); margin-bottom:var(--s5); }
.steprail__label{ font-size:var(--fs-label); font-weight:600; }
.steprail__track{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; }
.steprail__seg{ height:6px; border:1px solid rgba(var(--ghost-edge),.22); border-radius:999px; background:rgba(var(--ghost-fill),.07); }
.steprail__seg[data-done="1"]{ background:var(--surface-inverse); border-color:var(--border-strong); }
.steprail__seg[aria-current="step"]{ background:var(--surface-inverse); border-color:var(--border-strong); box-shadow:inset 0 0 0 2px var(--surface-raised); }

/* ---------- LISTS AND ROWS ---------- */
.rows{ display:grid; gap:var(--s2); }
.row{ display:flex; align-items:center; gap:var(--s3); width:100%; min-height:var(--tap-decision); padding:var(--s3) var(--s4); border:1px solid rgba(var(--ghost-edge),.22); border-radius:var(--r-card); background:rgba(var(--ghost-fill),.07); -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur)); transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease); }
.row__main{ flex:1 1 auto; min-width:0; display:block; }
.row__title{ display:block; font-size:var(--fs-h3); line-height:var(--lh-h3); font-weight:600; font-variant-numeric:tabular-nums; }
.row__sub{ display:block; font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }
.row--limited{ border:2px solid var(--border-strong); }
.row--unavailable{ background:var(--surface-sunken); border:1px dashed var(--border-default); background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); }
.row--selected{ background:var(--surface-inverse); color:var(--text-inverse); border:2px solid var(--border-strong); }
.row--selected .row__sub{ color:var(--text-inverse-secondary); }
.row--bar{ position:relative; padding-left:calc(var(--s4) + var(--bar-w)); }
.row--bar::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:var(--bar-w); background:var(--border-strong); border-radius:var(--r-card) 0 0 var(--r-card); }
.row--barhatch::before{ background:var(--surface-sunken); background-image:repeating-linear-gradient(45deg,var(--hatch-strong) 0 4px,transparent 4px 10px); }

/* radiogroup time rows */
.optrow{ position:relative; display:block; }
.optrow input{ position:absolute; opacity:0; width:1px; height:1px; }
.optrow > span{ display:flex; align-items:center; gap:var(--s3); min-height:var(--tap-decision); padding:var(--s3) var(--s4); border:1px solid rgba(var(--ghost-edge),.22); border-radius:var(--r-card); background:rgba(var(--ghost-fill),.07); cursor:pointer; -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur)); transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease); }
.optrow input:checked + span{ background:var(--surface-inverse); color:var(--text-inverse); border:2px solid var(--border-strong); }
.optrow input:checked + span .row__sub{ color:var(--text-inverse-secondary); }
/* A chip sitting on an inverse-filled row must invert with it, or it paints
   its own light background under inherited light text. */
.optrow input:checked + span .chip,
.row--selected .chip{ background:transparent; color:var(--text-inverse); border-color:var(--text-inverse); }
.optrow input:focus-visible + span{ outline:3px solid var(--focus-ring); outline-offset:2px; box-shadow:0 0 0 5px var(--focus-halo); }
.optrow--limited > span{ border:2px solid var(--border-strong); }

/* ---------- DATE STRIP ---------- */
.datestrip{ display:flex; gap:var(--s2); overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:var(--s2); margin-inline:calc(-1 * var(--gutter)); padding-inline:var(--gutter); }
.datestrip::-webkit-scrollbar{ height:0; }
.daybtn{ scroll-snap-align:start; flex:none; width:66px; min-height:78px; display:grid; align-content:center; justify-items:center; gap:2px; border:1px solid var(--border-default); border-radius:var(--r-card); background:var(--surface-raised); text-align:center; padding:var(--s2) 4px; }
.daybtn small{ font-size:var(--fs-eyebrow); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.daybtn strong{ font-size:var(--fs-txn); font-weight:800; font-variant-numeric:tabular-nums; }
.daybtn i{ font-style:normal; font-size:11px; line-height:13px; font-weight:600; }
.daybtn[data-state="closed"]{ background:var(--surface-sunken); background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); border-style:dashed; }
.daybtn[aria-pressed="true"]{ background:var(--surface-inverse); background-image:none; color:var(--text-inverse); border:2px solid var(--border-strong); border-style:solid; }
/* A selected day that is also closed stays legible: inverse fill, hatch on top. */
.daybtn[aria-pressed="true"][data-state="closed"]{
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,0) 3px 8px);
  border-style:dashed; box-shadow:inset 0 0 0 2px var(--surface-raised);
}

/* ---------- SEGMENTED ---------- */
.seg{ display:flex; gap:var(--s2); flex-wrap:wrap; }
.seg button{ flex:1 1 0; min-width:88px; min-height:var(--tap-row); padding:0 var(--s3); border:1px solid rgba(var(--ghost-edge),.22); border-radius:var(--r-btn); background:rgba(var(--ghost-fill),.07); font-size:var(--fs-label); font-weight:600; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur)); transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease); }
.seg button[aria-pressed="true"]{ background:var(--surface-inverse); color:var(--text-inverse); border:2px solid var(--border-strong); font-weight:700; }

/* ---------- STEPPER ---------- */
/* ---------- QUANTITY ----------
   One control, not three. It used to be a minus button, a read-only count, a plus
   button, and then a second labelled box further down the screen for typing a
   number into, which meant two places held the same value and the reader had to
   work out that they were the same question. Now the count is the box: three
   segments in one frame, the number editable in the middle of it.
   Sized off --tap-decision, so all three segments are the same height and each of
   them clears the touch target on its own. The frame is the border; the segments
   are divided by a hairline and carry no border of their own, which is what keeps
   it reading as one control rather than three sitting next to each other. */
.qtysel{
  display:inline-flex; align-items:stretch; width:fit-content; max-width:100%;
  border:1px solid rgba(var(--ghost-edge),.35);
  border-radius:var(--r-btn);
  background:rgba(var(--ghost-fill),.08);
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  overflow:hidden;
  transition:border-color var(--dur-ui) var(--ease), background var(--dur-ui) var(--ease), box-shadow var(--dur-ui) var(--ease);
}
.qtysel__btn{
  flex:none; width:var(--tap-decision); min-height:var(--tap-decision);
  display:grid; place-items:center;
  background:transparent; border:0; color:var(--text-primary);
  transition:background var(--dur-ui) var(--ease), color var(--dur-ui) var(--ease);
}
.qtysel__btn svg{ width:22px; height:22px; }
/* Refused rather than absent. The control keeps its shape at the ends of its range
   so the row does not reflow, and the segment that will not respond says so by
   going quiet instead of disappearing. */
.qtysel__btn[disabled]{ color:var(--text-secondary); opacity:.4; cursor:not-allowed; }
/* Wider than either button, because this is the segment the number lives in and
   the one a finger aims at to retype it. */
.qtysel__num{
  flex:1 1 auto; width:6rem; min-width:4rem; align-self:stretch;
  min-height:var(--tap-decision); padding:0 var(--s2);
  border:0;
  border-left:1px solid rgba(var(--ghost-edge),.26);
  border-right:1px solid rgba(var(--ghost-edge),.26);
  border-radius:0; background:transparent; color:var(--text-primary);
  text-align:center; font-size:var(--fs-amount); font-weight:800;
  font-variant-numeric:tabular-nums; line-height:1;
}
.qtysel__num:focus-visible{ outline-offset:-3px; border-radius:2px; }
.qtysel__unit{
  font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary);
  margin-top:var(--s2);
}

/* ---------- FORMS ---------- */
.field{ display:grid; gap:6px; }
.field > .lbl{ font-size:var(--fs-label); line-height:var(--lh-label); font-weight:600; }
.field > .lbl .opt{ font-weight:400; color:var(--text-secondary); }
.field input,.field select,.field textarea{
  width:100%; min-height:var(--tap-decision); padding:var(--s3) var(--s4);
  background:rgba(var(--ghost-fill),.10); border:1px solid rgba(var(--ghost-edge),.22); border-radius:var(--r-input);
  font-size:var(--fs-body); transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease);
}
.field textarea{ min-height:96px; padding-top:var(--s3); resize:vertical; }
.field .hint{ font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }
/* The invalid treatment itself lives with the attention red further down the
   sheet. What stays here is the shape of the message under the box.
   Unscoped, because the consent message sits outside any .field and it is now the
   only place that failure is stated. */
.fielderr{ display:flex; align-items:flex-start; gap:6px; font-size:var(--fs-legal); line-height:var(--lh-legal); font-weight:600; }
.fielderr svg{ width:16px; height:16px; flex:none; margin-top:3px; }
.check{ display:flex; gap:var(--s3); align-items:flex-start; padding:var(--s3); border:1px solid rgba(var(--ghost-edge),.22); border-radius:var(--r-card); background:rgba(var(--ghost-fill),.07); min-height:var(--tap-decision); -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur)); }
/* Drawn here rather than left to the browser. A native checkbox takes its colours
   from the platform, which is why these were a solid white square on the night
   theme: the same mismatch color-scheme fixes for the rest of the native controls,
   except that a checkbox is small, square, and sits right beside the type, so the
   platform's idea of white is the loudest thing in the row.
   Unchecked it is the same ghost surface and edge every other input on the page
   rests on. Checked it fills with the page's own ink and cuts the tick out of it,
   so the mark is the paper showing through rather than a second colour. */
.check input[type="checkbox"]{
  appearance:none; -webkit-appearance:none;
  flex:none; width:26px; height:26px; margin:0;
  display:grid; place-items:center;
  border:1.5px solid rgba(var(--ghost-edge),.55);
  border-radius:8px;
  background:rgba(var(--ghost-fill),.12);
  cursor:pointer;
  transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease);
}
.check input[type="checkbox"]::after{
  content:""; width:14px; height:14px;
  background:var(--text-inverse);
  clip-path:polygon(13% 46%, 0 60%, 39% 100%, 100% 22%, 86% 8%, 37% 71%);
  transform:scale(0);
  transition:transform var(--dur-fast) var(--ease);
}
.check input[type="checkbox"]:checked{
  background:var(--text-primary);
  border-color:var(--text-primary);
}
.check input[type="checkbox"]:checked::after{ transform:scale(1); }
.check input[type="checkbox"][disabled]{ opacity:.45; cursor:not-allowed; }
/* An invalid consent takes the attention red on the box itself, not only on the
   frame around it, so the thing that has to be pressed is the thing that is red. */
.check.is-invalid input[type="checkbox"]{ border-color:var(--critical); }
@media (prefers-contrast:more){
  .check input[type="checkbox"]{ border-width:2px; border-color:var(--border-strong); }
}
@media (prefers-reduced-motion:reduce){
  .check input[type="checkbox"], .check input[type="checkbox"]::after{ transition:none; }
}
.check label{ display:flex; align-items:center; min-height:var(--tap-min); cursor:pointer; }
.check span{ font-size:var(--fs-label); line-height:var(--lh-label); }
.check--detached{ border-style:dashed; }
/* A shortcut tucked under the field it fills in, rather than a decision of its
   own. No frame and no surface at all: a box drawn around it made it look like a
   second consent to give, sitting directly under a real one. What is left is the
   control and its words. */
.check--tight{
  padding:0; min-height:0; border:0; background:none;
  -webkit-backdrop-filter:none; backdrop-filter:none;
  gap:var(--s2); align-items:center;
}
.check--tight input{ width:22px; height:22px; }
.check--tight label{ min-height:0; }
.check--tight span{ font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }
.form{ display:grid; gap:var(--s5); }

/* ---------- DEFINITION LISTS / ORDER ---------- */
.dl{ display:grid; gap:var(--s2); }
.dl > div{ display:flex; justify-content:space-between; gap:var(--s3); font-size:var(--fs-body); }
.dl dt{ color:var(--text-secondary); }
.dl dd{ margin:0; font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
.dl .total{ border-top:2px solid var(--border-strong); padding-top:var(--s2); margin-top:var(--s1); }
.dl .total dt{ color:var(--text-primary); font-weight:700; }
.dl .total dd{ font-size:var(--fs-amount); font-weight:800; }

/* ---------- CODE BLOCK ---------- */
.codebox{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:var(--s3) var(--s4); border:2px solid var(--border-strong); border-radius:var(--r-card); background:var(--surface-raised); }
.codebox__val{ display:grid; gap:2px; }

/* ---------- QR PLACEHOLDER ---------- */
.qr{ width:min(228px,72vw); aspect-ratio:1; margin-inline:auto; border:2px solid var(--border-strong); border-radius:var(--r-card); background:var(--surface-raised); display:grid; place-items:center; position:relative; overflow:hidden; }
.qr::before{ content:""; position:absolute; inset:12px; background-image:repeating-linear-gradient(90deg,var(--border-strong) 0 6px,transparent 6px 14px),repeating-linear-gradient(0deg,var(--border-strong) 0 6px,transparent 6px 14px); opacity:.5; }
.qr span{ position:relative; padding:4px 10px; background:var(--surface-raised); border:1px dashed var(--border-default); font-size:var(--fs-eyebrow); font-weight:700; letter-spacing:.1em; text-transform:uppercase; }

/* ---------- COURT DIAGRAM ---------- */
.courts{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); }
.courtcell{ aspect-ratio:2/1.2; border:1.5px solid rgba(var(--ghost-edge),.45); border-radius:var(--r-input); display:grid; place-items:center; position:relative; font-size:var(--fs-legal); font-weight:700; background:rgba(var(--ghost-fill),.07); }
.courtcell::before{ content:""; position:absolute; left:8px; right:8px; top:50%; height:1px; background:var(--border-default); }

/* ---------- SKELETON ---------- */
.skel{ border:1px dashed var(--border-default); border-radius:var(--r-card); background:var(--surface-sunken); background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); min-height:var(--tap-decision); display:flex; align-items:center; padding:0 var(--s4); font-size:var(--fs-legal); color:var(--text-secondary); }

/* ---------- SHEET (native dialog) ----------
   Sized by inset rather than by 100vw. A viewport unit counts the scrollbar and the
   visual viewport does not, so a 100vw dialog is a scrollbar wider than the space it
   has to sit in and pushes a horizontal scroll onto the page underneath it. Pinning
   a fixed element to all four edges gives exactly the visible width, at every zoom
   and with any scrollbar. */
dialog{ padding:0; border:0; background:transparent; max-width:100%; max-height:100%; color:var(--text-primary); }
dialog::backdrop{ background:var(--overlay); }
.sheet{
  width:100%; max-width:min(var(--content-max), 40rem, 100%); margin:auto auto 0; background:var(--surface-raised);
  border:1px solid var(--border-strong); border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  max-height:85svh; display:flex; flex-direction:column;
}
dialog[open]{ display:flex; flex-direction:column; justify-content:flex-end; position:fixed; inset:0; width:auto; height:auto; }
.sheet__head{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); padding:var(--s4) var(--gutter); border-bottom:1px solid var(--hairline); }
.sheet__head h2{ font-size:var(--fs-h2); font-weight:700; }
.sheet__body{ overflow-y:auto; padding:var(--s5) var(--gutter) calc(var(--s6) + env(safe-area-inset-bottom)); display:grid; gap:var(--block-gap); }
.sheet__close{ min-width:var(--tap-min); min-height:var(--tap-min); display:grid; place-items:center; border:1px solid var(--border-default); border-radius:var(--r-btn); }
.sheet__close svg{ width:20px; height:20px; }

/* ---------- THE MENU, ANCHORED TO ITS BUTTON ----------
   The overflow menu used to be a full width sheet along the bottom edge, which meant
   pressing a control in the top right corner and being answered in the bottom left.
   The panel now hangs off the button that opened it and grows out of it, so the
   thing that appeared is visibly the thing that was pressed.
   It is still a modal dialog underneath: the focus trap, the Escape key, and the
   backdrop are the platform's and are worth keeping. Only the geometry changes.
   Three custom properties are written by openAppMenu, all in pixels read from the
   button: --anchor-top and --anchor-right place the panel, and --anchor-ox is how
   far the button's centre is from the panel's right edge, which is where the growth
   starts from. The panel is clamped to the viewport on both axes, so a narrow window
   shortens it rather than pushing it off the screen. */
#sheet.is-anchored{ display:block; }
#sheet.is-anchored .sheet{
  position:absolute;
  top:var(--anchor-top, 64px);
  right:var(--anchor-right, 12px);
  margin:0;
  width:min(19rem, calc(100% - (2 * var(--gutter))));
  max-width:none;
  max-height:min(72svh, calc(100svh - var(--anchor-top, 64px) - var(--s5)));
  border:1px solid var(--border-strong);
  border-radius:var(--r-card);
  box-shadow:0 20px 46px var(--shadow-print), 0 4px 12px var(--shadow-card);
  transform-origin:calc(100% - var(--anchor-ox, 22px)) 0;
}
#sheet.is-anchored .sheet__head{ padding:var(--s3) var(--s4); }
#sheet.is-anchored .sheet__head h2{ font-size:var(--fs-h3); }
#sheet.is-anchored .sheet__body{ padding:var(--s3) var(--s4) var(--s4); gap:var(--s3); }
@media (prefers-reduced-motion:no-preference){
  #sheet.is-anchored[open] .sheet{ animation:menu-out 180ms var(--ease) both; }
  #sheet.is-anchored[open]::backdrop{ animation:menu-fade 180ms var(--ease) both; }
  .acct.is-open .acct__menu{ animation:menu-out 150ms var(--ease) both; }
}
/* Small, off centre, and rising: the panel starts as roughly the size of the button
   it came from and at the same place on the screen. */
@keyframes menu-out{
  from{ opacity:0; transform:scale(.7) translateY(-12px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes menu-fade{ from{ opacity:0; } to{ opacity:1; } }

/* The phone overflow menu. Rows separated by a hairline, not boxed: this is a list
   of destinations and switches, and drawing five cards for five one-line rows would
   be the heaviest thing on the screen. */
.menusheet{ display:grid; }
.menurow{
  display:flex; align-items:center; gap:var(--s3); width:100%;
  min-height:var(--tap-row); padding:var(--s2) 0;
  font-size:var(--fs-label); font-weight:600;
  border-bottom:1px solid var(--hairline);
}
.menusheet .menurow:last-child{ border-bottom:0; }
.menurow svg{ width:20px; height:20px; color:var(--text-secondary); }

/* ---------- BANNERS ---------- */
.banner{ display:flex; gap:var(--s3); align-items:flex-start; padding:var(--s3) var(--s4); border:1.5px solid rgba(var(--ghost-edge),.45); border-left:var(--bar-w) solid var(--border-strong); border-radius:var(--r-card); background:rgba(var(--ghost-fill),.10); -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur)); }
.banner svg{ width:20px; height:20px; flex:none; margin-top:3px; }
.banner p{ font-size:var(--fs-label); line-height:var(--lh-label); }
.stagingband{ display:flex; gap:var(--s2); align-items:flex-start; padding:var(--s2) var(--gutter); border-bottom:1px solid var(--border-default); background:var(--surface-sunken); background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); font-size:var(--fs-legal); line-height:var(--lh-legal); }
.stagingband svg{ width:16px; height:16px; flex:none; margin-top:4px; }
.injected{ display:flex; gap:var(--s2); align-items:center; padding:var(--s2) var(--gutter); border-bottom:1px solid var(--border-strong); background:var(--surface-sunken); background-image:repeating-linear-gradient(45deg,var(--hatch-strong) 0 4px,transparent 4px 10px); font-size:var(--fs-legal); font-weight:700; }

/* ---------- DEMO HARNESS ---------- */
.harness{ font-size:var(--fs-label); }
.harness .sheet__head{ background:var(--surface-sunken); background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); }
.harness h3{ font-size:var(--fs-label); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:var(--s2); }
.harness .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); }
.harness .grid1{ display:grid; gap:var(--s2); }
.harness .h{ display:flex; align-items:center; justify-content:center; min-height:var(--tap-min); padding:var(--s2) var(--s3); border:1px solid var(--border-default); border-radius:var(--r-btn); background:var(--surface-raised); font-size:var(--fs-label); font-weight:600; text-align:center; text-decoration:none; }
.harness .h[aria-pressed="true"]{ background:var(--surface-inverse); color:var(--text-inverse); border:2px solid var(--border-strong); }
.harness .routelist a{ display:flex; flex-direction:column; justify-content:center; min-height:var(--tap-min); padding:10px var(--s3); border-bottom:1px solid var(--hairline); font-size:var(--fs-label); text-decoration:none; }
.harness .routelist a code{ display:block; font-size:var(--fs-legal); color:var(--text-secondary); letter-spacing:.02em; }

/* ---------- STAFF ---------- */
.timeline{ overflow-x:auto; }
.timeline table{ border-collapse:collapse; min-width:520px; font-size:var(--fs-legal); }
.timeline th,.timeline td{ border:1px solid var(--hairline); padding:6px 8px; text-align:left; white-space:nowrap; }
.timeline th{ font-weight:700; background:var(--surface-sunken); }
.tl-booked{ background:var(--surface-inverse); color:var(--text-inverse); font-weight:600; }
.tl-inuse{ background:var(--surface-inverse); color:var(--text-inverse); font-weight:600; box-shadow:inset 0 0 0 2px var(--text-inverse); }
.tl-held{ border:3px double var(--border-strong)!important; font-weight:600; }
.tl-blocked{ background:var(--surface-sunken); border-style:dashed!important; background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px); }
.masked{ font-variant-numeric:tabular-nums; letter-spacing:.06em; }

/* ---------- FOOTER ---------- */
.pagefoot{ margin-top:var(--section-gap); padding-top:var(--s5); border-top:1px solid var(--hairline); display:grid; gap:var(--s3); font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }

/* ---------- DESKTOP ----------
   The full width and navigation rules live in the RESPONSIVE LAYER at the end of
   this sheet. All that is needed here is that the app bar keeps step with the
   content gutter as the gutter grows. */
@media (min-width:600px){
  .appbar, .utilbar__inner{ padding-inline:var(--gutter); }
}

/* ============================================================
   V2 OVERRIDE LAYER
   Brand photography, concrete texture, larger type, inset buttons.
   Palette rule unchanged: dark gray and off white, no third hue.
   ============================================================ */

body{ position:relative; }
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:var(--img-tex); background-size:320px; opacity:.07; mix-blend-mode:multiply;
}
:root[data-theme="dark"] body::before{ mix-blend-mode:screen; opacity:.045; }
@media (prefers-contrast:more){ body::before{ display:none; } }
#shell{ position:relative; z-index:1; }

/* ---------- app bar carries the real wordmark ----------
   The mark is painted on a decorative element and the accessible name lives in a
   .vh span. Hiding real text with text-indent does not work here, because a line
   after a <br> is not indented and prints straight over the logo. */
.wordmark{ gap:0; letter-spacing:0; text-transform:none; }
/* SIZED ON THE AXIS THAT IS ACTUALLY CONSTRAINED.
   The mark is 640x337, which is 1.9:1, and the box used to be 118x26, which is
   4.5:1. background-size:contain fits by the tighter axis, so the painted mark was
   26px tall and 49px wide inside a 118px box, and the other 69px was empty. That is
   why it read as small and why the wordmark seemed to sit in a gap.
   The box now carries the mark's own ratio, so the box and the mark are the same
   thing, and the size is driven from height because height is what the app bar
   fixes. Width follows from aspect-ratio, which is what makes it impossible to
   stretch, squash, or crop it: there is only one free dimension. The clamp is fluid
   across the phone range and the ceiling leaves 7px of air top and bottom inside the
   56px bar, so nothing here changes the bar's height. */
.wordmark__img{
  display:block; width:auto;
  height:clamp(36px, 10vw, 42px);
  aspect-ratio:640 / 337;
  background:var(--img-logo) left center/contain no-repeat;
}
:root[data-theme="dark"] .wordmark__img{ filter:invert(1); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .wordmark__img{ filter:invert(1); } }
body.shell-staff .wordmark__img{ filter:invert(1); }
/* The mark follows the header's ink, not the theme's. Over the hero the header is
   cream on a dark photograph in both themes, and the day theme left a near black mark
   sitting on a near black picture. Last of the four, so it wins the tie in the dark
   theme where two of these match, and there it agrees with them anyway. */
:root.over-hero .wordmark__img{ filter:invert(1); }

/* ---------- tab bar: swoosh, not a pill ---------- */
.tabbar a .tabpill{ width:auto; height:auto; background:none!important; color:inherit!important; }
.tabbar a{ position:relative; }
.tabbar a[aria-current="page"]::after{
  content:""; position:absolute; top:4px; left:50%; transform:translateX(-50%);
  width:38px; height:9px; background:currentColor;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 9'><path d='M0 6 C 11 0, 25 0, 36 2 L 36 5 C 25 3.4, 11 7, 0 9 Z'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 9'><path d='M0 6 C 11 0, 25 0, 36 2 L 36 5 C 25 3.4, 11 7, 0 9 Z'/></svg>") center/contain no-repeat;
}
.tabbar a svg{ width:25px; height:25px; }

/* ---------- buttons stop being edge to edge ---------- */
.btn{ width:auto; max-width:24rem; margin-inline:auto; padding:var(--s3) var(--s6); border-radius:var(--r-btn); }
.btn--sm{ border-radius:var(--r-btn); border-width:1.5px; padding:0 var(--s5); min-height:var(--tap-min); }
.btn--ghost{ border-radius:var(--r-btn); }
.btn-col{ gap:var(--s3); }
.btn-col .btn, .btn-stack .btn{ width:100%; }
.dock .btn{ width:100%; max-width:22rem; }
/* PRESS, and this one is not behind a pointer query, because a touch screen has no
   hover to lead into it. A press is the only feedback a finger gets, so it carries
   the whole response on its own: the wash steps up, the edge firms, and the control
   sits down onto a short shadow. */
.btn:active{
  transform:scale(.985);
  background:rgba(var(--ghost-fill),.30);
  border-color:rgba(var(--ghost-edge),.80);
  box-shadow:0 1px 2px var(--shadow-press);
}
.btn--primary:active{ background:rgba(var(--ghost-edge),.34); border-color:rgba(var(--ghost-edge),.90); }
.btn--ghost:active{ background:rgba(var(--ghost-fill),.24); border-color:rgba(var(--ghost-edge),.70); }
.btn[disabled]:active{ transform:none; background:rgba(var(--ghost-fill),.04); border-color:rgba(var(--ghost-edge),.35); box-shadow:none; }

/* ---------- the two front doors, side by side ----------
   Near square corners, a thin high contrast edge, and a wash rather than a plate.
   The two choices are told apart by fill weight and by typography, never by hue:
   this build carries no third colour anywhere. */
.duo{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:339px){ .duo{ grid-template-columns:1fr; } }
.duocard{
  display:flex; flex-direction:column; gap:8px; min-height:138px; padding:16px 14px 14px;
  border-radius:var(--r-card); border:1px solid rgba(var(--ghost-edge),.22);
  background:rgba(var(--ghost-fill),.07);
  color:var(--text-primary);
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  transition:background var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease),
             border-color var(--dur-ui) var(--ease), box-shadow var(--dur-ui) var(--ease), color var(--dur-ui) var(--ease);
}
.duocard svg{ width:28px; height:28px; }
.duocard b{ font-size:19px; line-height:23px; font-weight:800; letter-spacing:-.01em; }
.duocard .num{ margin-top:auto; font-size:30px; line-height:32px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.duocard .per{ font-size:14px; line-height:18px; color:var(--text-secondary); font-weight:600; }
/* The supporting line is smaller, lighter, and capped well short of the panel it
   sits in, so it never competes with the price above it. */
.duocard .note{
  margin-top:10px; font-size:15px; line-height:21px; font-weight:400;
  color:var(--text-secondary); max-width:42ch; text-wrap:pretty;
}
.duocard:focus-visible{ background:rgba(var(--ghost-fill),.17); }
.duocard:active, .duocard.is-on{
  background:rgba(var(--ghost-fill),.30); border-color:rgba(var(--ghost-edge),.75); transform:scale(.985);
  box-shadow:0 1px 2px var(--shadow-press);
}

/* Over the photograph both panels carry cream text, because the hero gradient is at
   its darkest exactly where they sit. Blur is 1.5px: enough to settle the type, far
   short of frosting the picture out. The text shadow does the readability work that
   an opaque fill used to do, which is what lets the surface drop to a tenth. */
.hero .duocard{
  color:#F5F3DC; opacity:1;
  -webkit-backdrop-filter:blur(1.5px); backdrop-filter:blur(1.5px);
  text-shadow:0 1px 10px rgba(8,8,8,.72);
}
.hero .duocard .per, .hero .duocard .note{ color:#DFDCC2; }

/* Two sheer surfaces with opposite tint directions, not a black card and a white one.
   Reserve a Court washes toward near black, Open Play washes toward the cream, and at
   a tenth of opacity the photograph reads straight through both. What separates them
   is the direction of the tint and the weight of the edge; the palette rule still
   forbids doing it with a hue. */
.hero .duo .duocard:nth-child(1){ background:rgba(8,8,8,.10); border:1px solid rgba(246,244,221,.38); }
.hero .duo .duocard:nth-child(2){ background:rgba(246,244,221,.10); border:1px solid rgba(246,244,221,.48); }
.hero .duo .duocard:nth-child(1):active, .hero .duo .duocard:nth-child(1).is-on{
  background:rgba(8,8,8,.28); border-color:rgba(246,244,221,.70); color:#F5F3DC; }
.hero .duo .duocard:nth-child(2):active, .hero .duo .duocard:nth-child(2).is-on{
  background:rgba(246,244,221,.28); border-color:rgba(246,244,221,.78); color:#F5F3DC; }
.hero .duo .duocard:active .per, .hero .duo .duocard.is-on .per{ color:#DFDCC2; }
@media (prefers-reduced-motion:reduce){ .hero .duocard{ transition:none; } }
@media (prefers-contrast:more){
  .hero .duocard{ -webkit-backdrop-filter:none; backdrop-filter:none; text-shadow:none; }
  .hero .duo .duocard:nth-child(1){ background:rgba(8,8,8,.88); border-color:#F5F3DC; }
  .hero .duo .duocard:nth-child(2){ background:rgba(8,8,8,.72); border-color:#F5F3DC; }
}

/* ---------- community marquee ----------
   Edge to edge in the app column, the same break out the hero uses. The track, the
   veil, and the copy are stacked in one grid cell so the strip sets the height and
   the words sit on top without absolute positioning. */
/* Square cornered, like the hero. Rounding the strip would round the frames at
   both ends of it and stop it reading as one continuous piece of film. */
.marquee{
  --strip-h:clamp(210px, 54vw, 320px);
  position:relative; display:grid; align-items:center; isolation:isolate;
  min-height:var(--strip-h);
  /* Edge to edge, on the same one figure the hero uses. The padding is what keeps
     the headline on the content column while the film runs past it to both edges
     of the viewport. */
  margin-inline:calc(-1 * var(--bleed));
  padding-inline:var(--bleed);
  border:0; outline:0; box-shadow:none; border-radius:0; overflow:hidden;
  background:var(--surface-sunken);
}
/* The track is taken out of flow deliberately. As a grid item its max-content width
   sized the column, which stretched the copy to the width of the whole strip and
   pushed the centred text thousands of pixels off screen. */
/* No will-change. A transform animation is composited anyway, and pre-promoting a
   layer this wide, 11500px of decoded photographs, costs memory for nothing. */
.marquee__track{
  position:absolute; inset:0; z-index:0;
  display:flex; gap:0; width:max-content;
  animation:marquee-run var(--marquee-dur, 45s) linear infinite;
}
.marquee__seq{ display:flex; gap:0; flex:none; height:100%; }
/* Height fills the section, width auto: aspect ratio is preserved and nothing is
   cropped. Square cornered and butted straight against its neighbours, with no
   gap, margin, or radius, so the eighteen frames read as one strip of film rather
   than as eighteen pictures. Grayscale, because the palette rule allows no third
   hue. */
.marquee__seq img{
  display:block; height:100%; width:auto; flex:none;
  margin:0; border:0; border-radius:0;
  filter:grayscale(1) contrast(1.04) brightness(1.24);
}
@keyframes marquee-run{
  from{ transform:translate3d(0,0,0); }
  to{ transform:translate3d(-50%,0,0); }
}
/* A flat veil heavy enough to carry white text at 6:1 also crushes these photographs
   to black, because they are dark and grayscale to begin with. So the scrim is
   centre weighted: dark where the words are, thin at the edges where the strip needs
   to stay readable as a strip. */
.marquee__veil{
  position:absolute; inset:0; z-index:1;
  background:rgba(20,20,20,.14);
}
/* The scrim rides with the words rather than covering the whole strip, so the film
   stays legible as film at the edges while the text sits on something dark enough
   to clear 6:1 over the brightest frame. */
/* This was a centred ellipse, and the two lengths in radial-gradient(ellipse X Y)
   are radii rather than diameters: at 78% of the width the horizontal radius ran
   well past the edge of the strip, the fade never finished inside the box, and the
   scrim sat at roughly half strength on the outermost frame. The film went black
   end to end. A horizontal band replaces it. It fades on the left and right only,
   which is where the strip has to stay readable as a strip, and it holds full
   height in the middle rather than drawing a visible oval on a short box. */
/* The scrim is painted on the section rather than behind the words, because the
   words now sit on the content column while the strip runs to both edges of the
