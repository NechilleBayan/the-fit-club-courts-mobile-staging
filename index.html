   viewport. Behind the copy it would have left the bled part of the film unscrimmed
   and drawn a visible vertical seam down each side. inset:0 on an absolutely
   positioned child is the padding box, which is the whole strip. */
.marquee::after{
  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(90deg,
    rgba(10,10,10,.04) 0%, rgba(10,10,10,.38) 16%, rgba(10,10,10,.56) 42%,
    rgba(10,10,10,.56) 58%, rgba(10,10,10,.38) 84%, rgba(10,10,10,.04) 100%);
}
.marquee__copy{
  position:relative; z-index:3;
  padding-block:var(--s6); text-align:center; color:#F5F3DC;
  text-shadow:0 2px 14px rgba(6,6,6,.92), 0 0 3px rgba(6,6,6,.7);
}
.marquee__copy h2{
  font-size:clamp(25px, 7.2vw, 34px); line-height:1.1; font-weight:800; letter-spacing:-.02em;
}
.marquee__copy p{
  margin-top:var(--s3); font-size:17px; line-height:24px;
  max-width:34ch; margin-inline:auto; color:#E4E1C6;
}
@media (prefers-reduced-motion: reduce){
  .marquee__track{ animation-play-state:paused; }
}
@media (prefers-contrast: more){
  .marquee__veil{ background:rgba(18,18,18,.72); }
  .marquee::after{ background:rgba(16,16,16,.86); }
  .marquee__copy{ text-shadow:none; }
}

/* ---------- back to top ----------
   Ghosted on purpose: it is a convenience, not a decision, so it must never read
   as loud as a real action. Sits clear of the dock and the tab bar. */
.totop{
  position:fixed; right:var(--gutter); z-index:35;
  bottom:calc(var(--dock-h) + var(--tabbar-h) + var(--s4) + env(safe-area-inset-bottom));
  width:52px; height:52px; border-radius:50%;
  display:grid; place-items:center;
  background:rgba(var(--ghost-fill),.10);
  border:1px solid rgba(var(--ghost-edge),.28);
  color:var(--text-primary); opacity:.55;
  -webkit-backdrop-filter:blur(var(--ghost-blur)); backdrop-filter:blur(var(--ghost-blur));
  transition:opacity var(--dur-fast) var(--ease), background var(--dur-ui) var(--ease);
}
body:not(.has-tabbar) .totop{ bottom:calc(var(--dock-h) + var(--s4) + env(safe-area-inset-bottom)); }
.totop svg{ width:24px; height:24px; }
.totop:hover, .totop:focus-visible{ opacity:1; }
.totop[hidden]{ display:none; }
@media (prefers-reduced-motion:reduce){ .totop{ transition:none; } }
@media (prefers-contrast:more){ .totop{ opacity:1; background:var(--surface-raised); border-color:var(--border-strong); } }

/* ---------- hero ---------- */
/* Square cornered on every side, and now edge to edge: the photograph runs to both
   edges of the viewport while the headline, the sentence, and the two panels stay
   on the content column, which --bleed does in one figure. No border, no outline,
   no shadow, no radius, and no wrapper drawn around it. It is a photograph, not a
   panel laid over one. */
/* THE HEADER FLOATS OVER THE HERO.
   The photograph runs up behind the navigation rather than starting underneath it.
   A sheer header needs something to be sheer against, and against the page colour it
   is just a dark band with an edge on it, which is the rectangle the whole treatment
   exists to remove. The hero pays for the overlap in padding, so nothing inside it is
   ever hidden: the mark clears the header at the top and the headline is bottom
   aligned anyway. */
.hero{
  position:relative; isolation:isolate;
  margin-inline:calc(-1 * var(--bleed));
  margin-top:calc(-1 * (var(--pad-top) + var(--header-h)));
  padding:calc(var(--header-h) + 20px) var(--bleed) 24px;
  min-height:70svh; display:flex; flex-direction:column; justify-content:flex-end;
  background:#171717; color:#F5F3DC;
  border:0; outline:0; box-shadow:none; border-radius:0; overflow:hidden;
}
/* cover plus a stated focal point, so the frame is filled at every ratio and
   nothing is stretched. The focal point moves with the shape of the box: on a tall
   phone the interesting part of the frame is higher up than it is in a wide band. */
.hero::before{ content:""; position:absolute; inset:0; z-index:-2; background:var(--img-hero) center 28%/cover no-repeat; filter:grayscale(1) contrast(1.08); }
/* Nothing in the hero's text column is interactive, so nothing in it may be drawn
   as though it were. Stated rather than assumed, because the rectangle that used to
   flash here came from a rule that had no idea it was reaching a headline. */
.hero h1, .hero p.sub{ border:0; outline:0; box-shadow:none; background-color:transparent; }
.hero h1:focus, .hero h1:focus-visible{ outline:none; box-shadow:none; }
.hero::after{ content:""; position:absolute; inset:0; z-index:-1;
  background:linear-gradient(180deg, rgba(26,26,26,.78) 0%, rgba(26,26,26,.24) 32%, rgba(26,26,26,.55) 60%, rgba(26,26,26,.95) 100%); }
/* THE HERO CARRIES NO MARK OF ITS OWN.
   It used to, and the sticky header carries one too, so a phone showed the brand
   twice inside 200 vertical pixels: once at 42px in the bar and again at 44px
   directly under it. The header's is the one that persists down the page, so the
   header's is the one that stays. The hero now opens on the headline, which is what
   the photograph is there to introduce.
   Nothing needed rebalancing underneath it. The column is bottom aligned and the
   mark was pinned to the top of it by margin-bottom:auto, so what it vacated was
   never a gap between the navigation and the headline: it was slack the photograph
   already owned, and the headline has not moved. */
.hero h1{ font-size:clamp(38px,12vw,54px); line-height:1.02; letter-spacing:-.035em; font-weight:800; }
.hero h1 span{ display:block; }
/* A ch in a monospaced face is a real character, not an average one, so the measures
   through this build are counted for the mono rather than inherited from the
   proportional face they were set for. */
.hero p.sub{ margin-top:12px; font-size:18px; line-height:26px; color:#DFDCC2; max-width:32ch; }
/* A staging band under the header is real content and must not be covered, so where
   one is present the hero stops overlapping and sits below it instead. */
#bands:not(:empty) ~ main .hero{
  margin-top:calc(-1 * var(--pad-top));
  padding-top:20px;
}
.hero .maplink{
  display:inline-flex; align-items:center; gap:8px; margin-top:14px; min-height:var(--tap-min);
  color:#DFDCC2; font-size:15px; line-height:20px; font-weight:600; text-decoration:underline;
  text-decoration-color:rgba(218,215,208,.45); text-underline-offset:4px;
}
.hero .maplink svg{ width:19px; height:19px; }
.hero .duo{ margin-top:22px; }

/* ---------- photography, colour except the hero ---------- */
/* Photography is square cornered everywhere. A rounded photograph reads as a card
   of a picture rather than as the picture. */
.photo{ position:relative; border-radius:0; overflow:hidden; border:1.5px solid var(--hairline); }
.photo__img{ width:100%; height:200px; background-size:cover; background-position:center; }
.photo__img--op{ background-image:var(--img-op); }
.photo__img--paddle{ background-image:var(--img-paddle); }
.photo__cap{ position:absolute; left:0; right:0; bottom:0; padding:16px; color:#F5F3DC; font-weight:800; font-size:19px;
  background:linear-gradient(180deg, rgba(26,26,26,0) 0%, rgba(26,26,26,.88) 72%); }

/* ---------- proof row ---------- */
/* ---------- editorial: schedule, facts, steps ----------
   Typography, rules, and alignment instead of boxes. Nothing here draws a card, a
   pill, or an outline: the only strokes are hairline rules between things. */
.sched{ border-top:1px solid var(--hairline); }
.sched > li{ border-bottom:1px solid var(--hairline); }
.sched__row{
  display:flex; align-items:center; gap:14px; width:100%;
  min-height:var(--tap-decision); padding:var(--s3) 0;
  background:none; border:0; text-align:left; color:inherit; font:inherit;
}
.sched__row > svg:first-child{ width:24px; height:24px; flex:none; color:var(--text-secondary); }
.sched__main{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
.sched__t{ font-size:17px; line-height:22px; font-weight:700; }
.sched__s{ font-size:14px; line-height:18px; color:var(--text-secondary); }
.sched__chev{ width:18px; height:18px; flex:none; color:var(--text-secondary); }

.stat{ display:inline-flex; align-items:center; gap:8px; flex:none; font-size:14px; line-height:18px; font-weight:700; }
.dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.dot--on{ background:var(--text-primary); }
.dot--half{ background:linear-gradient(90deg, var(--text-primary) 0 50%, transparent 50% 100%); box-shadow:inset 0 0 0 1.5px var(--text-primary); }
.dot--off{ box-shadow:inset 0 0 0 1.5px var(--border-default); }

.facts{ display:flex; align-items:stretch; }
.facts li{ flex:1 1 0; min-width:0; text-align:center; padding:0 var(--s2); }
.facts li + li{ border-left:1px solid var(--hairline); }
.facts b{ display:block; font-size:24px; line-height:28px; font-weight:800; letter-spacing:-.02em; }
.facts span{ display:block; margin-top:2px; font-size:13px; line-height:17px; color:var(--text-secondary); font-weight:600; }

/* The spine is the content column's left edge, so it connects every step without
   ever running through the numbers. */
.steps{ counter-reset:none; }
.steps > li{ display:grid; grid-template-columns:auto 1fr; gap:var(--s4); align-items:start; }
.steps__n{
  width:34px; font-size:24px; line-height:1.05; font-weight:800; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; color:var(--text-secondary);
}
.steps__b{ border-left:1px solid var(--hairline); padding:0 0 var(--s6) var(--s4); }
.steps > li:last-child .steps__b{ padding-bottom:0; }
.steps__b h3{ font-size:18px; line-height:23px; font-weight:800; }
.steps__b p{ margin-top:var(--s2); font-size:16px; line-height:23px; color:var(--text-secondary); }

.tlink{
  display:inline-flex; align-items:center; gap:8px; min-height:var(--tap-min);
  background:none; border:0; padding:0; color:inherit; font:inherit;
  font-size:16px; font-weight:700;
  text-decoration:underline; text-underline-offset:5px;
  text-decoration-color:var(--border-default);
}
.tlink svg{ width:17px; height:17px; }
.tlink:hover, .tlink:focus-visible{ text-decoration-color:currentColor; }

/* ---------- cards and rows, softer and roomier ---------- */
.card{ border-width:1.5px; }
.row{ border-width:1.5px; min-height:64px; }
.chip{ padding:5px 12px; border-width:1.5px; }
.daybtn{ width:68px; min-height:82px; border-width:1.5px; }
.daybtn small{ letter-spacing:.06em; }
.daybtn strong{ font-size:25px; }
.seg button{ border-radius:var(--r-btn); border-width:1.5px; }
.field input,.field select,.field textarea{ border-width:1.5px; }
/* The whole control fits inside 360 pixels at these sizes, which is why the number
   segment is given in rem and the buttons are a fixed tap target: the number is
   what grows when there is room, and the two controls either side of it never do. */
.qtysel__btn svg{ width:24px; height:24px; }
.qtysel__num{ font-size:36px; }

/* ---------- drag rail ---------- */
.railwrap{ position:relative; border:1px solid rgba(var(--ghost-edge),.22); border-radius:var(--r-card); background:rgba(var(--ghost-fill),.07); overflow:hidden; }
.railhint{ display:flex; align-items:center; justify-content:center; gap:8px; padding:12px;
  background:rgba(var(--ghost-fill),.10); border-bottom:1px solid rgba(var(--ghost-edge),.22); font-size:15px; font-weight:600; color:var(--text-secondary); }
.railhint svg{ width:19px; height:19px; }
.rail{ position:relative; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
.hr{ position:relative; display:flex; align-items:center; gap:12px; width:100%; height:62px; padding:0 16px; border-bottom:1px solid var(--hairline); }
.hr:last-of-type{ border-bottom:0; }
.hr__t{ font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; width:92px; }
.hr__s{ font-size:14px; color:var(--text-secondary); }
.hr[data-off]{ color:var(--ink-400); }
.hr[data-off]::after{ content:""; position:absolute; inset:0; pointer-events:none;
  background-image:repeating-linear-gradient(45deg,var(--hatch) 0 2px,transparent 2px 8px); }
.sel{ position:absolute; left:6px; right:6px; z-index:2; border-radius:12px; pointer-events:none;
  background:var(--surface-inverse); color:var(--text-inverse); box-shadow:0 6px 20px var(--shadow-print);
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:6px 12px;
  transition:top var(--dur-fast) var(--ease), height var(--dur-fast) var(--ease); }
.sel.dragging{ transition:none; }
.sel.armed{ box-shadow:0 0 0 3px var(--surface-raised), 0 0 0 6px var(--border-strong); }
.sel::before{ content:""; position:absolute; inset:7px; border:1.5px dashed color-mix(in srgb, var(--text-inverse) 45%, transparent); border-radius:8px; pointer-events:none; }
.sel__t{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
.sel__s{ font-size:14px; font-weight:600; color:var(--text-inverse-secondary); }
/* The grab bar straddles the edge it moves: the bar is centred on the block's own
   outline, so half of it is outside the block and half inside. That reads as a
   thing attached to the edge rather than a thing floating inside the block, and it
   is the same affordance at the top edge and the bottom one. The 30px box keeps the
   overhang to 15px, which is a quarter of a row, so the hour above and the hour
   below are both still comfortably tappable. */
.hnd{ position:absolute; left:50%; transform:translateX(-50%); width:112px; height:30px;
  display:grid; place-items:center; touch-action:none; pointer-events:auto; }
/* The bar is the block's own ink, and the halo around it is the block's own fill.
   Inside the block the halo is invisible, because it is the same colour as what it
   sits on. Outside it, where the page runs the opposite way round, that halo is
   what keeps the overhanging half readable: near black ink on a near black row
   would otherwise simply disappear the moment half the bar left the block. */
.hnd::after{
  content:""; width:54px; height:5px; border-radius:99px;
  background:var(--text-inverse);
  box-shadow:0 0 0 3px var(--surface-inverse);
}
.hnd--t{ top:-15px; } .hnd--b{ bottom:-15px; }

/* ---------- ATTENTION RED ----------
   One pair per theme. The dark theme lightens rather than reusing the light value,
   so red type on the page and page type on the red wash both stay readable. Red is
   never the whole state: every rule below it also changes a border, and the field
   it paints always carries its sentence underneath, so the meaning survives being
   read in grayscale or by a screen reader. */
:root{
  --critical:#B3261E;
  --critical-surface:rgba(179,38,30,0.08);
  --critical-edge:rgba(179,38,30,0.55);
  --critical-glow:rgba(179,38,30,0.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --critical:#F2857D;
    --critical-surface:rgba(242,133,125,0.12);
    --critical-edge:rgba(242,133,125,0.60);
    --critical-glow:rgba(242,133,125,0.30);
  }
}
:root[data-theme="dark"]{
  --critical:#F2857D;
  --critical-surface:rgba(242,133,125,0.12);
  --critical-edge:rgba(242,133,125,0.60);
  --critical-glow:rgba(242,133,125,0.30);
}

/* A field that has to be corrected before this step can continue. The box itself
   is the message now, which is why there is no summary block at the top of the
   form any more: the reader is sent to the box, not to a list of links to boxes. */
.field.is-invalid input, .field.is-invalid select, .field.is-invalid textarea{
  border:2px solid var(--critical);
  background:var(--critical-surface);
  box-shadow:0 0 0 4px var(--critical-glow);
}
.field.is-invalid .lbl{ color:var(--critical); }
.field .fielderr{ color:var(--critical); }
.check.is-invalid{
  border:2px solid var(--critical);
  border-left-width:var(--bar-w);
  background:var(--critical-surface);
  box-shadow:0 0 0 4px var(--critical-glow);
}
.check.is-invalid + .fielderr{ color:var(--critical); }

/* The whole control once the window has no further admissions to sell. The plus
   segment is disabled at the same moment, so the glow explains a control that has
   already stopped responding rather than announcing one that still works.
   Painted with a ring rather than a heavier border, so nothing about the control
   changes size between its two states and the row does not shift under it. */
.qtysel.is-max{
  border-color:var(--critical);
  background:var(--critical-surface);
  box-shadow:0 0 0 1px var(--critical), 0 0 0 5px var(--critical-glow);
}
.qtysel.is-max .qtysel__num{ color:var(--critical); border-left-color:var(--critical-edge); border-right-color:var(--critical-edge); }
.qtysel.is-max .qtysel__btn{ color:var(--critical); }
.qtysel.is-max .qtysel__btn[disabled]{ color:var(--critical); opacity:.45; }
.atcap{ display:flex; align-items:flex-start; gap:6px; color:var(--critical); font-weight:700; }
.atcap svg{ width:16px; height:16px; flex:none; margin-top:3px; }
@media (prefers-contrast:more){
  .field.is-invalid input, .field.is-invalid select, .field.is-invalid textarea,
  .check.is-invalid{ box-shadow:none; border-width:3px; }
  .qtysel.is-max{ box-shadow:none; border-width:3px; }
}

/* ---------- passes ---------- */
.passcard{ border:1.5px solid var(--hairline); border-radius:var(--r-card); background:var(--surface-raised); overflow:hidden; }
.passcard__top{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1.5px dashed var(--border-default); }
.passcard__n{ font-size:16px; font-weight:800; }
.qrbox{ display:grid; place-items:center; gap:14px; padding:22px 16px; }
.qrlive{ width:min(258px,72vw); aspect-ratio:1; border-radius:10px; background:#F5F3DC; padding:12px; border:1.5px solid var(--hairline); }
.qrlive svg{ width:100%; height:100%; }
.qrdead{ display:grid; place-items:center; text-align:center; gap:10px; color:var(--text-secondary);
  font-size:15px; line-height:21px; font-weight:600; padding:30px 24px;
  width:min(258px,72vw); aspect-ratio:1; border:1.5px dashed var(--border-default); border-radius:10px; }
/* The countdown ring went with the rotating token. A pass code that has to
   survive being downloaded cannot expire in 60 seconds, so single use and
   revocation carry the defence instead. */
.stamp{ background:var(--surface-inverse); color:var(--text-inverse); padding:26px 18px; text-align:center; }
.stamp svg{ width:34px; height:34px; margin-inline:auto; }

/* ---------- pitch black footer ---------- */
.pagefoot{
  margin-inline:calc(-1 * var(--gutter));
  margin-top:var(--s9); margin-bottom:calc(-1 * (var(--dock-h) + var(--s6)));
  padding:36px var(--gutter) 40px; background:#000; color:#EDEBE6; border:0; border-radius:0;
}
.footgrid{ display:grid; grid-template-columns:1fr; gap:26px; max-width:var(--content-max); margin-inline:auto; }
@media (min-width:600px){ .footgrid{ grid-template-columns:1.2fr 1.1fr; gap:20px; } }
.footcol h3{ font-family:var(--mono); font-size:15px; line-height:20px; font-weight:700; letter-spacing:.02em; color:#FFF; margin-bottom:14px; }
.footcol a, .footcol p{ display:block; font-family:var(--mono); font-size:14px; line-height:20px; color:#B9B6B0; text-decoration:none; }
.footcol a{ min-height:var(--tap-min); display:flex; align-items:center; gap:8px; }
.footcol a:hover, .footcol a:focus-visible{ color:#FFF; text-decoration:underline; text-underline-offset:4px; }
.footcol a svg, .footcol p svg{ width:17px; height:17px; flex:none; }
.footcol p{ padding:6px 0; }
/* A footer line that opens with a glyph is laid out like the links around it, so
   the glyph and its sentence share one baseline row instead of the glyph sitting
   on the text as an inline box of its own height. */
.footcol p.footline{ display:flex; align-items:center; gap:8px; min-height:var(--tap-min); padding:0; }
.footcol p.dim{ color:#7E7B76; }
.footmark{ width:170px; height:38px; background:var(--img-logo) left center/contain no-repeat; filter:invert(1); margin-bottom:16px; }
.footnote{ max-width:var(--content-max); margin:26px auto 0; padding-top:18px; border-top:1px solid #26262A;
  font-family:var(--mono); font-size:12px; line-height:19px; color:#6E6B67; }

/* ---------- misc polish ---------- */
.display{ font-size:clamp(30px,9vw,38px); line-height:1.06; letter-spacing:-.028em; font-weight:800; }
h1.screen{ letter-spacing:-.028em; font-weight:800; }
.amount{ letter-spacing:-.03em; }
.sampleband{ border-radius:var(--r-card); }
.plate--fullbleed{ border-radius:0; }
.qr{ border-width:1.5px; }

/* ============================================================
   RESPONSIVE LAYER
   Everything below keys off viewport width and input capability. There is no
   user-agent sniffing and no device name anywhere in this file: a wide window on
   a touch laptop gets the desktop layout and no hover behaviour, a narrow window
   on a desktop gets the phone layout, and both are correct.
   ============================================================ */

/* ---------- INPUT CAPABILITY ----------
   Hover and lift belong to a fine pointer. On a touch screen :hover latches after
   a tap and leaves a control looking permanently pressed, so none of this is
   allowed to reach one. Focus states are separate and always present. */
/* Hover raises the wash by about a quarter, firms the edge, lifts the control 3px,
   and puts a shadow under it. The three move together on purpose: the colour says
   which control the pointer is on, the lift and the shadow say it is a thing that
   can be pressed. It never closes the surface: the photograph is still visible
   through every one of these states, which is the whole point of the resting
   values they move from. */
@media (hover:hover) and (pointer:fine){
  .btn:hover{
    transform:translateY(-3px);
    background:rgba(var(--ghost-fill),.26);
    border-color:rgba(var(--ghost-edge),.78);
    box-shadow:0 10px 22px -8px var(--shadow-lift), 0 3px 8px -3px var(--shadow-lift);
  }
  .btn--primary:hover{ background:rgba(var(--ghost-edge),.28); border-color:rgba(var(--ghost-edge),.88); }
  .btn--secondary:hover{ background:rgba(var(--ghost-fill),.26); border-color:rgba(var(--ghost-edge),.78); }
  .btn--ghost:hover{ background:rgba(var(--ghost-fill),.20); border-color:rgba(var(--ghost-edge),.66); }
  .btn:hover svg:last-child{ transform:translateX(3px); }
  /* A backward control leads with its chevron, so the nudge has to lead with it too.
     Same specificity as the rule above and later in source, which is what wins it. */
  .btn--back:hover svg:last-child{ transform:translateX(-3px); }
  .btn[disabled]:hover{ transform:none; background:rgba(var(--ghost-fill),.04); border-color:rgba(var(--ghost-edge),.35); box-shadow:none; }
  /* Coming down out of the hover lift rather than up from rest, so a press reads as
     the end of a movement the pointer already started. */
  .btn:active{ transform:translateY(0) scale(.985); box-shadow:0 1px 2px var(--shadow-press); }

  /* A hover response is a promise that something happens on click. .card is a content
     block and is never a button or a link in this build, so it does not get one; the
     rows, radio rows, and segments below are controls, so they do. */
  button.row:hover, a.row:hover,
  .optrow:hover > span,
  .seg button:not([aria-pressed="true"]):hover{
    background:rgba(var(--ghost-fill),.17); border-color:rgba(var(--ghost-edge),.50);
  }
  .field input:hover, .field select:hover, .field textarea:hover{ border-color:rgba(var(--ghost-edge),.45); }

  .duocard:hover{
    transform:translateY(-3px);
    background:rgba(var(--ghost-fill),.24);
    border-color:rgba(var(--ghost-edge),.64);
    box-shadow:0 12px 26px -10px var(--shadow-lift), 0 3px 8px -3px var(--shadow-lift);
  }
  /* Over the photograph the shadow is its own heavier value rather than the token.
     The token is mixed for the page surface, and on a dark photograph it would not
     be visible at all. */
  .hero .duo .duocard:nth-child(1):hover{ background:rgba(8,8,8,.30); border-color:rgba(246,244,221,.80); transform:translateY(-3px); box-shadow:0 14px 30px -10px rgba(8,8,8,.72); }
  .hero .duo .duocard:nth-child(2):hover{ background:rgba(246,244,221,.28); border-color:rgba(246,244,221,.88); transform:translateY(-3px); box-shadow:0 14px 30px -10px rgba(8,8,8,.72); }
  /* the panelled pair sets its own fills, so its hover has to out-specify them */
  .duo--detail .duocard:nth-child(1):hover{ background:rgba(var(--ghost-fill),.26); border-color:rgba(var(--ghost-edge),.68); }
  .duo--detail .duocard:nth-child(2):hover{ background:rgba(var(--ghost-fill),.20); border-color:rgba(var(--ghost-edge),.62); }
  .duocard:active{ transform:translateY(0) scale(.985); box-shadow:0 1px 2px var(--shadow-press); }

  .tlink:hover svg{ transform:translateX(4px); }
  .sched__row:hover .sched__chev{ transform:translateX(3px); }

  /* HEADER HOVER. The underline grows out from the left on a destination, the one
     prominent action lifts 2px, and the quiet controls come up from secondary to
     primary ink. All of it on --dur-ui, which is 200ms. Nothing changes shape,
     nothing gains an outline, and none of it reaches a touch screen. */
  .topnav a:hover::after{ transform:scaleX(1); }
  .topnav a:hover{ opacity:.9; }
  .btn-login:hover{ transform:translateY(-3px); background:rgba(var(--ghost-edge),.18); border-color:rgba(var(--ghost-edge),.78);
    box-shadow:0 8px 18px -7px var(--shadow-lift), 0 2px 6px -2px var(--shadow-lift); }
  .btn-login:active{ transform:translateY(0) scale(.985); box-shadow:0 1px 2px var(--shadow-press); }
  /* One step above the login button at rest and one step above it on hover, which
     is the whole of the hierarchy between them. Still a wash, still see-through. */
  :root.nav-cta .nav-book-cta:hover{ background:rgba(var(--ghost-edge),.26); border-color:rgba(var(--ghost-edge),.88); }
  .acct__btn:hover{ background:rgba(var(--ghost-fill),.22); border-color:rgba(var(--ghost-edge),.66); }
  .acct__menu button:hover{ background:color-mix(in srgb, var(--text-primary) 8%, transparent); }
  .utilbar .iconbtn:hover{ color:inherit; opacity:1; }
  .barmenu:hover{ opacity:.75; }
}
/* The focus ring is drawn with a box-shadow halo, and so is the hover lift, so the
   two are competing for one property. This settles it in the ring's favour: same
   specificity as the hover and press rules above and later in the sheet, so a
   focused control keeps its halo whatever the pointer is doing to it. The lift
   itself is a transform and is untouched, so the control still rises. */
.btn:focus-visible,
.duocard:focus-visible,
.btn-login:focus-visible,
.nav-book-cta:focus-visible{ box-shadow:0 0 0 5px var(--focus-halo); }

.tlink svg, .sched__chev{ transition:transform var(--dur-ui) var(--ease); }

@media (prefers-reduced-motion:reduce){
  .btn, .btn svg, .duocard, .tlink svg, .sched__chev, .topnav a::after{ transition:none; }
  /* The movement goes. The colour change and the shadow stay, because neither is
     motion and both are the feedback this setting still needs. */
  .btn:hover, .duocard:hover, .btn:active, .duocard:active{ transform:none; }
  .btn:hover svg:last-child, .tlink:hover svg, .sched__row:hover .sched__chev{ transform:none; }
  .btn-login:hover{ transform:none; }
  .acct__btn .chev, .acct.is-open .acct__btn .chev{ transition:none; }
  /* --dur-ui is already 0.01ms at this setting, so the fade is effectively instant
     without this rule. What this rule removes is the movement itself: the control
     appears and disappears in place rather than sliding 8px, which is what was
     actually asked for. visibility keeps its zero duration either way. */
  .nav-book-cta, :root.nav-cta .nav-book-cta,
  .navswap .headeraccount, :root.nav-cta .navswap .headeraccount{ transform:none; }
  /* --dur-ui is already 0.01ms at this setting, so the width change is effectively
     instant. Named here anyway so the intent survives a change to that token. */
  .navcta{ transition:none; }
}

/* ---------- DESKTOP HEADER NAVIGATION ----------
   Hidden until the bottom bar goes away, so exactly one primary navigation is in
   the document at any width. Current page is an accent line plus a weight change,
   never a filled shape. */
.topnav{ display:none; }
.topnav a{
  position:relative; display:inline-flex; align-items:center;
  min-height:var(--tap-min); padding:0 1px;
  font-size:16px; line-height:20px; font-weight:600; white-space:nowrap; text-decoration:none;
}
.topnav a[aria-current="page"]{ font-weight:800; }
.topnav a::after{
  content:""; position:absolute; left:0; right:0; bottom:11px; height:2px;
  background:currentColor; transform:scaleX(0); transform-origin:left center;
  transition:transform var(--dur-ui) var(--ease);
}
.topnav a[aria-current="page"]::after{ transform:scaleX(1); }

/* ---------- EDITORIAL BANDS ----------
   Two column bands and the rented-venue promo. Single column and unremarkable
   until there is width to justify anything else. */
.band2{ display:grid; gap:var(--section-gap); align-items:start; }
.band2__col{ display:grid; gap:var(--block-gap); align-content:start; }
.promo{
  display:grid; gap:var(--s3);
  background:transparent; border:0; border-radius:0;
  border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline);
  padding:var(--s6) 0;
}
.promo .btn{ margin-inline:0; }
/* With a supporting sentence in each panel, two 160px columns on a phone would set
   the copy four words to a line. It stacks until there is room for two. */
.duo--detail{ grid-template-columns:1fr; gap:12px; }
@media (min-width:600px){ .duo--detail{ grid-template-columns:1fr 1fr; gap:16px; } }
.duo--detail .duocard{ min-height:0; padding:18px 16px 16px; }
/* In the compact hero pair the price is pinned to the foot of the card. Here the
   supporting sentence follows it, and two sentences of different lengths would
   leave the two prices sitting at different heights. Straight stack instead. */
.duo--detail .duocard .num{ margin-top:12px; }
/* One panel filled, one panel outlined. That is the whole distinction, and it is
   made of fill weight and border weight rather than of a second colour. */
.duo--detail .duocard:nth-child(1){
  background:color-mix(in srgb, var(--text-primary) 12%, transparent);
  border-color:color-mix(in srgb, var(--text-primary) 62%, transparent);
}
.duo--detail .duocard:nth-child(2){
  background:transparent;
  border-color:color-mix(in srgb, var(--text-primary) 30%, transparent);
}

/* ---------- TABLET ----------
   The gutter and the reading column widen together. The layout is still one
   column, because a 600 to 1000 pixel window has no room for a second one that is
   worth having. */
@media (min-width:600px){
  :root{
    --gutter:28px; --card-pad:24px; --pad-top:24px;
    --content-max:38rem; --shell-max:38rem; --measure:38rem;
    --block-gap:26px; --section-gap:40px;
  }
  .tabbar{ padding-inline:max(0px, calc((100% - 34rem) / 2)); }
  .hero{ min-height:64svh; padding:calc(var(--header-h) + var(--s6)) var(--bleed) var(--s7); }
  .hero .duo{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
}
@media (min-width:768px){
  :root{
    --gutter:40px; --pad-top:28px;
    --content-max:42rem; --shell-max:44rem; --measure:42rem;
    --section-gap:48px;
  }
}

/* ---------- DESKTOP ----------
   The bottom bar is removed from the layout and the primary navigation moves into
   the sticky header. The container stops being a phone column and becomes a real
   page: wide for the hero and the film strip, still narrow for anything anyone has
   to read. */
@media (min-width:1024px){
  :root{
    --gutter:48px; --card-pad:28px; --pad-top:32px;
    --shell-max:1280px; --content-max:44rem; --measure:40rem;
    --appbar-h:68px; --utilbar-h:36px; --tabbar-h:0px;
    --header-h:calc(var(--utilbar-h) + var(--appbar-h));
    --block-gap:28px; --section-gap:64px;
    --fs-h1:38px; --lh-h1:44px;
    --fs-h2:28px; --lh-h2:34px;
  }

  /* ---------- STRIP ONE: utility ----------
     The slim strip at the very top of the page. It carries the two controls that
     are about the build rather than about booking anything: the staging harness
     and the day/night toggle. It is right aligned to the same centred grid the
     navigation below it uses, so the two strips share both edges. No background and
     no rule of its own: the group's fade is at its darkest up here, which is what
     separates this strip from the navigation, and a divider would put back the
     rectangle the fade exists to remove. */
  .utilbar{ display:block; background:none; border:0; }
  .utilbar__inner{
    display:flex; align-items:center; justify-content:flex-end; gap:var(--s2);
    min-height:var(--utilbar-h);
    padding-inline:calc(max(0px, (100% - var(--shell-max)) / 2) + var(--gutter));
  }
  /* Compact: these are not decisions, so they do not get decision-sized targets.
     The 48px minimum belongs to touch, and this strip only exists at widths where
     the pointer is the fine one. */
  /* Colour is inherited, not a token, so these follow the header: cream over the hero
     and the theme's ink elsewhere. They are held back with opacity rather than with a
     dimmer colour, which is the only way to stay quiet in both places at once. */
  .utilbar .iconbtn{
    min-width:0; min-height:26px; padding:0 var(--s2);
    border-color:transparent; color:inherit; opacity:.72;
    font-size:12px; letter-spacing:.08em;
    transition:opacity var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease);
  }
  .utilbar .iconbtn--demo{ border-style:solid; border-color:rgba(var(--ghost-edge),.30); border-radius:var(--r-btn); }
  .utilbar .iconbtn svg{ width:16px; height:16px; }
  .utilbar .iconbtn--bare{ min-width:26px; }
  .utilbar .iconbtn--bare svg{ width:17px; height:17px; }

  /* ---------- STRIP TWO: navigation ----------
     logo left, destinations right, the one prominent action at the far right.
     The inline padding lands the header content on the same line as the body
     content, so the wordmark and the hero headline share a left edge while the
     full-width visuals run out past both of them to the viewport edge.
     gap is zero on purpose: the back-button slot is present but empty on most
     routes, and a flex gap would push the wordmark off that shared edge.
     No background of its own. The whole header is one fade, painted on the group. */
  .appbar{
    display:flex; align-items:center; gap:0;
    padding-inline:calc(max(0px, (100% - var(--shell-max)) / 2) + var(--gutter));
    background:none; border:0;
  }
  body.shell-staff .utilbar .iconbtn{ color:var(--text-inverse); }
  /* Readability first when the reader has asked for it. At this setting the fade
     becomes a solid plate and takes its divider back, because a sheer header over a
     photograph is a contrast trade and this is the one reader who has said no. */
  @media (prefers-contrast:more){
    .headergroup, :root.over-hero .headergroup{
      background:var(--surface-raised); color:var(--text-primary);
      border-bottom:1px solid var(--border-strong);
      -webkit-backdrop-filter:none; backdrop-filter:none;
    }
    .utilbar{ border-bottom:1px solid var(--hairline); }
  }
  .appbar--ends{ grid-template-columns:none; }
  #bar-start .textbtn{ padding-right:var(--s5); }
  #bar-mid{ display:flex; align-items:center; justify-self:auto; }
  /* The bar is 68px up here rather than 56px, so the mark takes 48px of it and
     still keeps 10px of air above and below. Height only: the width is the aspect
     ratio's business, and it comes out at about 91px. */
  .wordmark__img{ height:48px; }
  .topnav{ display:flex; align-items:center; gap:var(--s6); margin-left:auto; }
  .topnav:empty{ display:none; }
  .topnav:empty + .appbar__slot--end{ margin-left:auto; }
  /* 20px, not 32. The destinations and the account control are one cluster at the
     end of the bar, and a gap wider than the 24px between the destinations
     themselves read as two groups that happened to end up next to each other. */
  .appbar__slot--end{ gap:var(--s3); margin-left:var(--s5); }
  .appbar__slot--end:empty{ margin-left:0; }
  .iconbtn--bare svg{ width:23px; height:23px; }

  /* the menu button is a phone control; up here its build controls are in the
     utility strip, its destinations are in the navigation strip, and the account
     has its own place at the end of it */
  .barmenu{ display:none; }

  /* There is room for both, so the swap slot stops being a swap and becomes a row:
     the booking action, then the account.
     The action takes no width at all until it arrives. It used to reserve its width
     from the first frame so that nothing moved when it appeared, which meant the
     bar carried a permanent hole the size of a button nobody could see. Now the
     navigation is right up against the account control while the reader is at the
     top of the page, and slides left out of the way as the action grows in beside
     it. One movement, on the same 200ms as everything else in the header.
     0fr to 1fr on a one-column grid is what makes that a slide rather than a jump:
     the track is sized from the button, so the width never has to be written down
     here and cannot drift from the button's own padding or its label.
     The gap travels with it. A gap left behind while the action is collapsed would
     be the same hole in a smaller size. */
  .navswap{ display:flex; align-items:center; gap:0; }
  .navswap > *{ grid-area:auto; }
  :root.nav-cta .navswap .headeraccount{ opacity:1; visibility:visible; transform:none; pointer-events:auto; }
  .navcta{
    display:grid; grid-template-columns:0fr; margin-right:0;
    /* min-width:0 on both, and it is load bearing on both. The wrapper is a flex
       item and the button is a grid item, and each of them defaults to a minimum of
       its own min-content, which for a bordered button with 20px of padding is 41
       pixels of nothing. Either one left at auto floors the collapse at that. */
    min-width:0;
    transition:grid-template-columns var(--dur-ui) var(--ease), margin-right var(--dur-ui) var(--ease);
  }
  /* The padding and the edge collapse with the track. min-width:0 takes the label
     out of the track's minimum but not the button's own 20px either side and its
     border, which together are 41 pixels: a hole in the bar that is smaller than
     the button and just as empty. All three shrink on the same duration, so the
     control grows out of nothing rather than out of a gap already held for it. */
  .navcta > .nav-book-cta{
    min-width:0; overflow:hidden;
    padding-inline:0; border-inline-width:0;
    transition:opacity var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease),
               background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease),
               padding var(--dur-ui) var(--ease), border-width var(--dur-ui) var(--ease),
               visibility 0s linear var(--dur-ui);
  }
  :root.nav-cta .navcta{ grid-template-columns:1fr; margin-right:var(--s3); }
  :root.nav-cta .navcta > .nav-book-cta{
    padding-inline:var(--s5); border-inline-width:1px;
    transition:opacity var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease),
               background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease),
               padding var(--dur-ui) var(--ease), border-width var(--dur-ui) var(--ease),
               visibility 0s;
  }

  /* the bottom bar is gone, not hidden behind the content */
  #tabhost.tabbar{ display:none; }

  /* a task route keeps a reading column; only a route that asks for the whole
     container gets it */
  main{ max-width:calc(var(--measure) + 2 * var(--gutter)); }
  body.wide main{ max-width:var(--shell-max); }
  .dock{ padding-inline:calc(max(0px, (100% - var(--shell-max)) / 2) + var(--gutter)); }
  /* the dock's contents line up with the task column above them, not with the
     wider landing container */
  .dock__inner{ max-width:var(--measure); }

  /* text-heavy blocks stay on a readable measure inside the wider frame */
  .sampleband, .banner, .lede, .steps__b p, .promo__t p, .marquee__copy p{ max-width:var(--measure); }
  .duocard .note{ max-width:46ch; }

  /* HERO: full viewport width, square cornered, composed to the left */
  .hero{
    min-height:min(86svh, 820px);
    padding:calc(var(--header-h) + var(--s9)) var(--bleed) var(--s9);
    border-radius:0;
  }
  /* A wide band shows more of the frame's width and less of its height, so the
     focal point drops slightly to hold the same subject in view. */
  .hero::before{ background-position:center 34%; }
  /* A wide hero is a different contrast problem from a tall one. The phone
     gradient runs top to bottom because the copy fills the width; here the copy
     is a left column and the photograph has to stay visible to the right of it,
     so a horizontal scrim carries the text and the vertical one only seats the
     top and bottom edges. */
  .hero::after{
    background:
      linear-gradient(90deg, rgba(18,18,20,.86) 0%, rgba(18,18,20,.72) 40%, rgba(18,18,20,.26) 64%, rgba(18,18,20,0) 82%),
      linear-gradient(180deg, rgba(26,26,26,.58) 0%, rgba(26,26,26,.10) 30%, rgba(26,26,26,.34) 64%, rgba(26,26,26,.86) 100%);
  }
  .hero h1{ font-size:clamp(58px, 5.6vw, 78px); max-width:13ch; }
  .hero p.sub{ margin-top:var(--s4); font-size:20px; line-height:30px; max-width:42ch; }
  .hero .maplink{ margin-top:var(--s4); font-size:16px; }
  .hero .duo{ margin-top:var(--s7); grid-template-columns:repeat(2, minmax(0, 290px)); gap:var(--s4); }
  .hero .duocard{ min-height:160px; padding:20px 20px 18px; }
  .hero .duocard b{ font-size:21px; line-height:25px; }
  .hero .duocard .num{ font-size:34px; line-height:36px; }

  /* what is open, beside the proof numbers */
  .band2{ grid-template-columns:1.55fr 1fr; gap:var(--s9); }
  .band2__col--facts{ padding-top:var(--s2); }
  .band2__col--facts .facts{ flex-direction:column; }
  .band2__col--facts .facts li{ text-align:left; padding:var(--s3) 0; }
  .band2__col--facts .facts li + li{ border-left:0; border-top:1px solid var(--hairline); }
  .band2__col--facts .facts b{ font-size:30px; line-height:34px; }
  .band2__col--facts .facts span{ font-size:14px; }
  .sched__t{ font-size:19px; line-height:24px; }
  .sched__s{ font-size:15px; line-height:20px; }
  .sched__row{ min-height:72px; }

  /* FILM STRIP: full viewport width, taller again, still square cornered */
  .marquee{ --strip-h:clamp(420px, 36vw, 560px); border-radius:0; }
  /* The phone scrim is a centre weighted ellipse, which is right when the strip is
     barely wider than the sentence sitting on it. At this width a centred block
     leaves nowhere for the scrim to fade, so the whole strip goes black and there
     is no film left to look at. The copy moves into a left column and the scrim
     becomes horizontal, dark under the words and gone by two thirds across, so
     the right half of the strip stays visible film. The flat veil lightens, since
     it is no longer carrying any of the contrast. */
  .marquee__veil{ background:rgba(20,20,20,.10); }
  /* The copy is centred at every width now, so the scrim is symmetric again: heavy
     under the words in the middle and gone at both ends, where the strip has to stay
     readable as film. A one-sided gradient would leave the right half of a centred
     headline sitting on bare photograph. */
  .marquee::after{
    background:linear-gradient(90deg,
      rgba(10,10,10,0) 0%, rgba(10,10,10,.26) 20%, rgba(10,10,10,.52) 42%,
      rgba(10,10,10,.52) 58%, rgba(10,10,10,.26) 80%, rgba(10,10,10,0) 100%);
  }
  .marquee__copy{ text-align:center; padding-block:var(--s8); }
  .marquee__copy h2{ font-size:clamp(40px, 3.4vw, 52px); max-width:16ch; margin-inline:auto; }
  .marquee__copy p{ margin-top:var(--s4); margin-inline:auto; font-size:19px; line-height:27px; max-width:44ch; }

  /* PICK YOUR WAY IN: two wide panels, straight edges, hierarchy by type */
  .duo--detail{ gap:var(--s6); }
  .duo--detail .duocard{ padding:var(--s7) var(--s7) var(--s6); gap:10px; }
  .duo--detail .duocard svg{ width:32px; height:32px; }
  .duo--detail .duocard b{ font-size:26px; line-height:31px; }
  .duo--detail .duocard .num{ font-size:42px; line-height:46px; }
  .duo--detail .duocard .per{ font-size:15px; }
  .duo--detail .duocard .note{ margin-top:14px; font-size:17px; line-height:25px; }

  /* the promo reads across rather than down */
  .promo{ grid-template-columns:1fr auto; align-items:center; column-gap:var(--s9); padding:var(--s7) 0; }
  .promo__a{ margin:0; }

  /* four steps across, numbered above a thin rule */
  .steps{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--s6); }
  .steps > li{ display:block; }
  .steps__n{ width:auto; font-size:20px; line-height:24px; }
  .steps__b{ border-left:0; border-top:1px solid var(--hairline); margin-top:var(--s3); padding:var(--s4) 0 0; }
  .steps > li:last-child .steps__b{ padding-bottom:0; }

  /* footer fills the container. The auto inline margins have to go with the max
     width: .pagefoot is a grid, and an auto margin on a grid item shrinks it to
     its content instead of stretching it. */
  .pagefoot{ padding:var(--s9) var(--gutter) var(--s8); }
  .footgrid{ max-width:none; margin-inline:0; grid-template-columns:1.4fr 1fr; gap:var(--s9); }
  .footnote{ max-width:none; margin:var(--s7) 0 0; }
}

@media (min-width:1440px){
  :root{ --gutter:64px; --shell-max:1400px; --measure:42rem; }
}

/* ============================================================
   FOOTER, EDGE TO EDGE
   The black runs to both edges of the viewport at every width, while the footer
   box itself stays on the content column so its text still lines up with the
   page above it. A spread box-shadow paints the bleed instead of a 100vw width,
   because 100vw counts the scrollbar and would shift the whole column by half of
   one. clip-path lets the shadow out sideways and holds it in vertically.
   ============================================================ */
.pagefoot{
  box-shadow:0 0 0 100vmax #000;
  clip-path:inset(0 -100vmax);
}

/* ============================================================
   APP BAR AT NARROW WIDTHS
   Two controls sit to the right of the wordmark on a browse route now: the swap
   slot, holding whichever of the account and the booking action applies, and the
   menu. Below 420px the swap slot tightens its padding, which is the difference
   between "Book Court" fitting beside the mark at 320px and not.
   ============================================================ */
@media (max-width:419px){
  .iconbtn__t{ position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .iconbtn--demo{ min-width:var(--tap-min); padding:0; }
  .appbar__slot--end{ gap:2px; }
  .nav-book-cta, .btn-login{ padding-inline:var(--s3); font-size:15px; }
  .acct__btn{ padding-inline:var(--s2); }
}

/* ============================================================
   QR PASS MODAL
   One participant pass at a time, above the page it was opened from. Nothing in
   here is a soft card: the pass is a rectangle with a hairline around it, and
   the hierarchy is type and space.
   ============================================================ */
#qrmodal{ padding:0; border:0; background:transparent; max-width:100%; max-height:100%; color:var(--text-primary); }
#qrmodal::backdrop{ background:var(--overlay); }
#qrmodal[open]{ display:flex; position:fixed; inset:0; width:auto; height:auto; }

.qrm{
  display:flex; flex-direction:column; width:100%; max-width:100%;
  background:var(--surface); color:var(--text-primary);
  border:1px solid var(--border-default);
}
.qrm__head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4);
  padding:var(--s5) var(--gutter) var(--s4);
  border-bottom:1px solid var(--hairline);
}
.qrm__head h2{ font-size:var(--fs-h2); line-height:var(--lh-h2); font-weight:800; letter-spacing:-.01em; }
.qrm__head .legal{ margin-top:4px; }
.qrm__close{
  flex:none; display:grid; place-items:center; min-width:var(--tap-min); min-height:var(--tap-min);
  border:1px solid var(--border-default); border-radius:var(--r-btn); background:transparent;
  transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease);
}
.qrm__body{ flex:1 1 auto; overflow-y:auto; padding:var(--s5) var(--gutter) var(--s6); }
/* The footer never scrolls, so every row in it is taken straight out of the pass
   above. The two download actions sit side by side at every width for that
   reason, and a single-pass booking gives its one button the whole row. */
.qrm__foot{
  flex:none; display:grid; gap:var(--s3); grid-template-columns:1fr 1fr;
  padding:var(--s4) var(--gutter) calc(var(--s4) + max(0px, env(safe-area-inset-bottom)));
  border-top:1px solid var(--hairline);
}
.qrm__foot .btn{ width:100%; max-width:none; margin:0; padding-inline:var(--s3); }
.qrm__foot .btn--full, .qrm__pager, .qrm__hint{ grid-column:1 / -1; }

/* the pass itself */
.pass{
  border:1px solid var(--border-default); background:var(--surface-raised);
  border-radius:var(--r-card); overflow:hidden;
  max-width:26rem; margin-inline:auto;
}
.pass__top{
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
  padding:var(--s4) var(--s5); border-bottom:1px solid var(--hairline);
}
.pass__who{ font-size:var(--fs-h3); line-height:var(--lh-h3); font-weight:800; letter-spacing:-.01em; }
.pass__of{ flex:none; font-size:var(--fs-legal); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
/* The quiet zone is part of the code, not padding around a picture. A scanner
   needs it, so it is stated in the markup rather than left to a layout accident. */
.pass__qr{ display:grid; place-items:center; padding:var(--s5) var(--s5); background:#FFFFFF; }
.pass__qrbox{ width:min(228px, 58vw); aspect-ratio:1; background:#FFFFFF; padding:14px; }
.pass__qrbox svg{ width:100%; height:100%; display:block; }
.pass__dead{
  width:min(228px, 58vw); aspect-ratio:1; display:grid; place-items:center; text-align:center; gap:10px;
  padding:var(--s5); border:1.5px dashed var(--border-default); color:var(--text-secondary);
  font-size:var(--fs-legal); line-height:var(--lh-legal); font-weight:600; background:var(--surface-sunken);
}
.pass__dead svg{ width:30px; height:30px; }
.pass__facts{ padding:var(--s4) var(--s5) var(--s5); display:grid; gap:0; }
.pass__facts > div{
  display:flex; justify-content:space-between; align-items:baseline; gap:var(--s4);
  padding:10px 0; border-bottom:1px solid var(--hairline); font-size:var(--fs-label); line-height:var(--lh-label);
}
.pass__facts > div:last-child{ border-bottom:0; }
.pass__facts dt{ color:var(--text-secondary); flex:none; }
.pass__facts dd{ margin:0; font-weight:700; text-align:right; }
.pass__note{ padding:0 var(--s5) var(--s5); font-size:var(--fs-legal); line-height:var(--lh-legal); color:var(--text-secondary); }

/* Carousel controls. Present only when there is more than one pass.
   One control set, under the pass, at every width. Arrows beside the pass were
   centred against its full height, which on a short window put them below the
   fold: a previous button you have to scroll to find is not a previous button. */
.qrm__track{ touch-action:pan-y; }
.qrm__arrow{
  flex:none; display:grid; place-items:center; width:var(--tap-min); height:var(--tap-min);
  border:1px solid var(--border-default); border-radius:var(--r-btn); background:transparent;
  transition:background var(--dur-ui) var(--ease), border-color var(--dur-ui) var(--ease), transform var(--dur-ui) var(--ease);
}
.qrm__arrow[disabled]{ opacity:.35; cursor:not-allowed; }
.qrm__pager{
  display:flex; align-items:center; justify-content:center; gap:var(--s3);
  padding-bottom:var(--s2);
}
/* The dots and the count are one reading, stacked and centred on each other: the
   dots show where in the set this pass is and the count says it in words directly
   underneath. Side by side they were two answers to the same question competing
   for the same row. */
.qrm__meter{ display:flex; flex-direction:column; align-items:center; gap:7px; }
.qrm__count{ font-size:var(--fs-label); font-weight:700; font-variant-numeric:tabular-nums; }
.qrm__dots{ display:flex; justify-content:center; gap:6px; }
.qrm__dots i{
  display:block; width:7px; height:7px; border-radius:50%;
  box-shadow:inset 0 0 0 1.5px var(--border-default);
}
.qrm__dots i[data-on="1"]{ background:var(--text-primary); box-shadow:none; }

/* mobile: a near full screen sheet. desktop: a centred modal. */
#qrmodal[open]{ align-items:flex-end; justify-content:center; }
.qrm{ max-height:96svh; border-radius:var(--r-sheet) var(--r-sheet) 0 0; }
@media (min-width:600px){
  #qrmodal[open]{ align-items:center; }
  .qrm{ max-width:34rem; max-height:92svh; border-radius:var(--r-card); }
  .qrm__head, .qrm__body, .qrm__foot{ padding-inline:var(--s7); }
  .qrm__foot .btn{ padding-inline:var(--s5); }
}
/* The footer never scrolls, so anything that grows in it is taken straight out of
   the pass above. Kept small and tight for that reason. */
.qrm__hint{ margin:0; font-size:14px; line-height:19px; }
@media (prefers-reduced-motion: no-preference){
  #qrmodal[open] .qrm{ animation:qrm-in 190ms var(--ease) both; }
  #qrmodal[open]::backdrop{ animation:qrm-fade 190ms var(--ease) both; }
}
@keyframes qrm-in{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
@keyframes qrm-fade{ from{ opacity:0; } to{ opacity:1; } }

@media (hover:hover) and (pointer:fine){
  .qrm__close:hover, .qrm__arrow:not([disabled]):hover{
    background:color-mix(in srgb, var(--text-primary) 10%, transparent); border-color:var(--border-strong);
  }
  .qrm__arrow:not([disabled]):hover{ transform:translateY(-2px); }
}
@media (prefers-reduced-motion:reduce){
  .qrm__close, .qrm__arrow{ transition:none; }
  .qrm__arrow:not([disabled]):hover{ transform:none; }
}

/* ============================================================
   MY BOOKINGS
   A list of reservations, set as editorial entries rather than as a stack of
   cards: a rule between them, the schedule as the loudest line, and one clear
   action each.
   ============================================================ */
.bklist{ border-top:1px solid var(--hairline); }
.bklist > li{ border-bottom:1px solid var(--hairline); padding:var(--s6) 0; }
.bk__head{
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4);
  font-size:var(--fs-eyebrow); line-height:var(--lh-eyebrow); font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--text-secondary);
}
.bk__code{ flex:none; font-variant-numeric:tabular-nums; letter-spacing:.14em; }
.bk__when{ margin-top:var(--s3); font-size:var(--fs-h3); line-height:var(--lh-h3); font-weight:800; letter-spacing:-.01em; }
.bk__meta{ margin-top:var(--s2); font-size:var(--fs-label); line-height:var(--lh-label); color:var(--text-secondary); }
.bk__act{ display:flex; flex-wrap:wrap; gap:var(--s3); margin-top:var(--s4); }
.bk__act .btn{ width:auto; margin:0; }
@media (min-width:600px){
  .bklist > li{ display:grid; grid-template-columns:1fr auto; column-gap:var(--s7); align-items:start; }
  .bk__head, .bk__when, .bk__meta{ grid-column:1; }
  .bk__act{ grid-column:2; grid-row:1 / span 3; margin-top:0; flex-direction:column; align-items:stretch; }
  .bk__act .btn{ justify-content:center; }
}

/* ============================================================
   PARTICIPANT EDITOR
   A list of names, not a stack of cards. Rules between rows, one control each.
   ============================================================ */
.plist{ border-top:1px solid var(--hairline); }
.plist > li{ border-bottom:1px solid var(--hairline); padding:var(--s3) 0; display:grid; gap:var(--s2); }
/* Whose name the box below it wants. Above the box, because that is the order it
   is read in: a reader needs to know before typing, not after. */
.plist__who{ font-size:var(--fs-legal); line-height:var(--lh-legal); font-weight:600; color:var(--text-secondary); }
/* Aligned from the top, not the bottom. Each row's box now carries a line of small
   text under it naming whose name it is, and a bottom alignment would push the
   remove control down past the box it removes. */
.plist__row{ display:flex; align-items:flex-start; gap:var(--s3); }
.plist__row .field{ flex:1 1 auto; min-width:0; }
.plist__row .plist__drop{ margin-top:2px; }
.plist__n{
  flex:none; width:2.4rem; padding-bottom:15px; font-size:var(--fs-label); font-weight:700;
  color:var(--text-secondary); font-variant-numeric:tabular-nums;
}
.plist__drop{
  flex:none; display:grid; place-items:center; width:var(--tap-min); height:var(--tap-min);
  border:1px solid var(--border-default); border-radius:var(--r-btn); background:transparent;
}
.plist__drop[disabled]{ opacity:.35; cursor:not-allowed; }

/* ============================================================
   SCAN RESULT
   Accept and reject are told apart by border weight, fill, and the words, never
   by a hue that does not exist in this build.
   ============================================================ */
.scanres{ border:2px solid var(--border-strong); border-radius:var(--r-card); padding:var(--s5); }
.scanres--reject{
  border-style:dashed; background:var(--surface-sunken);
  background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 8px);
}
.scanres__head{ display:flex; align-items:center; gap:var(--s3); font-size:var(--fs-txn); line-height:var(--lh-txn); font-weight:800; }
.scanres__head svg{ width:26px; height:26px; flex:none; }
.scanres__who{ margin-top:var(--s4); font-size:var(--fs-h1); line-height:var(--lh-h1); font-weight:800; letter-spacing:-.02em; }
.scanres__meta{ margin-top:var(--s3); font-size:var(--fs-label); line-height:var(--lh-label); color:var(--text-secondary); }

/* ============================================================
   TYPOGRAPHY LAYER
   Last in the sheet on purpose. Two families and a four step weight ladder are a
   property of the whole build, not of any one component, and stating them here
   means one place to read them rather than two hundred rules to keep in step.
   Everything below is family, weight, and tracking only. No colour, no layout.

   The split:
     Archivo Black  - anything that names a thing. Headings, prices, the count in a
                      statistic, and the label on a call to action.
     IBM Plex Mono  - everything else, which is most of the page.

   The ladder, lightest first:
     200 note   - legal lines, hints, captions, supporting sentences. Things a reader
                  can skip without losing the thread.
     300 nav    - the navigation and the tab bar.
     400 body   - ordinary prose.
     500 medium - the one line in a row or a block that carries its meaning.
   ============================================================ */

/* Every selector below is prefixed with :root. That is not decoration: the base
   sheet sets weights on compound selectors such as h2.sec, which score (0,1,1) and
   would beat a bare .sec here whatever the order. :root lifts a single class to
   (0,2,0), which wins on class count, so this layer is genuinely the last word on
   family and weight rather than only usually the last word. */

/* ---------- display: headings and CTA labels ---------- */
:root h1, :root h2, :root h3,
:root .display, :root .sec, :root .amount, :root .screen,
:root .hero h1, :root .marquee__copy h2,
:root .duocard b, :root .facts b, :root .dock__summary strong,
:root .pass__who, :root .scanres__who, :root .qrm__head h2,
:root .sheet__head h2, :root .plate__amount,
:root .btn, :root .btn-login, :root .duocard .num{
  font-family:var(--font-display);
  font-weight:400;
  letter-spacing:-.015em;
}
/* Archivo Black has one face and it is already the heaviest thing here. 900 is the
   hero saying so out loud; with font synthesis off the browser serves that face
   clean rather than smearing a fake bold over it. */
:root .hero h1{ font-weight:900; letter-spacing:-.035em; }
/* A monospaced digit inside a black heading jumps out of it, so the tabular figures
   these blocks ask for are turned off wherever the display face is doing the work. */
:root .amount, :root .duocard .num, :root .facts b{ font-variant-numeric:normal; }
/* Small caps labels stay mono. In a black face at 13px, letterspaced and uppercased,
   the counters close up and the word turns into a bar. */
:root .eyebrow{ font-family:var(--font); font-weight:var(--fw-med); letter-spacing:.14em; }

/* ---------- navigation: light ---------- */
:root .topnav a{ font-family:var(--font); font-weight:var(--fw-nav); letter-spacing:.01em; }
/* The current page is the underline first. The weight moves one step, to medium, not
   to bold: against a light navigation one step is already the loudest thing in the row. */
:root .topnav a[aria-current="page"]{ font-weight:var(--fw-med); }
:root .tabbar a{ font-family:var(--font); font-weight:var(--fw-nav); }
:root .tabbar a[aria-current="page"]{ font-weight:var(--fw-med); }
:root .wordmark{ font-family:var(--font); font-weight:var(--fw-med); }
:root .utilbar .iconbtn{ font-family:var(--font); font-weight:var(--fw-nav); }

/* ---------- note: lighter than the navigation ---------- */
:root .legal, :root .footnote, :root .hint,
:root .dock__note, :root .dock__summary small,
:root .duocard .note, :root .duocard .per,
:root .sched__s, :root .facts span, :root .row__sub,
:root .acct__who, :root .sampleband, :root .stagingband, :root .injected,
:root .qrm__hint, :root .pass__of, :root .scanres__meta, :root .field__hint,
:root .steps__b p, :root .promo__t p,
:root .hero p.sub, :root .marquee__copy p, :root .harness .legal{
  font-family:var(--font); font-weight:var(--fw-note);
}
/* One step up from a note: the line in a row or a block that carries its meaning. */
:root .sched__t, :root .row__title, :root .stat, :root .chip,
:root .menurow, :root .acct__btn, :root .acct__menu button,
:root .card__head strong, :root .plate__label, :root .steps__n{
  font-family:var(--font); font-weight:var(--fw-med);
}
/* Ordinary prose, and the default for anything not named above. */
:root body, :root p, :root li, :root dd, :root dt,
:root input, :root select, :root textarea, :root .lede{
  font-family:var(--font);
}
:root body{ font-weight:var(--fw-body); }
/* strong inside body copy is a step, not a shout: the mono has no 700 loaded. */
:root strong, :root b{ font-weight:var(--fw-med); }

/* Mono is wider than the sans it replaced. The headline sizes below hold their line
   counts by giving back a little tracking and a little size at the smallest widths,
   where a monospaced sentence runs out of room first. */
@media (max-width:479px){
  .hero p.sub{ font-size:16px; line-height:24px; max-width:28ch; }
  .marquee__copy p{ font-size:15px; line-height:22px; }
}


/* ---------- DESKTOP: THE STAFF SHELL ----------
   The staff shell's desktop navigation, and the one place in this stylesheet
   where a route gets a different chrome rather than a wider one. Everything here
   is behind body.shell-staff: no customer route reads a line of it, and below
   1024px none of it applies at all.

   The hook is body.has-sidenav rather than body.shell-staff, because two of the
   five staff routes return the task shell. See paintSidenav for why the rail
   follows the path instead.

   TWO DESKTOP CHROMES, DELIBERATELY.
   The strips above serve the customer product and are untouched. Staff get a
   rail instead, and the reason is product rather than width. A visitor arrives
   at a hero, reads down a page, and is offered one conversion action; a Front
   Desk staffer spends a shift moving between five destinations with no hero, no
   scroll, and nothing to convert. The second of those is a console, and it is
   the same console admin/ is, so it wears the same rail rather than a second
   desktop chrome that happens to sit next door to it.

   The header nav this replaces was a deliberate choice too, not a gap: the
   comment on the render branch says staff keep their destinations because they
   are "a different application wearing the same chrome". That premise is exactly
   what argues for the rail. Staff being a different application was right; the
   conclusion has moved from same chrome to its own.

   The rejected alternative was to leave the header nav alone and give the rail
   only to admin/. It is cheaper and it regresses nothing, and it was turned down
   because it leaves two staff-facing desktop chromes in one product, which is
   the confusion this integration exists to remove. Customer and staff differing
   is a distinction a reader can learn once; Front Desk and Ops Manager differing
   is one nobody can.

   Fixed rather than a grid column, which is how the console does it. The console
   owns a plain #shell it can turn into two columns; this one is a flex column
   carrying a sticky header group, a full bleed hero container, and a fixed dock,
   and re-parenting all of that into grid tracks to move a navigation is a much
   larger change than a padding offset for no more result. The rail sits outside
   #shell for the same reason its element does: #shell clips its overflow. */
@media (min-width:1024px){
  body.has-sidenav #shell{
    padding-inline-start:var(--sidenav-w);
    transition:padding-inline-start var(--dur-ui) var(--ease);
  }
  body.has-sidenav #sidenav{
    position:fixed; inset-block:0; inset-inline-start:0; z-index:60;
    width:var(--sidenav-w);
    transition:width var(--dur-ui) var(--ease);
  }
  /* The header keeps the clock, the harness, and the theme toggle. It gives up
     the destinations, which are now in the rail: the same five links twice on one
     screen is the duplication this integration set out to remove, not a fallback
     in case the rail is missed. */
  body.has-sidenav .topnav{ display:none; }
  body.has-sidenav .dock{
    left:var(--sidenav-w);
    transition:left var(--dur-ui) var(--ease);
  }
  /* The header strips centre their content on the shell's own width. Inside a
     padded shell that width is already correct, so the only thing to undo is the
     assumption that the shell starts at the viewport edge. */
  body.has-sidenav .totop{ right:var(--s6); }
}
</style>

</head>
<body>

<symbol viewBox="0 0 24 24" id="i-court" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 12h18M8 4v16M16 4v16"/></symbol>

<script>
/* ============================================================
   PAYMENT TRUTH INVARIANT
   There is no code path in this file from a provider return to
   `confirmed`. Every outcome routes to #/status/:id in the
   CHECKING PAYMENT state, and only verifyPayment() may promote
   an order, after checking hold validity and amount match.
   ============================================================ */
"use strict";

/* ---------- CONSTANTS ---------- */
const RATE_COURT = 350;              // PHP per court-hour  (01_PRODUCT_REQUIREMENTS)
const RATE_OPENPLAY = 150;           // PHP per player admission
const HOLD_MINUTES = 10;             // 01_PRODUCT_REQUIREMENTS PR-CRT-004, configurable by Owner Admin
const OP_CAPACITY = 50;              // default confirmed admissions per window
/* What an Open Play order is allowed to reach. It is the window's own capacity:
   the control refuses at the number the session itself runs out at, rather than at
   a smaller per-order figure the reader has no way to see the reason for. */
const DEMO_QTY_CAP = OP_CAPACITY;
/* How far short the mismatch scenario's payment lands. Small enough to look
   like a fat-fingered transfer rather than a different order entirely, which
   is the case staff actually have to judge. */
const MISMATCH_SHORTFALL = 50;
const TZ = "Asia/Manila";
/* The club's own details now live in club.js, which the admin console reads too.
   VENUE stays as the name this file has always used them by, so the two hundred
   or so references below did not all have to be rewritten to prove a point about
   where the strings are kept. */
const VENUE = window.CLUB;

/* ---------- STATE ---------- */
const S = {
  clockOffsetMs: 0,
  clockPaused: false,
  connectivity: "online",           // online | availability_down | payments_down | maintenance
  surface: "visitor",               // visitor | player | frontdesk | opsmanager
  capacityDial: "available",        // available | almost | full
  injected: null,                   // the armed scenario's label, for the banner
  scenario: null,                   // the armed scenario's key, for branching on
  route: "/",
  lastRoute: "/",
  seq: 1,
  orders: {},
  currentOrderId: null,
  arrivalOpen: false,           // simulated arrival window, drives pass liveness
  offers: {},
  inquiries: {},
  revealed: {},
  draft: {                          // in-flight funnel selection
    product: null, dayIndex: 0, time: null, duration: 1, pax: 4,
    windowId: "w1", qty: 1,
    name: "", mobile: "", email: "", policy: false, marketing: false,
    players: [], sameAsOrganizer: false
  },
  account: null,                    // {name, mobile, email}
  mbTab: "upcoming",                // My Bookings group: upcoming | past | cancelled
  lastScan: null,                   // last door-scan result, staff scanner only
  qr: null,                         // { orderId, index } while the pass modal is open
  toast: null,
  formErrors: {},
  forms: {},                        // last typed value of every field, by id
  reveal: {},
  inPlace: false,
  refocus: null
};

/* ---------- TIME ---------- */
function now(){ return Date.now() + S.clockOffsetMs; }
const TFMT = new Intl.DateTimeFormat("en-PH",{ hour:"numeric", minute:"2-digit", hour12:true, timeZone:TZ });
const DFMT = new Intl.DateTimeFormat("en-PH",{ weekday:"long", month:"long", day:"numeric", timeZone:TZ });
const DSHORT = new Intl.DateTimeFormat("en-PH",{ weekday:"short", timeZone:TZ });
const DNUM = new Intl.DateTimeFormat("en-PH",{ day:"numeric", timeZone:TZ });
const MSHORT = new Intl.DateTimeFormat("en-PH",{ month:"short", timeZone:TZ });
function clockTime(ms){ return TFMT.format(new Date(ms)); }
function dayLabel(ms){ return DFMT.format(new Date(ms)); }
function minutesLeft(deadlineMs){ return Math.max(0, Math.ceil((deadlineMs - now())/60000)); }
function isExpired(o){ return o && o.holdDeadline && now() >= o.holdDeadline; }
/* "7:00 PM" to milliseconds past midnight. Every schedule in this build is written
   as a label, and Upcoming, Past, and pass expiry all need it as a number. */
function hourMs(label){
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(String(label || "").trim());
  if (!m) return 0;
  let h = parseInt(m[1],10) % 12;
  if (/PM/i.test(m[3])) h += 12;
  return (h * 60 + parseInt(m[2],10)) * 60000;
}

/* ---------- FORMAT ---------- */
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function peso(n){ return "₱" + Number(n).toLocaleString("en-PH"); }
function plural(n, one, many){ return n === 1 ? one : many; }
function icon(id, cls){ return '<svg class="' + (cls||"") + '" aria-hidden="true" focusable="false"><use href="#i-' + id + '"></use></svg>'; }
function sampleMark(text){ return '<span class="sample">' + icon("flask") + (text || "Sample") + "</span>"; }
function tbd(text){ return '<span class="tbd">' + esc(text) + "</span>"; }

/* ---------- BOOKING LABELS ---------- */
function bookingTypeLabel(o){ return o.product === "court" ? "Reserve a Court" : "Open Play"; }
function bookingPlaceLabel(o){
  return o.product === "court"
    ? VENUE.name + ", court assigned on arrival"
    : VENUE.name + ", Open Play rotation";
}
function participantsOf(o){
  if (o.admissions && o.admissions.length) return o.admissions;
  /* An order made before participants were collected still has passes, so the
     pass list is the fallback roster rather than an empty one. */
  return passesOf(o).map(function(p){ return { name:p.name, state:"confirmed" }; });
}

/* ---------- ORDER MATH: total is always derived, never stored ---------- */
function orderTotal(o){ return o.lineItems.reduce(function(sum, li){ return sum + li.unitPrice * li.qty; }, 0); }
function orderUnitLine(o){
  const li = o.lineItems[0];
  return peso(li.unitPrice) + " x " + li.qty + " " + plural(li.qty, li.unitNoun, li.unitNounPlural) + " = " + peso(orderTotal(o));
}

/* ---------- SAMPLE DATA ---------- */
const DAY_MS = 86400000;
function baseDay(i){
  const d = new Date(now());
  d.setHours(0,0,0,0);
  return d.getTime() + i * DAY_MS;
}
const COURT_TIMES = [
  { t:"6:00 AM", end:"7:00 AM", state:"available" },
  { t:"7:00 AM", end:"8:00 AM", state:"available" },
  { t:"8:00 AM", end:"9:00 AM", state:"unavailable" },
  { t:"9:00 AM", end:"10:00 AM", state:"limited" },
  { t:"10:00 AM", end:"11:00 AM", state:"available" },
  { t:"1:00 PM", end:"2:00 PM", state:"unavailable" },
  { t:"3:00 PM", end:"4:00 PM", state:"available" },
  { t:"5:00 PM", end:"6:00 PM", state:"limited" },

function paintSidenav(view, path){
  const shell = document.getElementById("shell");
  let el = document.getElementById("sidenav");

     Three of the staff routes return the staff shell and two return the task

     control and a dock, the same shape a customer checkout has. On a phone that
     distinction also decides the tab bar, which is absent on a task screen, and
     rightly so: a phone has about sixty vertical pixels to spare and a task
     needs every one of them plus one unambiguous way forward.

     That constraint does not exist at 1280px. Keeping the rail off those two
     screens would buy nothing and cost a 264 pixel jump of the whole page every

  const groups = CONSOLE_NAV.groupsFor(S.surface).filter(function(g){ return g.group !== "Session"; });

  { to:"/staff/today",      label:"Today",      aria:"Today",           glyph:"cal",    match:["/staff/today"] },
  { to:"/staff/scan",       label:"Scan",       aria:"Scan a pass",     glyph:"scan",   match:["/staff/scan"] },

  { to:"/staff/openplay/w1",label:"Open Play",  aria:"Open Play",       glyph:"users",  match:["/staff/openplay/w1"] },
  { to:"/staff/exceptions", label:"Exceptions", aria:"Exceptions",      glyph:"alert",  match:["/staff/exceptions"] }

function tabHref(t){
  if (!t.dyn) return t.to;

   The phone menu takes the whole list instead, so nothing is ever unreachable
   because of a width. */
function navItems(path){
  return PUBLIC_NAV
    .filter(function(t){ return !t.menuOnly && !(t.authHide && S.account); })
    .map(function(t){ return { href: tabHref(t), cur: t.match.indexOf(path) >= 0, t: t }; });
