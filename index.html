    truth:["No date is reserved and no price is set until the required payment is verified."],
    meta:["Quote and facility hold expire together. Deadline: To be confirmed."] }) + "</div>";
  html += '<div class="section"><div class="card"><dl class="dl">' +
    "<div><dt>Date</dt><dd>" + esc(inq.date || "To be confirmed") + "</dd></div>" +
    "<div><dt>Time</dt><dd>" + esc(inq.time || "To be confirmed") + "</dd></div>" +
    "<div><dt>Scope</dt><dd>All 4 courts</dd></div>" +
    "<div><dt>Facility rate</dt><dd>To be confirmed</dd></div>" +
    "<div><dt>Deposit</dt><dd>To be confirmed</dd></div>" +
    '<div class="total"><dt>Total</dt><dd>To be confirmed</dd></div></dl>' +
    '<span class="unapproved">Unapproved copy, for review</span>' +
    '<p class="legal" style="margin-top:var(--s3)">Every figure on this quote is a placeholder. No Private Event price, rate, or deposit exists in the approved specification, so this build invents none.</p></div></div>';
  return { id:"tok-quote", shell:"token", title:"Private Event quote review", html:html,
    dock:{ action:{ label:"Accept and continue to payment", action:"noop", disabled:true },
           note:"Disabled on this build because no amount is approved. There is nothing safe to charge." } };
}
</script>
<script>
"use strict";
/* ============================================================
   PLAYER SCREENS
   ============================================================ */
function scrSignIn(){
  const stage = S.signinStage || "identify";
  let html = '<h1 class="screen">Sign in</h1>';
  if (stage === "identify"){
    html += '<p class="lede" style="margin-top:var(--s3)">An account is optional. It only saves you typing. There is no password on this product.</p>';
    html += '<form class="form section" id="signinform" novalidate>' +
      fieldHtml("simobile","Mobile number",{ type:"tel", inputmode:"tel", autocomplete:"tel", placeholder:"09XX XXX XXXX", hint:"We accept 09, +639, spaces, and hyphens." }) +
      "</form>";
    html += '<p class="legal section">Verification channel: To be confirmed. On this staging build the code is simulated.</p>';
    html += '<div class="section"><div class="btn-stack">' +
      navBtn("/","Continue as guest") + "</div>" +
      '<p class="legal" style="margin-top:var(--s2)">Guest checkout is first class. You can book, pay, and check in without ever signing in.</p></div>';
    html += '<p class="legal section">Bookings are never linked because two records share a name. Only a verified contact channel links anything.</p>';
    return { id:"ply-signin", shell:"task", title:"Sign in", html:html,
      back:{ label:"Back", to:"/" },
      dock:{ action:{ label:"Send my verification code", action:"sendotp" } } };
  }
  html += '<div class="section">' + plate("verification_sent",{
    truth:["We sent a one-time code to the number you entered."],
    meta:["Verification channel: To be confirmed.","You can ask for a new code shortly."] }) + "</div>";
  html += '<form class="form section" id="otpform2" novalidate>' +
    fieldHtml("otp2","One-time code",{ inputmode:"numeric", autocomplete:"one-time-code", placeholder:"Paste or type the code" }) + "</form>";
  html += '<div class="section"><button class="btn btn--ghost" data-action="signinreset">Use a different number</button></div>';
  html += '<p class="legal section">On this staging build any code signs you in.</p>';
  return { id:"ply-signin", shell:"task", title:"Sign in", html:html,
    back:{ label:"Back", to:"/" },
    dock:{ action:{ label:"Verify and sign in", action:"verifyotp" } } };
}

/* ---------- MY BOOKINGS ---------- */
function paymentLabel(o){
  if (o.paymentStatus === "paid") return "Paid " + peso(o.paidAmount);
  if (o.paymentStatus === "in_person") return "Paid " + peso(o.paidAmount) + " in person";
  if (o.paymentStatus === "none") return "Payment pending";
  if (o.paymentStatus === "checking") return "Checking payment";
  return humanState(o.paymentStatus);
}
/* Three buckets, decided by the clock and by cancellation, never by whether the
   reader has something to do about it. */
function bookingBucket(o){
  if (o.orderStatus === "cancelled") return "cancelled";
  if (o.endsAt && now() > o.endsAt) return "past";
  return "upcoming";
}
function bookingEntry(o, bucket){
  const st = displayStatus(o);
  const paid = st.key === "confirmed" || st.key === "checked_in";
  const list = passesOf(o);
  const people = participantsOf(o).length || list.length;
  const issued = list.some(function(p){ return p.issuedAt; });

  let h = "<li>";
  h += '<p class="bk__head"><span>' + esc(bookingTypeLabel(o)) + "</span>" +
    '<span class="bk__code">' + esc(o.bookingCode) + "</span></p>";
  h += '<p class="bk__when">' + esc(o.meta.when) + "</p>";
  h += '<p class="bk__meta">' + esc(VENUE.name) + " &middot; " + people + " " + esc(plural(people,"player","players")) +
    " &middot; " + esc(paymentLabel(o)) + "</p>";

  h += '<div class="bk__act">';
  if (bucket !== "cancelled" && paid && issued){
    /* The QR action is offered only where a usable pass actually exists. */
    h += '<button class="btn btn--primary btn--sm" data-action="openqr" data-id="' + esc(o.id) + '">' +
      icon("qr") + esc(passesLabel(o)) + "</button>";
  } else if (st.key === "held"){
    h += '<button class="btn btn--primary btn--sm" data-action="nav" data-to="/hold/' + esc(o.id) + '">Complete payment</button>';
  } else if (bucket === "cancelled"){
    h += '<span class="chip chip--quiet">' + icon("ban") + "<span>Passes invalidated</span></span>";
  } else if (!paid){
    h += '<span class="chip chip--quiet">' + icon(st.key === "expired" ? "clock-slash" : "alert") +
      "<span>" + esc(st.key === "expired" ? "Hold expired, nothing charged" : st.phrase) + "</span></span>";
  }
  h += navBtn("/booking/" + encodeURIComponent(o.bookingCode),"Open booking");
  h += "</div>";

  if (!paid && bucket === "upcoming" && st.key !== "held"){
    h += '<p class="legal" style="margin-top:var(--s3)">' + esc(truthLines(st, o)[0] || "There is no confirmed booking on this order, so there are no passes.") + "</p>";
  }
  h += "</li>";
  return h;
}
function scrMe(){
  if (!S.account) return scrSignIn();
  const all = Object.keys(S.orders).map(function(k){ return S.orders[k]; });
  const tab = S.mbTab || "upcoming";
  const groups = { upcoming:[], past:[], cancelled:[] };
  all.forEach(function(o){ groups[bookingBucket(o)].push(o); });
  const shown = groups[tab];

  let html = '<h1 class="screen">My Bookings</h1>';
  html += '<p class="legal" style="margin-top:var(--s2)">Signed in as ' + esc(S.account.name || S.account.mobile) + "</p>";

  html += '<div class="section"><div class="seg" role="group" aria-label="Filter bookings">' +
    [["upcoming","Upcoming"],["past","Past"],["cancelled","Cancelled"]].map(function(t){
      return '<button data-action="mbtab" data-v="' + t[0] + '" data-fk="mbtab-' + t[0] + '" aria-pressed="' +
        (tab === t[0]) + '">' + t[1] + " (" + groups[t[0]].length + ")</button>";
    }).join("") + "</div>";

  if (!shown.length){
    const empty = tab === "upcoming"
      ? ["Nothing upcoming.", "When you book, it appears here with its booking number and its entry passes."]
      : tab === "past"
        ? ["Nothing in the past yet.", "A booking moves here once its session has finished. Passes stay on the record but no longer admit anyone."]
        : ["Nothing cancelled.", "A cancelled booking stays here for reference. Its passes are invalidated."];
    html += '<div class="card" style="margin-top:var(--s5)"><p><strong>' + esc(empty[0]) + "</strong></p>" +
      '<p class="legal" style="margin-top:var(--s2)">' + esc(empty[1]) + "</p></div>";
  } else {
    html += '<ul class="bklist" style="margin-top:var(--s5)">' +
      shown.map(function(o){ return bookingEntry(o, tab); }).join("") + "</ul>";
  }
  html += "</div>";

  /* The same two front doors the landing page offers, in the same component and the
     same in-page arrangement it uses under "Pick your way in". The pair here was a
     price on a <small> inside a button, which is a second way of saying what the duo
     card already says with a number, in a smaller type size, on the one screen whose
     reader has certainly met that card before. */
  html += '<div class="section"><h2 class="sec">Book again</h2>' + duoCTA(true) +
    '<p class="legal" style="margin-top:var(--s3)">Suggestions only. Price and availability are rechecked every time.</p></div>';

  html += '<div class="section"><div class="btn-stack">' +
    navBtn("/me/history","History") + navBtn("/me/groups","Saved groups") + navBtn("/me/profile","Profile and preferences") + "</div></div>";
  return { id:"ply-bookings", shell:"browse", title:"My Bookings", html:html, dock:null };
}

function scrHistory(){
  const list = Object.keys(S.orders).map(function(k){ return S.orders[k]; });
  let html = '<h1 class="screen">History</h1>';
  html += '<p class="legal" style="margin-top:var(--s2)">Past bookings show the price you paid, not today\'s price. An order that was never paid shows nothing paid.</p>';
  html += '<div class="section">';
  if (!list.length){
    html += '<div class="card"><p><strong>Nothing here yet.</strong></p><p class="legal" style="margin-top:var(--s2)">Your past bookings will appear here once you have made one.</p></div>';
  } else {
    html += '<ul class="rows">' + list.concat([{
      id:"hist1", product:"court", meta:{ when:"Saturday, June 6, 5:00 PM to 6:00 PM" }, bookingCode:"HIST 0001",
      orderStatus:"completed", paymentStatus:"paid", paidAmount:250, lineItems:[{ label:"Court time", unitPrice:250, qty:1, unitNoun:"hour", unitNounPlural:"hours" }], admissions:[], refund:null, historic:true
    }]).map(function(o){
      const st = displayStatus(o);
      const settled = o.paidAmount != null;
      return '<li class="row"><span class="row__main"><span class="row__title">' + esc(o.meta.when) + '</span><span class="row__sub">' +
        esc(o.product === "court" ? "Court booking" : "Open Play") + " &middot; " + esc(o.bookingCode) +
        (o.historic ? " &middot; Paid at the rate in force then " + sampleMark("Sample") : "") + "</span></span>" +
        '<span style="text-align:right"><span class="txn">' + esc(settled ? peso(o.paidAmount) : "Nothing paid") + "</span><br>" + orderChip(st) + "</span></li>";
    }).join("") + "</ul>";
  }
  html += "</div>";
  html += '<div class="section"><button class="btn btn--secondary btn--sm" data-action="startcourt">Book similar</button>' +
    '<p class="legal" style="margin-top:var(--s2)">Book similar copies your duration preference only. Date, price, and availability are always rechecked.</p></div>';
  return { id:"ply-history", shell:"browse", title:"History", html:html, dock:null };
}

function scrGroups(){
  let html = '<h1 class="screen">Saved groups</h1>';
  html += '<p class="lede" style="margin-top:var(--s3)">Groups cut repeat typing for Open Play orders. Nothing else.</p>';
  html += '<div class="section"><div class="card"><div class="card__head"><h2 class="sec">Saturday group ' + sampleMark("Sample") + "</h2></div>" +
    '<ul class="rows" style="margin-top:var(--s3)">' +
    ["Mika","Jem","Boy R.","Tin"].map(function(n){
      return '<li class="row"><span class="row__main"><span class="row__title" style="font-size:var(--fs-body);font-weight:400">' + esc(n) + "</span></span>" + icon("person") + "</li>";
    }).join("") + "</ul>" +
    '<p class="legal" style="margin-top:var(--s3)">Members are display names only until they add their own contact details.</p>' +
    '<p class="legal">Using a group never registers, invites, charges, or messages anyone.</p></div></div>';
  html += '<div class="section"><button class="btn btn--secondary btn--sm">Create a group</button></div>';
  return { id:"ply-groups", shell:"browse", title:"Saved groups", html:html, dock:null };
}

function scrProfile(){
  const a = S.account || { name:"", mobile:"", email:"" };
  let html = '<h1 class="screen">Profile and preferences</h1>';
  html += '<form class="form section" id="profileform" novalidate>' +
    fieldHtml("pname","Display name",{ value:a.name, autocomplete:"name" }) +
    fieldHtml("pmobile","Verified mobile",{ type:"tel", inputmode:"tel", value:a.mobile, hint:"Changing this requires verification again. It does not save immediately." }) +
    fieldHtml("pemail","Email",{ type:"email", optional:true, value:a.email }) +
    "</form>";
  html += '<div class="section"><h2 class="sec">Booking messages</h2><div class="card">' +
    "<p>You always receive messages about your own bookings, including holds, payment results, and changes.</p>" +
    '<p class="legal" style="margin-top:var(--s2)">Channels: To be confirmed.</p></div></div>';
  html += '<div class="section"><h2 class="sec">Marketing</h2><div class="form">' +
    '<div class="check check--detached"><input type="checkbox" id="mk1"><label for="mk1"><span>Open Play schedule news, by mobile message.</span></label></div>' +
    '<div class="check check--detached"><input type="checkbox" id="mk2"><label for="mk2"><span>Open Play schedule news, by email.</span></label></div>' +
    "</div>" +
    '<p class="legal" style="margin-top:var(--s3)">Marketing is separate from booking messages, unchecked by default, and can be switched off at any time.</p></div>';
  html += '<div class="section"><button class="btn btn--secondary btn--sm" data-action="signout">Sign out</button>' +
    '<p class="legal" style="margin-top:var(--s2)">Useful on a shared phone. Signing out does not affect a booking you opened with a code.</p></div>';
  html += '<p class="legal section">Not collected on this product: Date of birth, sex, photo, identity document, any upload, any password.</p>';
  return { id:"ply-profile", shell:"browse", title:"Profile and preferences", html:html,
    dock:{ action:{ label:"Save changes", action:"saveprofile" }, note:"A change to a verified mobile number is held as pending until it is verified again." } };
}

/* ============================================================
   STAFF SCREENS
   ============================================================ */
function scrToday(){
  const isOps = S.surface === "opsmanager";
  const stale = S.connectivity !== "online";
  const list = Object.keys(S.orders).map(function(k){ return S.orders[k]; });
  const exceptions = list.filter(function(o){ const k = displayStatus(o).key; return k === "needs_review" || k === "late_payment"; });

  let html = '<h1 class="screen">Today</h1>';
  html += '<p class="legal" style="margin-top:var(--s2)">Venue time ' + esc(clockTime(now())) + ", Asia/Manila. Last updated " + esc(clockTime(now())) + ".</p>";
  if (stale){
    html += '<div class="section"><div class="banner">' + icon("alert") + "<div><p><strong>This view may be out of date.</strong></p>" +
      '<p class="legal">Changes are blocked while the view is stale. Last updated ' + esc(clockTime(now())) + ".</p>" +
      '<p style="margin-top:var(--s2)"><button class="btn btn--secondary btn--sm" data-action="retry">Refresh</button></p></div></div></div>';
  }

  if (exceptions.length){
    html += '<div class="section"><h2 class="sec">Exceptions</h2><ul class="rows">' +
      exceptions.map(function(o){
        const st = displayStatus(o);
        return '<li><button class="row row--bar" style="width:100%" data-action="nav" data-to="/staff/booking/' + esc(o.id) + '">' +
          '<span class="row__main"><span class="row__title">' + esc(st.phrase) + '</span><span class="row__sub">' + esc(o.bookingCode) + " &middot; " + esc(o.meta.when) + "</span></span>" + icon("chev-r") + "</button></li>";
      }).join("") + "</ul>" +
      '<p class="legal" style="margin-top:var(--s2)">Exceptions sit above routine completed work.</p></div>';
  }

  html += '<div class="section"><h2 class="sec">Now and next</h2><ul class="rows">';
  if (!list.length){
    html += '<li class="row"><span class="row__main"><span class="row__title" style="font-size:var(--fs-body);font-weight:400">No bookings today. Add a walk-in or view another date.</span></span></li>';
  } else {
    list.slice(0,3).forEach(function(o){
      const st = displayStatus(o);
      const cls = st.key === "held" ? " tl-held" : "";
      html += '<li><button class="row' + (cls ? " row--bar" : "") + '" style="width:100%" data-action="nav" data-to="/staff/booking/' + esc(o.id) + '">' +
        '<span class="row__main"><span class="row__title">' + esc(o.meta.when) + '</span><span class="row__sub">' +
        esc(o.organizer.name || "Walk-in") + " &middot; " + esc(o.bookingCode) + "</span></span>" +
        orderChip(st) + icon("chev-r") + "</button></li>";
    });
  }
  html += "</ul></div>";

  html += '<div class="section"><div style="display:flex;justify-content:space-between;align-items:center;gap:var(--s3)"><h2 class="sec">Courts</h2>' +
    '<button class="btn btn--ghost btn--sm" style="width:auto;padding:0 var(--s3)" data-action="toggletimeline" data-fk="tl">' + (S.timeline ? "Switch to card view" : "Switch to timeline") + "</button></div>";
  if (S.timeline){
    html += '<div class="timeline" tabindex="0" role="region" aria-label="Four court timeline, scrolls horizontally"><table><caption class="vh">Court schedule for today</caption><thead><tr><th>Time</th>' +
      [1,2,3,4].map(function(n){ return "<th>Court " + n + "</th>"; }).join("") + "</tr></thead><tbody>";
    ["6 PM","7 PM","8 PM","9 PM"].forEach(function(t,i){
      html += "<tr><th>" + t + "</th>";
      for (let c=1;c<=4;c++){
        if (i >= 1) html += '<td class="tl-booked">Open Play</td>';
        else if (c === 1) html += '<td class="tl-held">Held</td>';
        else if (c === 4) html += '<td class="tl-blocked">Blocked</td>';
        else html += "<td>Available</td>";
      }
      html += "</tr>";
    });
    html += "</tbody></table></div>" +
      '<p class="legal" style="margin-top:var(--s2)">Open Play is one venue operation window across all courts, not four separate customer bookings.</p>';
  } else {
    html += '<div class="stack-sm">';
    for (let c=1;c<=4;c++){
      html += '<div class="card' + (c === 4 ? " card--sunken" : "") + '"><div class="card__head"><h3 class="sub">Court ' + c + "</h3>" +
        chip(c === 1 ? "heldcourt" : c === 4 ? "blocked" : "available") + "</div>" +
        '<p class="legal" style="margin-top:var(--s2)">' +
        (c === 1 ? "Held until a stated time, not paid" : c === 4 ? "Maintenance block. Not shown to customers with a reason." : "Free until 7:00 PM, then Open Play") + "</p></div>";
    }
    html += "</div>";
  }
  html += "</div>";

  html += '<div class="section"><h2 class="sec">Open Play tonight</h2><div class="card">' +
    "<p><strong>" + esc(windowTitle(OP_WINDOWS.w1)) + ", " + esc(OP_WINDOWS.w1.start + " to " + OP_WINDOWS.w1.end) + "</strong></p>" +
    '<p class="legal" style="margin-top:var(--s2)">One venue operation window across all ' + VENUE.courts + " courts.</p>" +
    '<p style="margin-top:var(--s3)">' + navBtn("/staff/openplay/w1","Open the window") + "</p></div></div>";

  html += '<div class="section"><h2 class="sec">Arrivals</h2><ul class="rows">' +
    ["Mika R.","Jem A."].map(function(n,i){
      const key = "arr" + i;
      return '<li class="row"><span class="row__main"><span class="row__title">' + esc(n) + '</span><span class="row__sub masked">' +
        (S.reveal[key] ? "0917 555 0" + (100+i) : "09XX XXX XX" + (10+i)) + "</span></span>" +
        '<button class="iconbtn" data-action="reveal" data-key="' + key + '" data-fk="rv-' + key + '">' + (S.reveal[key] ? "Hide" : "Reveal") + "</button></li>";
    }).join("") + "</ul>" +
    '<p class="legal" style="margin-top:var(--s2)">Contact details stay masked until someone asks for them.</p></div>';

  if (!isOps){
    html += '<p class="legal section">Refund, rate, export, and settings controls are absent for Front Desk. The server also denies this.</p>';
  }

  return { id:"stf-today", shell:"staff", title:"Today", html:html,
    dock:{ action:{ label:"Add walk-in", action:"nav", to:"/staff/walkin", disabled: stale },
           note: stale ? "Changes are blocked while this view is stale." : null } };
}

function scrStaffBooking(params){
  const o = S.orders[params.id];
  if (!o) return scrLink({});
  const st = displayStatus(o);
  const isOps = S.surface === "opsmanager";
  let html = '<h1 class="screen">' + esc(o.bookingCode) + "</h1>";
  html += '<div class="section">' + plate(st.key, {
    phrase: st.key === "held" ? "Held until " + clockTime(o.holdDeadline) : st.phrase,
    truth: truthLines(st, o),
    meta: st.key === "checked_in" ? ["Checked in " + clockTime(o.checkinAt) + " by " + (o.checkinBy || "Front Desk")] : []
  }) + "</div>";

  html += '<div class="section"><h2 class="sec">State dimensions</h2><div class="card"><dl class="dl">' +
    "<div><dt>Inventory</dt><dd>" + esc(o.orderStatus === "confirmed" || o.orderStatus === "checked_in" ? "Booked" : o.orderStatus === "awaiting_payment" ? "Held" : "Released") + "</dd></div>" +
    "<div><dt>Order</dt><dd>" + esc(humanState(o.orderStatus)) + "</dd></div>" +
    "<div><dt>Payment</dt><dd>" + esc(humanState(o.paymentStatus)) + "</dd></div>" +
    "<div><dt>Admissions</dt><dd>" + (o.admissions.length ? o.admissions.length + " lines" : "Not applicable") + "</dd></div>" +
    "<div><dt>Check-in</dt><dd>" + esc(o.checkinAt ? "Checked in " + clockTime(o.checkinAt) : "Not checked in") + "</dd></div>" +
    "</dl>" +
    '<p class="legal" style="margin-top:var(--s3)">These are kept separate on purpose. A summary that merged them could hide a contradiction.</p></div></div>';

  html += '<div class="section"><h2 class="sec">Customer</h2><div class="card"><dl class="dl">' +
    "<div><dt>Name</dt><dd>" + esc(o.organizer.name || "Walk-in") + "</dd></div>" +
    '<div><dt>Mobile</dt><dd class="masked">' + esc(S.reveal["c" + o.id] ? (o.organizer.mobile || "Not given") : "09XX XXX XX" + o.id.slice(-2)) + "</dd></div>" +
    "</dl>" +
    '<p style="margin-top:var(--s3)"><button class="btn btn--secondary btn--sm" data-action="reveal" data-key="c' + esc(o.id) + '" data-fk="rv-c' + esc(o.id) + '">' +
    (S.reveal["c" + o.id] ? "Hide contact details" : "Reveal contact details") + "</button></p></div></div>";

  html += '<div class="section"><h2 class="sec">Payment</h2><div class="card">' +
    '<p class="eyebrow muted">Online</p><p style="margin-top:var(--s2)">' + esc(o.paymentStatus === "paid" ? "Paid " + peso(o.paidAmount) + " through Maya Checkout" : "No verified online payment") + "</p>" +
    '<hr class="rule" style="margin:var(--s4) 0">' +
    '<p class="eyebrow muted">In person</p><p style="margin-top:var(--s2)">' + esc(o.manualMethod ? o.manualMethod + " recorded " + peso(orderTotal(o)) : "None recorded") + "</p>" +
    '<p class="legal" style="margin-top:var(--s3)">Online and in-person payment are kept structurally separate. No staff action here can produce an online Paid.</p>' +
    (o.paymentStatus === "manual_pending"
      ? (isOps
        ? '<p style="margin-top:var(--s3)"><button class="btn btn--secondary btn--sm" data-action="verifymanual" data-id="' + esc(o.id) + '">Verify this manual transfer</button></p>'
        : '<p class="legal" style="margin-top:var(--s3)">Verifying a manual transfer is not available to Front Desk. The server also denies this.</p>')
      : "") +
    "</div></div>";

  if (o.product === "openplay"){
    html += '<div class="section"><h2 class="sec">Admissions</h2><ul class="rows">' +
      o.admissions.map(function(a,i){
        return '<li class="row"><span class="row__main"><span class="row__title">' + esc(a.name || "Player " + (i+1)) + '</span><span class="row__sub">' +
          esc(humanState(a.state || "held")) + "</span></span>" + chip(a.checkedIn ? "checkedin" : a.name ? "named" : "nameneeded") + "</li>";
      }).join("") + "</ul></div>";
  }

  html += '<div class="section"><h2 class="sec">Notifications</h2><ul class="rows">' +
    '<li class="row"><span class="row__main"><span class="row__title" style="font-size:var(--fs-body);font-weight:400">Hold created</span><span class="row__sub">Queued</span></span></li>' +
    (o.paymentStatus === "paid" ? '<li class="row"><span class="row__main"><span class="row__title" style="font-size:var(--fs-body);font-weight:400">Payment confirmed</span><span class="row__sub">Failed to send, retried</span></span></li>' : "") +
    "</ul>" +
    '<p class="legal" style="margin-top:var(--s2)">A failed message never changes booking truth. The booking above is unaffected.</p></div>';

  html += '<div class="section"><h2 class="sec">Audit</h2><div class="card">' +
    '<p class="legal">' + esc(clockTime(o.createdAt)) + " Hold created by customer. Policy version: To be confirmed.</p>" +
    (o.checkinAt ? '<p class="legal">' + esc(clockTime(o.checkinAt)) + " Checked in by " + esc(o.checkinBy || "Front Desk") + ".</p>" : "") +
    "</div></div>";

  if (!isOps){
    html += '<p class="legal section">Cancel, refund, and rate controls are absent for Front Desk. The server also denies this.</p>';
  }

  let dock;
  if (o.checkinAt){
    dock = { action:{ label:"Already checked in", action:"noop", disabled:true },
             note:"Checked in " + clockTime(o.checkinAt) + " by " + (o.checkinBy || "Front Desk") + ". A reversal needs a reason and is appended, never deleted." };
  } else if (o.orderStatus === "confirmed"){
    dock = { action:{ label:"Check in", action:"checkin", id:o.id } };
  } else if (st.key === "held"){
    dock = { action:{ label:"Check in", action:"noop", disabled:true }, note:"This booking is not paid. Check-in is not available until payment is verified." };
  } else {
    dock = { action:{ label:"Back to Today", action:"nav", to:"/staff/today" } };
  }
  return { id:"stf-booking", shell:"task", title:"Booking " + o.bookingCode, html:html,
    back:{ label:"Back to Today", to:"/staff/today" }, dock:dock };
}

/* ---------- SCR staff-scan ----------
   The door. One pass in, one pass out: scanning a code admits the participant it
   belongs to and touches nobody else on the booking. */
function scrScan(){
  const r = S.lastScan;
  let html = '<h1 class="screen">Scan a pass</h1>';
  html += '<p class="lede" style="margin-top:var(--s3)">One scan admits one participant. A booking of four needs four scans.</p>';

  if (r){
    html += '<div class="section"><div class="scanres' + (r.ok ? "" : " scanres--reject") + '" tabindex="-1" id="scanres">' +
      '<p class="scanres__head">' + icon(r.ok ? "check-double" : r.key === "duplicate" ? "clock-slash" : "ban") +
      "<span>" + esc(r.head) + "</span></p>";
    if (r.p){
      html += '<p class="scanres__who">' + esc(r.p.name || ("Participant " + r.p.n)) + "</p>" +
        '<p class="scanres__meta">Pass ' + r.p.n + " of " + passesOf(r.o).length + " &middot; " + esc(r.o.bookingCode) +
        "<br>" + esc(bookingTypeLabel(r.o)) + " &middot; " + esc(r.o.meta.when) +
        "<br>Organizer " + esc(r.o.organizer.name || "not given") + "</p>";
    }
    html += '<p class="scanres__meta">' + esc(r.detail || "") + "</p>";
    if (r.ok && r.o){
      const left = passesOf(r.o).filter(function(p){ return !p.usedAt && !p.cancelledAt; }).length;
      html += '<p class="scanres__meta">' + (left
        ? left + " " + plural(left,"participant","participants") + " on this booking " + plural(left,"has","have") + " not arrived yet."
        : "Everyone on this booking has now checked in.") + "</p>";
    }
    html += '<p style="margin-top:var(--s5)"><button class="btn btn--secondary btn--sm" data-action="clearscan">Scan the next pass</button></p>';
    html += "</div></div>";
  }

  html += '<form class="form section" id="scanform" novalidate>' +
    fieldHtml("scancode","Pass code from the scanner",{ placeholder:"Paste or type the code", value:"" }) +
    '<p><button class="btn btn--primary btn--sm" data-action="doscan">' + icon("scan") + "Check this pass</button></p>" +
    "</form>";

  /* Standing in for a camera. Every issued code in the build, so the accept, the
     duplicate, and every rejection can be walked through by hand. */
  const rows = [];
  Object.keys(S.orders).forEach(function(k){
    const o = S.orders[k];
    passesOf(o).forEach(function(p){
      if (!p.issuedAt) return;
      rows.push({ o:o, p:p });
    });
  });
  html += '<div class="section"><div class="card card--sunken hatch" style="border:2px dashed var(--border-default)">' +
    '<p class="legal"><strong>Staging control.</strong> There is no camera here, so these stand in for one. The code behind each button is the same opaque token the real scanner would read.</p>';
  if (!rows.length){
    html += '<p class="legal" style="margin-top:var(--s3)">No passes have been issued yet. Complete a booking first.</p>';
  } else {
    html += '<ul class="rows" style="margin-top:var(--s4)">' + rows.map(function(x){
      const ps = passStatus(x.o, x.p);
      return '<li><button class="row" data-action="scantok" data-tok="' + esc(x.p.token || "") + '" data-id="' + esc(x.o.id) + '" data-n="' + x.p.n + '">' +
        icon("qr") + '<span class="row__main"><span class="row__title">' + esc(x.p.name || ("Participant " + x.p.n)) + "</span>" +
        '<span class="row__sub">' + esc(x.o.bookingCode) + " &middot; Pass " + x.p.n + " of " + passesOf(x.o).length + " &middot; " + esc(ps.label) + "</span></span>" +
        icon("chev-r") + "</button></li>";
    }).join("") + "</ul>";
  }
  html += "</div></div>";

  return { id:"stf-scan", shell:"staff", title:"Scan a pass", html:html, dock:null };
}

function scrWalkin(){
  const p = S.walkinProduct || "court";
  const method = S.walkinMethod || "cash";
  const isOps = S.surface === "opsmanager";
  const total = p === "court" ? RATE_COURT : RATE_OPENPLAY;
  let html = '<h1 class="screen">Walk-in</h1>';
  html += '<div class="section"><h2 class="sec" id="lbl-prod">What are they buying?</h2>' +
    '<div class="seg" role="group" aria-labelledby="lbl-prod">' +
    '<button data-action="wprod" data-p="court" data-fk="wp-court" aria-pressed="' + (p === "court") + '">Court booking</button>' +
    '<button data-action="wprod" data-p="openplay" data-fk="wp-openplay" aria-pressed="' + (p === "openplay") + '">Open Play admission</button></div></div>';
  html += '<div class="section"><div class="card"><dl class="dl">' +
    "<div><dt>When</dt><dd>Now, " + esc(clockTime(now())) + "</dd></div>" +
    "<div><dt>Availability</dt><dd>Checked live</dd></div>" +
    '<div class="total"><dt>Amount</dt><dd>' + esc(peso(total)) + "</dd></div></dl></div></div>";
  html += '<form class="form section" id="walkinform" novalidate>' +
    fieldHtml("wname","Customer name",{ autocomplete:"name" }) +
    fieldHtml("wmobile","Mobile",{ type:"tel", inputmode:"tel", optional:true }) +
    "</form>" +
    '<p class="legal">There is no email field on this screen.</p>';
  html += '<div class="section"><h2 class="sec" id="lbl-pay">Payment method</h2>' +
    '<div class="seg" role="group" aria-labelledby="lbl-pay">' +
    '<button data-action="wmethod" data-m="cash" data-fk="wm-cash" aria-pressed="' + (method === "cash") + '">Cash</button>' +
    '<button data-action="wmethod" data-m="terminal" data-fk="wm-terminal" aria-pressed="' + (method === "terminal") + '">Maya terminal</button>' +
    (isOps ? '<button data-action="wmethod" data-m="comp" data-fk="wm-comp" aria-pressed="' + (method === "comp") + '">Complimentary</button>' : "") +
    "</div>";
  if (method === "terminal"){
    html += '<div class="form" style="margin-top:var(--s4)">' + fieldHtml("wref","Terminal receipt reference",{ hint:"Duplicate references are flagged before the sale is recorded." }) + "</div>";
  } else if (method === "cash"){
    html += '<div class="form" style="margin-top:var(--s4)">' + fieldHtml("wcash","Amount received",{ inputmode:"numeric", value:String(total), hint:"Change helper only, not a financial record." }) + "</div>";
  } else if (method === "comp"){
    html += '<div class="form" style="margin-top:var(--s4)">' + fieldHtml("wreason","Reason for a zero-value settlement",{ type:"textarea" }) + "</div>" +
      '<p class="legal">Complimentary is a zero-value settlement recorded with authorisation and a reason. It is not a payment, a discount, or free play.</p>';
  }
  if (!isOps){
    html += '<p class="legal" style="margin-top:var(--s3)">Complimentary needs Operations Manager authorisation, so the control is absent here. The server also denies this.</p>';
  }
  html += "</div>";
  html += '<p class="legal section">There is no control anywhere on this screen that can mark an online payment as paid.</p>';
  return { id:"stf-walkin", shell:"task", title:"Walk-in", html:html,
    back:{ label:"Back to Today", to:"/staff/today" },
    dock:{ action:{ label:"Record " + peso(total) + " " + (method === "cash" ? "cash" : method === "terminal" ? "on the terminal" : "as complimentary") + " and check in", action:"dowalkin" } } };
}

function scrStaffOpenPlay(params){
  const w = OP_WINDOWS[params.windowId] || OP_WINDOWS.w1;
  const orders = Object.keys(S.orders).map(function(k){ return S.orders[k]; }).filter(function(o){ return o.product === "openplay"; });
  let confirmed = 0, held = 0;
  orders.forEach(function(o){
    if (o.orderStatus === "confirmed" || o.orderStatus === "checked_in") confirmed += o.admissions.length;
    else if (o.orderStatus === "awaiting_payment" && !isExpired(o)) held += o.admissions.length;
  });
  const offers = Object.keys(S.offers).length;
  let html = '<h1 class="screen">Open Play window</h1>';
  html += '<p class="txn" style="margin-top:var(--s2)">' + esc(windowTitle(w) + ", " + w.start + " to " + w.end) + "</p>";
  html += '<p style="margin-top:var(--s3)">' + chip(w.state === "completed" ? "completed" : "places") + "</p>";
  html += '<div class="section"><h2 class="sec">Capacity, staff only</h2><div class="card"><dl class="dl">' +
    "<div><dt>Confirmed admissions</dt><dd>" + confirmed + "</dd></div>" +
    "<div><dt>Active holds</dt><dd>" + held + "</dd></div>" +
    "<div><dt>Outstanding offers</dt><dd>" + offers + "</dd></div>" +
    '<div class="total"><dt>Remaining</dt><dd>' + Math.max(0, OP_CAPACITY - confirmed - held - offers) + "</dd></div></dl>" +
    '<p class="legal" style="margin-top:var(--s3)">These figures appear on no public surface. Outstanding offers consume capacity while they are live.</p></div></div>';

  html += '<div class="section"><h2 class="sec">Admissions</h2>';
  const rows = [];
  orders.forEach(function(o){ o.admissions.forEach(function(a,i){ rows.push({ o:o, a:a, i:i }); }); });
  if (!rows.length){
    html += '<div class="card"><p><strong>No admissions sold yet.</strong></p><p class="legal" style="margin-top:var(--s2)">Add a walk-in player, or wait for online orders.</p></div>';
  } else {
    html += '<ul class="rows">' + rows.map(function(r){
      return '<li class="row' + (r.a.name ? "" : " row--bar") + '"><span class="row__main"><span class="row__title">' + esc(r.a.name || "Player " + (r.i+1)) + '</span>' +
        '<span class="row__sub">' + esc(r.o.bookingCode) + " &middot; " + esc(humanState(r.o.orderStatus)) + "</span></span>" +
        chip(r.a.checkedIn ? "checkedin" : r.a.name ? "named" : "nameneeded") + "</li>";
    }).join("") + "</ul>";
  }
  html += "</div>";


  return { id:"stf-openplay", shell:"task", title:"Open Play window, staff", html:html,
    back:{ label:"Back to Today", to:"/staff/today" },
    dock:{ action:{ label:"Add walk-in player", action:"nav", to:"/staff/walkin" } } };
}

function scrExceptions(){
  const isOps = S.surface === "opsmanager";
  const list = Object.keys(S.orders).map(function(k){ return S.orders[k]; })
    .filter(function(o){ const k = displayStatus(o).key; return k === "needs_review" || k === "late_payment" || k === "manual_transfer"; });
  let html = '<h1 class="screen">Exception queue</h1>';
  html += '<p class="legal" style="margin-top:var(--s2)">Every customer-facing "Needs staff review" has a place to be resolved here, so the state machine is closed rather than open-ended.</p>';
  html += '<div class="section">';
  if (!list.length){
    html += '<div class="card"><p><strong>Nothing open.</strong></p><p class="legal" style="margin-top:var(--s2)">Use the Demo drawer to force an amount mismatch or a late payment and it will appear here.</p></div>';
  } else {
    html += '<ul class="rows">' + list.map(function(o){
      const st = displayStatus(o);
      const mins = Math.max(1, Math.round((now() - o.createdAt)/60000));
      return '<li><button class="row row--bar" style="width:100%" data-action="nav" data-to="/staff/booking/' + esc(o.id) + '">' +
        '<span class="row__main"><span class="row__title">' + esc(st.phrase) + '</span>' +
        '<span class="row__sub">Customer sees: ' + esc(st.phrase) + "</span>" +
        '<span class="row__sub">' + esc(o.bookingCode) + " &middot; " + mins + " " + esc(plural(mins,"minute","minutes")) + " old &middot; Unassigned</span></span>" +
        icon("chev-r") + "</button></li>";
    }).join("") + "</ul>" +
      '<p class="legal" style="margin-top:var(--s3)">Refund amounts and provider limitations show as To be confirmed until a real figure exists. Nothing is invented here.</p>';
  }
  html += "</div>";
  if (!isOps) html += '<p class="legal section">Front Desk sees a reduced set and the verify control is absent. The server also denies this.</p>';
  return { id:"stf-exceptions", shell:"staff", title:"Exception queue", html:html, dock:null };
}
</script>
<script>
"use strict";
/* ============================================================
   STAGING HARNESS
   Visually quarantined so a screenshot of it can never pass as
   product UI.
   ============================================================ */
/* The eleven scenarios now live in scenarios.js, because the admin console reads
   the same table. Kept under the old name so the harness below and the /demo
   screen read as they did. */
const SCENARIOS = window.SCENARIOS;
const ALL_ROUTES = [
  ["/", "pub-landing, Landing"], ["/rates","pub-rates, Rates & How It Works"], ["/visit","pub-visit, Visit / Contact"],
  ["/court","pub-court-when, Reserve a Court"], ["/court/review","pub-court-review, Court review and details"],
  ["/openplay","pub-openplay, Open Play schedule"], ["/openplay/w1","pub-op-window, Open Play window"],
  ["/openplay/w1/players","pub-op-players, Organizer and player names"],
  ["/find","pub-find, Find My Booking"], ["/policies","pub-policies, Policies and waiver"],
  ["/event","pub-event, Plan a Private Event"],
  ["/signin","ply-signin, Sign in"], ["/me","ply-bookings, My Bookings"], ["/me/history","ply-history, History"],
  ["/me/groups","ply-groups, Saved groups"], ["/me/profile","ply-profile, Profile and preferences"],
  ["/staff/today","stf-today, Today"], ["/staff/scan","stf-scan, Scan a pass"], ["/staff/walkin","stf-walkin, Walk-in"],
  ["/staff/openplay/w1","stf-openplay, Open Play window, staff"], ["/staff/exceptions","stf-exceptions, Exception queue"],
  ["/sys/link","sys-link, Link not valid"], ["/sys/interruption","sys-interruption, Service interruption"],
  ["/demo","sys-demo, Staging harness"],
    ["/t/name/expired","tok-name, Player name invite, expired"],

  /* ---------- THE ADMIN CONSOLE ----------
     Twenty-six screens that are not routes in this router. They are separate
     documents in admin/, so their entries carry a third element: The group they
     belong to, which doubles as the flag that says this is an href rather than a
     hash. The list renders them under their group headings with the real file
     path in the code line, so nobody mistakes one for a route this file can
     resolve.

     They are in THIS array rather than one of their own because the console used
     to keep a hand-maintained contact sheet of itself at admin/index.html. The
     moment this harness also listed the admin pages there were two indexes of one
     folder, both maintained by hand, and the second one to be edited would have
     been wrong. The contact sheet is gone. This is the index. */

  ["admin/dashboard.html", "adm-dashboard, Dashboard", "Console"],
  ["admin/bookings.html", "adm-bookings, Bookings", "Console"],
  ["admin/courts.html", "adm-courts, Courts", "Console"],
  ["admin/staff.html", "adm-staff, Staff", "Console"],
  ["admin/more.html", "adm-more, More", "Console"],

  ["admin/booking-details.html", "adm-booking, Booking detail", "Detail screens"],
  ["admin/court-details.html", "adm-court, Court detail", "Detail screens"],
  ["admin/staff-details.html", "adm-staff-one, Staff member", "Detail screens"],
  ["admin/player-details.html", "adm-player, Player record", "Detail screens"],

  ["admin/tasks.html", "adm-tasks, Tasks and delegation", "Operations"],
  ["admin/open-play.html", "adm-openplay, Open Play", "Operations"],
  ["admin/check-in.html", "adm-checkin, Check-in", "Operations"],
  ["admin/payments.html", "adm-payments, Payments", "Operations"],
  ["admin/players.html", "adm-players, Players and customers", "Operations"],
  ["admin/maintenance.html", "adm-maintenance, Maintenance", "Operations"],
  ["admin/closures.html", "adm-closures, Blocked dates and closures", "Operations"],
  ["admin/messages.html", "adm-messages, Messages", "Operations"],
  ["admin/notifications.html", "adm-notifications, Notifications", "Operations"],
  ["admin/reports.html", "adm-reports, Reports", "Operations"],
  ["admin/activity.html", "adm-activity, Activity log", "Operations"],

  ["admin/club-profile.html", "adm-club, Club profile", "Club and system"],
  ["admin/staff-manage.html", "adm-staff-manage, Staff management", "Club and system"],
  ["admin/rates.html", "adm-rates, Rates and promotions", "Club and system"],
  ["admin/hours.html", "adm-hours, Operating hours", "Club and system"],
  ["admin/settings.html", "adm-settings, Settings", "Club and system"],
  ["admin/help.html", "adm-help, Help and support", "Club and system"]
];

function openDemo(){
  const dlg = document.getElementById("sheet");
  unanchorSheet();
  const o = S.orders[S.currentOrderId];
  let b = "";
  /* This paragraph used to say everything was lost on refresh. It is the first
     thing anyone reads in here, and it stopped being true when the dials moved
     into shared storage, so it now separates the two halves by name rather than
     by promising the simpler thing. */
  b += '<p class="legal">Staging harness, not part of the product. Nothing here reaches a real customer, a real court, or a real payment. ' +
       'The dials below are remembered: Surface, scenario, connectivity, capacity, the simulated clock, and the theme survive a refresh and carry into the admin console. ' +
       'Bookings are not: An order, its hold deadline, and its passes live in memory only and are gone the moment you reload. ' +
       'Reset all state, at the foot of this sheet, clears the remembered half.</p>';

  /* ADMIN IS NOT A FIFTH SURFACE.
     It sets opsmanager and then leaves for the console, which is why it carries
     no pressed state: the four above are states this document can be in, and this
     one is a door. Treating Admin as a role of its own would have meant inventing
     a fifth set of permissions for the same person Rea Salvador already is on the
     Operations Manager surface, and then keeping the two in step forever. The
     console is what an Operations Manager gets on a laptop, not somebody else. */
  b += '<div><h3>Surface</h3><div class="grid2">' +
    [["visitor","Visitor"],["player","Signed-in player"],["frontdesk","Front Desk"],["opsmanager","Operations Manager"]]
      .map(function(s){ return '<button class="h" data-action="setsurface" data-v="' + s[0] + '" aria-pressed="' + (S.surface === s[0]) + '">' + s[1] + "</button>"; }).join("") +
    '<button class="h" style="grid-column:1/-1" data-action="setsurface" data-v="admin">Admin / Club Manager, opens the console</button>' +
    '</div><p class="legal" style="margin-top:var(--s2)">Simulated role. The real system enforces this on the server; hiding a control is not the security boundary.</p>' +
    '<p class="legal" style="margin-top:var(--s2)">Admin is the Operations Manager&rsquo;s console view, not a fifth role. It sets the Operations Manager surface and opens admin/dashboard.html, carrying the armed scenario and the theme across.</p></div>';

  /* The armed scenario is shown as a pressed state rather than left to memory,
     because it is now the one dial whose effect is not on this screen: it
     survives a reload without re-seeding anything here, and the console reads it
     to choose which sample to draw. Without the marker there would be no way to
     tell from inside the customer app which scenario the console is about to
     render. */
  const armed = STAGING.getScenario();
  b += '<div><h3>Scenario</h3><div class="grid1">' +
    SCENARIOS.map(function(s){
      return '<button class="h" data-action="scenario" data-v="' + s.key + '" aria-pressed="' + (armed === s.key) + '">' + esc(s.label) + "</button>";
    }).join("") +
    '</div><p class="legal" style="margin-top:var(--s2)">Picking one seeds this build and arms the same scenario in the admin console. The seeded order does not survive a reload; the armed key does, so after a refresh the scenario is still marked here and still drawn there, but the booking it made is gone.</p></div>';

  b += '<div><h3>Simulated clock</h3><div class="grid2">' +
    [["1","Advance 1 minute"],["5","Advance 5 minutes"],["9","Advance 9 minutes"]]
      .map(function(c){ return '<button class="h" data-action="clock" data-v="' + c[0] + '">' + c[1] + "</button>"; }).join("") +

/* The one dialog element carries the menu, the date picker, and the staging
   harness in turn, so the anchoring has to come off as deliberately as it went on.
   Cleared here and on open, not only on close, because a sheet can be opened from
   inside another one. */
function unanchorSheet(){
  const d = document.getElementById("sheet");
  if (!d) return;
  d.classList.remove("is-anchored");
  d.style.removeProperty("--anchor-top");
  d.style.removeProperty("--anchor-right");
  d.style.removeProperty("--anchor-ox");
}
function closeSheet(){ const d = document.getElementById("sheet"); unanchorSheet(); if (d.open) d.close(); }
/* A press on the backdrop lands on the dialog element itself, never on the panel
   inside it, which is how a click outside is told from a click within. A panel
   hanging off a button is dismissed by pressing away from it; that is what the rest
   of the screen going dim is offering to do. */
(function(){
  const d = document.getElementById("sheet");
  if (!d) return;
  d.addEventListener("click", function(ev){ if (ev.target === d) closeSheet(); });
  d.addEventListener("close", unanchorSheet);
})();

function captureForms(){
  const app = document.getElementById("app");
  if (app){
    app.querySelectorAll("input, select, textarea").forEach(function(el){
      if (!el.id) return;
      S.forms[el.id] = el.type === "checkbox" ? el.checked : el.value;
    });
  }
  const g = function(id){ const e = document.getElementById(id); return e ? (e.type === "checkbox" ? e.checked : e.value) : undefined; };
  const n = g("name"); if (n !== undefined) S.draft.name = n;
  const m = g("mobile"); if (m !== undefined) S.draft.mobile = m;
  const e = g("email"); if (e !== undefined) S.draft.email = e;
  const p = g("policy"); if (p !== undefined) S.draft.policy = p;
  const mk = g("marketing"); if (mk !== undefined) S.draft.marketing = mk;
  for (let i=0;i<MAX_ROWS;i++){ const v = g("p" + i); if (v !== undefined) S.draft.players[i] = v; }
  const c = g("code"); if (c !== undefined) S.findCode = c;
}
/* An in-place re-render keeps the reader where they were. It must not scroll to
   the top, must not move focus to the heading, and must not re-announce the
   screen name that has not changed. */
function rerender(fk){ S.refocus = fk || null; S.inPlace = true; render(); }
function rerenderFrom(el, fallback){ rerender((el && el.getAttribute("data-fk")) || fallback || null); }
/* Consent is never carried over to the next order. Contact details are. */
function resetDraft(){
  const n = S.draft.name, m = S.draft.mobile, e = S.draft.email;
  S.draft = { product:null, dayIndex:0, time:null, duration:1, pax:4, windowId:"w1", qty:1,
              name:n, mobile:m, email:e, policy:false, marketing:false, players:[], sameAsOrganizer:false };
  S.forms = {};
  S.skipCapture = true;
}
function copyText(v){
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).catch(function(){});
  announce("Copied " + v);
}
function seedOrganizer(){
  if (!S.draft.name) S.draft.name = "Sample Organizer";
  if (!S.draft.mobile) S.draft.mobile = "0917 555 0100";
  /* Consent is never seeded. It has to be given, every time, by a person. */
}
/* A booking for one participant is never asked for a participant name, because the
   organizer has already given theirs and asking again is the same question twice.
   The single pass is written with the organizer's name here instead. */
function soloName(i, count){
  return count < 2 && i === 0 ? (S.draft.name || "").trim() : "";
}
function makeCourtOrder(){
  const d = S.draft;
  const startMs = baseDay(d.dayIndex) + hourMs(d.time);
  /* A court reservation also carries one admission per player, so the participant
     list, the pass list, and the staff roster are the same list everywhere. */
  const adm = [];
  for (let i=0;i<d.pax;i++) adm.push({ id:"a"+i, name:((d.players[i] || soloName(i, d.pax)) || "").trim(), state:"held", checkedIn:false });
  const o = createOrder({
    product:"court",
    lineItems:[{ label:"Court time", unitPrice:RATE_COURT, qty:d.duration, unitNoun:"hour", unitNounPlural:"hours" }],
    passCount: d.pax,
    admissions: adm,
    startsAt: startMs,
    endsAt: startMs + d.duration * 3600000,
    meta:{ when: dayLabel(baseDay(d.dayIndex)) + ", " + d.time + " to " + endTimeFor(d.time, d.duration) }
  });
  syncPassNames(o);
  return o;
}
function makeOpOrder(windowId){
  const d = S.draft, w = OP_WINDOWS[windowId] || OP_WINDOWS.w1;
  const adm = [];
  for (let i=0;i<d.qty;i++) adm.push({ id:"a"+i, name:((d.players[i] || soloName(i, d.qty)) || "").trim(), state:"held", checkedIn:false });
  const base = baseDay(w.dayOffset);
  const o = createOrder({
    product:"openplay",
    lineItems:[{ label:"Open Play admission", unitPrice:RATE_OPENPLAY, qty:d.qty, unitNoun:"admission", unitNounPlural:"admissions" }],
    admissions: adm,
    startsAt: base + hourMs(w.start),
    endsAt: base + hourMs(w.end),
    meta:{ when: windowTitle(w) + ", " + w.start + " to " + w.end, windowId: w.id }
  });
  syncPassNames(o);
  return o;
}
/* The admission list is where a name is typed; the pass list is where it is read.
   One copy step, called wherever names change, so the two cannot drift. */
function syncPassNames(o){
  const list = passesOf(o);
  (o.admissions || []).forEach(function(a, i){ if (list[i]) list[i].name = a.name || ""; });
}

/* ---------- THE DIALS ----------
   S is the runtime. STAGING is the persisted intent. They are not the same thing
   and the split is the whole design: S holds a live order graph with absolute
   deadlines and generated identifiers, which cannot survive a reload and is not
   asked to; STAGING holds six scalars that say what is being demonstrated, which
   have to survive both a reload and the jump into the admin console.

   One push, called from every harness control that moves a dial, rather than a
   write beside each assignment. A sixth control added later cannot forget one of
   them, which is the same argument the admin console's DATA object makes about
   its counts. */
function syncDials(){
  STAGING.setSurface(S.surface);
  STAGING.setConnectivity(S.connectivity);
  STAGING.setCapacity(S.capacityDial);
  STAGING.setClockOffset(S.clockOffsetMs);
}

/* The runtime half of a reset. Split out from the Reset all state button because
   loading a scenario also starts from a clean slate, and picking a scenario must
   not throw away a theme the reader chose: the theme lives in the persisted half
   now, and only the button that says it resets everything is allowed to clear
   it. */
function resetRuntime(){
  S.clockOffsetMs = 0; S.clockPaused = false; S.connectivity = "online"; S.surface = "visitor";
  S.capacityDial = "available"; S.injected = null; S.scenario = null; S.orders = {}; S.currentOrderId = null;
  S.arrivalOpen = false; S.offers = {}; S.inquiries = {}; S.account = null; S.reveal = {}; S.formErrors = {};
  S.forms = {}; S.skipCapture = true;
  S.findStage = "entry"; S.signinStage = "identify"; S.saveStage = "offer"; S.timeline = false;
  S.draft = { product:null, dayIndex:0, time:null, duration:1, pax:4, windowId:"w1", qty:1, name:"", mobile:"", email:"", policy:false, marketing:false, players:[] };
}

const ACTIONS = {

  reveal: function(el){ const k = el.getAttribute("data-key"); S.reveal[k] = !S.reveal[k]; rerenderFrom(el); },
  toggletimeline: function(el){ S.timeline = !S.timeline; rerenderFrom(el); },

  startcourt: function(){ S.draft.product = "court"; go(S.connectivity === "maintenance" ? "/sys/interruption" : "/court"); },
  totop: function(){

    window.scrollTo({ top:0, behavior: reduce ? "auto" : "smooth" });

  qrdownload: function(){

  },
  qrdownloadall: function(){ const o = qrOrder(); if (o) downloadAllPasses(o); },
  gotobookings: function(el){

       have one yet, so they go through the existing save-my-details screen rather

  },

  mbtab: function(el){ S.mbTab = el.getAttribute("data-v"); rerenderFrom(el); },

  /* ---------- header controls ---------- */
  appmenu: function(){ captureForms(); openAppMenu(); },
  /* Navigating out of a menu closes the menu. The account dropdown is rebuilt by
     render() anyway, but the sheet is not, so it is closed here explicitly. */
  acctnav: function(el){ closeAccountMenu(); closeSheet(); captureForms(); go(el.getAttribute("data-to")); },
  accountmenu: function(el){
    const w = el.closest(".acct");
    if (!w) return;
    const open = !w.classList.contains("is-open");

      const first = w.querySelector('.acct__menu [role="menuitem"]');
      if (first) first.focus();
    }
  },

  /* ---------- theme ---------- */
  /* The sheet is not rebuilt by render(), so when the toggle is used from inside
     the overflow menu the menu has to be repainted or it keeps offering the theme
     that is already on. */
  theme: function(){
    const sheetOpen = document.getElementById("sheet").open;
    setTheme(currentTheme() === "dark" ? "light" : "dark");
    if (sheetOpen && document.querySelector("#sheet .menusheet")) openAppMenu();
  },
  /* Routed through the same door as the staff scanner, so a simulated scan here
     and a real one there cannot disagree about what a code means. */
  passscan: function(el){
    const o = S.orders[el.getAttribute("data-id")];
    if (!o) return;
    const p = passesOf(o)[parseInt(el.getAttribute("data-n"),10) - 1];
    if (!p) return;
    const r = scanPass(p.token, "Front Desk");
    S.lastScan = r;
    announce(r.head + ". " + (r.detail || ""));
    S.inPlace = true; render();
    if (S.qr) paintQrModal();
  },

  /* A name change on a paid booking is a reissue, not an edit. */
  renamepass: function(el){
    const o = S.orders[el.getAttribute("data-id")];
    if (!o) return;
    const n = parseInt(el.getAttribute("data-n"),10);
    const p = passesOf(o)[n - 1];
    if (!p) return;
    const f = document.getElementById("pname" + n);
    const name = f ? f.value.trim() : p.name;
    const reissued = reissuePass(o, p, name);
    const a = o.admissions && o.admissions[n - 1];
    if (a) a.name = p.name;
    const rk = el.getAttribute("data-rk");
    if (rk) S.reveal[rk] = false;
