function resolveOutcome(o){
  const outcome = o.pendingOutcome;
  if (!outcome) return;
  o.pendingOutcome = null;
  o.lastChecked = now();
  const total = orderTotal(o);
  if (outcome === "success")       verifyPayment(o, { eventId:"e"+(S.seq++), amount: total });
  else if (outcome === "mismatch") verifyPayment(o, { eventId:"e"+(S.seq++), amount: total - 50 });
  else if (outcome === "late"){    expireOrder(o); verifyPayment(o, { eventId:"e"+(S.seq++), amount: total }); }
  else if (outcome === "failed")    o.paymentStatus = "failed";
  else if (outcome === "cancelled") o.paymentStatus = "cancelled";
  else if (outcome === "abandoned") o.paymentStatus = "failed";
  render();
  const st = displayStatus(o);
  announce("Status updated: " + st.phrase);
}

/* Loading a scenario resets the runtime, applies the scenario's seed, and
   separately records which scenario is armed. The record is what the admin
   console reads: it gets a key and renders its own sample for it, because the
   order graph this function builds is full of absolute deadlines and generated
   identifiers and does not cross a document boundary. Within this document the
   record is display only, which the harness copy now says: a reload restores the
   dials, not the seeded order, so the scenario is not silently replayed under a
   URL that still points at the order the previous run created.

   The thirty-line switch is gone. What each scenario does is now data on the
   scenario itself, and the four functions below are the only things that know
   how to carry it out. Adding a twelfth scenario is a row in scenarios.js, not
   a case here, and the seed can be read without reading the code that applies
   it. The observable result is unchanged: every one of the eleven lands on the
   same route, with the same order in the same state, as it did before. */
function settleOrder(o, how){
  if (!how) return;
  if (how === "paid")     verifyPayment(o, { eventId:"seed", amount: orderTotal(o) });
  else if (how === "short") verifyPayment(o, { eventId:"seed", amount: orderTotal(o) - MISMATCH_SHORTFALL });
  else if (how === "failed") o.paymentStatus = "failed";
  else if (how === "late"){ expireOrder(o); verifyPayment(o, { eventId:"seed", amount: orderTotal(o) }); }
  /* Ninety seconds is short enough that the escalation is visible without the
     simulated clock and long enough to read the screen first. */
  else if (how === "expiring") o.holdDeadline = now() + 90000;
}
/* A route in a seed is written the way a reader would say it: /status/:id,
   /booking/:code. The three placeholders are the three identifiers a seeded
   order can be addressed by, and an inquiry has the fourth. */
function seedRoute(pattern, o, inquiry){
  return pattern
    .replace(":code", o ? encodeURIComponent(o.bookingCode) : "")
    .replace(":id",   o ? o.id : "")
    .replace(":ref",  inquiry ? encodeURIComponent(inquiry.ref) : "");
}

function loadScenario(key){
  const scn = SCENARIO_BY_KEY[key];
  if (!scn) return;
  const seed = scn.seed || {};

  resetRuntime();
  /* The banner names the forced state. The happy path is not a forced state, so
     it is the one scenario that renders no marker. */
  S.injected = scn.natural ? null : scn.label;
  /* The key, not the label. Three screens used to branch on the label string,
     which made rewording a label a silent behaviour change. */
  S.scenario = key;

  seedOrganizer();
  S.draft.time = "7:00 PM"; S.draft.duration = 2;

  if (seed.dials){
    if (seed.dials.connectivity) S.connectivity = seed.dials.connectivity;
    if (seed.dials.capacity)     S.capacityDial = seed.dials.capacity;
  }
  if (seed.draft){
    if (seed.draft.qty !== undefined)     S.draft.qty = seed.draft.qty;
    if (seed.draft.players !== undefined) S.draft.players = seed.draft.players.slice();
  }

  let o = null;
  if (seed.order === "court")         o = makeCourtOrder();
  else if (seed.order === "openplay") o = makeOpOrder(seed.window || "w1");
  if (o) settleOrder(o, seed.settle);

  let inquiry = null;
  if (seed.inquiry){
    inquiry = { ref: seed.inquiry.ref, state: seed.inquiry.state, name: S.draft.name,
                date: seed.inquiry.date, time: seed.inquiry.time };
    S.inquiries[inquiry.ref] = inquiry;
  }

  if (seed.route) go(seedRoute(seed.route, o, inquiry));

  syncDials();
  STAGING.setScenario(key);
  closeSheet();
}

/* ============================================================
   THEME
   The document ships pinned to dark, which is the look this redesign was reviewed
   in. The control flips the pin rather than removing it, so the choice is always
   explicit and never falls back to whatever the operating system happens to say
   mid-session.

   The preference now lives in the staging bridge alongside the other dials
   instead of in a key of its own, because there are two builds and a display
   setting that stops at the boundary between them is a reader retuning the same
   control twice. The admin console's settings screen writes the same value and
   reads it back; whichever surface you set it on, the other one is already
   wearing it when you arrive. A preference set under the old tfc-theme key is
   adopted on first load and the old key is dropped, so nobody's choice is lost
   and there is still only one place the answer lives.

   What has changed for this build: Reset all state now clears the theme too,
   because the harness offers that control as the way back to a clean demo and a
   reset that left the page painted in a choice from twenty minutes ago is not
   one. The theme is no longer the one thing that outlives everything.
   ============================================================ */
function currentTheme(){
  const set = document.documentElement.getAttribute("data-theme");
  if (set === "dark" || set === "light") return set;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
/* The announcement is the only part of this that belongs to the button being
   pressed. Painting is the subscriber's job below, because a theme can also
   arrive from the console's settings screen in another tab and both routes have
   to end in the same repaint rather than in two copies of it. */
function setTheme(mode){
  announce(mode === "dark" ? "Night theme." : "Day theme.");
  STAGING.setTheme(mode);
}
/* The pin itself was already settled in the head, before the first paint. This
   only handles a change arriving afterwards, from this document's own toggle or
   from the other one. A dial the reader can see has to follow it without asking
   for a refresh. */
STAGING.subscribe(function(state, changed){
  if (changed.indexOf("theme") < 0) return;
  STAGING.applyTheme("dark");
  S.inPlace = true; render();
  if (S.qr) paintQrModal();
});
function themeButton(){
  const dark = currentTheme() === "dark";
  return '<button class="iconbtn iconbtn--bare" data-action="theme" aria-pressed="' + dark + '"' +
    ' aria-label="' + (dark ? "Switch to the day theme" : "Switch to the night theme") + '">' +
    icon(dark ? "sun" : "moon") + "</button>";
}
/* The label is dropped below 420px, where the control has to share the app bar
   with the wordmark. The accessible name is on the button rather than in the text
   for exactly that reason. */
function demoButton(){
  return '<button class="iconbtn iconbtn--demo" data-action="demo" aria-haspopup="dialog" aria-label="Staging harness">' +
    icon("flask") + '<span class="iconbtn__t">Demo</span></button>';
}

/* ============================================================
   HEADER ACCOUNT
   Signed out, one prominent action. Signed in, the same corner becomes a compact
   menu holding what belongs to an account: the bookings, the profile, and the way
   out. My Bookings moved in here when the account appeared. It is a primary
   customer task and it used to be a permanent destination in the navigation, which
   is right while there is nobody to attach it to; once there is an Account button
   beside it, a My Bookings link is the same destination drawn twice, and the one
   that reads as an account's contents is the one inside the account.
   ============================================================ */
/* One action, not two. The hero offers the choice between a private court and Open
   Play because that is a decision worth a pair of cards; the header, once that pair
   has scrolled away, offers the way back into booking and lets the flow ask which.
   startcourt rather than a plain nav, so the maintenance interruption is handled by
   the same guard the hero card goes through and there is no second booking route. */
/* Wrapped, because the width is the animation. The wrapper is a one-column grid
   that runs from 0fr to 1fr, which is the only way to transition a control from no
   width to its own width without naming that width in the stylesheet. */
function bookCtaHtml(){
  return '<span class="navcta"><button class="nav-book-cta" data-action="startcourt">Book Court</button></span>';
}
function loginButtonHtml(){
  return '<div class="headeraccount">' +
    '<button class="btn-login" data-action="nav" data-to="/signin">Log in</button></div>';
}
function firstName(){
  const n = (S.account && S.account.name ? S.account.name : "").trim();
  if (!n) return (S.account && S.account.mobile) ? S.account.mobile : "Account";
  return n.split(/\s+/)[0];
}
function accountMenuHtml(){
  const a = S.account || {};
  return '<div class="headeraccount acct" id="acct">' +
    '<button class="acct__btn" data-action="accountmenu" aria-expanded="false" aria-haspopup="menu" aria-controls="acct-menu">' +
      icon("person") + "<span>" + esc(firstName()) + "</span>" + icon("chev-d", "chev") + "</button>" +
    '<div class="acct__menu" id="acct-menu" role="menu">' +
      '<div class="acct__who">Signed in as<strong>' + esc(a.name || a.mobile || "Account") + "</strong></div>" +
      '<button role="menuitem" data-action="acctnav" data-to="/me">' + icon("ticket") + "<span>My Bookings</span></button>" +
      '<button role="menuitem" data-action="acctnav" data-to="/me/profile">' + icon("person") + "<span>Profile</span></button>" +
      '<button role="menuitem" data-action="signout">' + icon("return") + "<span>Log out</span></button>" +
    "</div></div>";
}
function closeAccountMenu(){
  const w = document.getElementById("acct");
  if (!w || !w.classList.contains("is-open")) return;
  w.classList.remove("is-open");
  const b = w.querySelector(".acct__btn");
  if (b) b.setAttribute("aria-expanded", "false");
}

/* ============================================================
   THE MENU, PHONES
   Not an overflow any more. Below 1024px this is where the whole of the navigation
   lives, because the app bar carries the wordmark, one action, and this button, and
   there is no room in it for destinations as well. It holds three things in this
   order: where you can go, who you are, and what this build is.
   What it deliberately does not hold is Book or Open Play. Those are the hero's two
   cards, and once they scroll away the bar itself carries Book Court, so putting
   them in here as well would be the third and fourth copy of the same action.
   This is the same sheet the harness uses, so it already traps focus, closes on
   Escape, and restores focus on the way out.
   ============================================================ */
function openAppMenu(){
  const dlg = document.getElementById("sheet");
  const dark = currentTheme() === "dark";
  const path = currentPath();
  let b = '<div class="menusheet">';
  if (S.account){
    b += '<p class="acct__who" style="border:0;padding:0 0 var(--s3)">Signed in as<strong>' +
      esc(S.account.name || S.account.mobile) + "</strong></p>";
  }
  /* The same list the navigation strip is built from, unfiltered: a width is a
     reason to fold destinations away, never a reason to lose one. My Bookings
     resolves against the account exactly as it does up there, so signed out it
     lands on Find My Booking rather than on an unexplained sign-in wall. */
  PUBLIC_NAV.forEach(function(t){
    const href = tabHref(t);
    b += '<button class="menurow" data-action="acctnav" data-to="' + esc(href) + '"' +
      (t.match.indexOf(path) >= 0 ? ' aria-current="page"' : "") + ">" +
      icon(t.glyph) + "<span>" + esc(t.label) + "</span></button>";
  });
  if (S.account){
    b += '<button class="menurow" data-action="acctnav" data-to="/me/profile">' + icon("person") + "<span>Profile</span></button>";
    b += '<button class="menurow" data-action="signout">' + icon("return") + "<span>Log out</span></button>";
  } else {
    b += '<button class="menurow" data-action="acctnav" data-to="/signin">' + icon("person") + "<span>Log in</span></button>";
  }
  /* The build controls, last. Neither is a customer task, and from 1024px up they
     are in the utility strip instead, so no width shows two copies of either. */
  b += '<button class="menurow" data-action="theme" aria-pressed="' + dark + '">' +
    icon(dark ? "sun" : "moon") + "<span>" + (dark ? "Day theme" : "Night theme") + "</span></button>";
  b += '<button class="menurow" data-action="demo">' + icon("flask") + "<span>Staging harness</span></button>";
  b += "</div>";
  dlg.innerHTML = '<div class="sheet"><div class="sheet__head"><h2 id="sheet-title">Menu</h2>' +
    '<button class="sheet__close" data-action="closesheet" aria-label="Close the menu">' + icon("x") + "</button></div>" +
    '<div class="sheet__body">' + b + "</div></div>";
  dlg.classList.add("is-anchored");
  anchorMenu();
  if (!dlg.open) dlg.showModal();
}
/* Reads the menu button and writes the three placement values onto the dialog. Kept
   separate from openAppMenu because a resize has to be able to run it again: the
   panel is placed in pixels, and a window that changes width underneath an open
   panel would otherwise leave it pointing at where the button used to be.
   documentElement.clientWidth, not innerWidth, for the same reason the dialog is
   sized by inset: innerWidth counts the scrollbar. */
function anchorMenu(){
  const dlg = document.getElementById("sheet");
  if (!dlg || !dlg.classList.contains("is-anchored")) return;
  const btn = document.querySelector(".barmenu");
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  if (!r.width && !r.height) return;      /* hidden at this width, leave the default */
  const vw = document.documentElement.clientWidth;
  const gutter = 12;
  const right = Math.max(gutter, Math.round(vw - r.right));
  dlg.style.setProperty("--anchor-top", Math.round(r.bottom + 8) + "px");
  dlg.style.setProperty("--anchor-right", right + "px");
  /* How far the button's centre sits from the panel's right edge, which is what the
     panel has to grow out of. */
  dlg.style.setProperty("--anchor-ox", Math.max(12, Math.round(vw - right - (r.left + r.width / 2))) + "px");
}
window.addEventListener("resize", anchorMenu, { passive:true });

/* ============================================================
   QR MODAL INTERACTION
   Native <dialog> already traps focus and closes on Escape. What it does not do
   is move between passes, so the arrow keys and the swipe live here.
   ============================================================ */
(function(){
  const d = document.getElementById("qrmodal");
  if (!d) return;
  d.addEventListener("close", function(){
    S.qr = null;
    d.innerHTML = "";
    if (qrOpener && document.contains(qrOpener)) qrOpener.focus();
    qrOpener = null;
  });
  /* A click on the backdrop lands on the dialog itself, never on .qrm. */
  d.addEventListener("click", function(ev){ if (ev.target === d) closeQrModal(); });
  d.addEventListener("keydown", function(ev){
    if (!S.qr) return;
    if (ev.key === "ArrowLeft"){ ev.preventDefault(); qrStep(-1, document.activeElement && document.activeElement.id); }
    else if (ev.key === "ArrowRight"){ ev.preventDefault(); qrStep(1, document.activeElement && document.activeElement.id); }
  });
  let sx = 0, sy = 0, id = null;
  d.addEventListener("pointerdown", function(ev){
    const t = ev.target.closest && ev.target.closest("#qrm-track");
    if (!t) return;
    id = ev.pointerId; sx = ev.clientX; sy = ev.clientY;
  });
  d.addEventListener("pointerup", function(ev){
    if (id === null || ev.pointerId !== id) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    id = null;
    /* Horizontal intent only, or a vertical scroll inside the body would page. */
    if (Math.abs(dx) < 44 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    qrStep(dx < 0 ? 1 : -1, null);
  });
  d.addEventListener("pointercancel", function(){ id = null; });
})();

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
/* The account dropdown closes on a click anywhere outside itself. Capture phase, so
   it runs before the action handler below, and it never stops the event: whatever
   was clicked still does its own job on the way through. */
document.addEventListener("click", function(ev){
  if (!(ev.target.closest && ev.target.closest(".acct"))) closeAccountMenu();
}, true);
document.addEventListener("keydown", function(ev){
  if (ev.key !== "Escape") return;
  const w = document.getElementById("acct");
  if (!w || !w.classList.contains("is-open")) return;
  const b = w.querySelector(".acct__btn");
  closeAccountMenu();
  if (b) b.focus();
});
document.addEventListener("click", function(ev){
  const el = ev.target.closest ? ev.target.closest("[data-action]") : null;
  if (!el) return;
  const name = el.getAttribute("data-action");
  if (name === "picktime" || name === "qtyinput") return;
  const fn = ACTIONS[name];
  if (!fn) return;
  if (el.tagName === "A" && name === "closesheet"){ closeSheet(); return; }
  ev.preventDefault();
  if (el.tagName === "BUTTON" && el.disabled) return;
  fn(el);
});
document.addEventListener("change", function(ev){
  const el = ev.target;
  if (el.name === "starttime"){
    S.draft.time = el.value;
    const total = RATE_COURT * S.draft.duration;
    announce("Selected " + el.value + ". Total " + peso(total));
    S.refocus = el.getAttribute("data-fk"); render();
  }
  /* The middle segment of either quantity control. A typed value is clamped to the
     same range the two buttons refuse at, so there is one limit and not two, and
     the reader is told when their number was moved rather than watching it change
     without explanation. */
  if (el.id === "qtyinput"){
    const typed = parseInt(el.value,10);
    const v = Math.max(1, Math.min(DEMO_QTY_CAP, typed || 1));
    S.draft.qty = v;
    if (typed !== v){
      announce(isNaN(typed)
        ? "That is not a number, so the quantity is set to 1 admission."
        : v >= DEMO_QTY_CAP
          ? "Limit reached. Open Play is at its " + OP_CAPACITY + "-player capacity."
          : "Set to " + v + " " + plural(v,"admission","admissions") + ".");
    } else {
      announce(v + " " + plural(v,"admission","admissions") + ". Total " + peso(v * RATE_OPENPLAY));
    }
    rerender("qtyplus");
  }
  if (el.id === "paxinput"){
    const typed = parseInt(el.value,10);
    const v = Math.max(1, Math.min(MAX_PARTICIPANTS, typed || 1));
    S.draft.pax = v;
    S.draft.players.length = v;
    if (typed !== v){
      announce(isNaN(typed)
        ? "That is not a number, so the party is set to 1 player."
        : v >= MAX_PARTICIPANTS
          ? "Limit reached. A court booking holds at most " + MAX_PARTICIPANTS + " players."
          : "Set to " + v + " " + plural(v,"player","players") + ".");
    } else {
      announce(v + " " + plural(v,"player","players") + ".");
    }
    rerender("paxplus");
  }
  /* Ticked, the organizer's name is copied into the first participant box once.
     It is a shortcut, not a binding: the box stays editable afterwards, so a
     nickname on the pass does not rewrite who made the booking. */
  if (el.id === "sameasorg"){
    const kind = el.getAttribute("data-kind") || "court";
    capturePlayers(kind); captureForms();
    S.draft.sameAsOrganizer = !!el.checked;
    if (el.checked){
      const organizer = (S.forms.name || S.draft.name || "").trim();
      S.draft.players[0] = organizer;
      delete S.forms.p0;
      delete S.formErrors.p0;
      announce(organizer
        ? organizer + " copied into participant 1."
        : "The organizer name is empty, so there is nothing to copy into participant 1 yet.");
    } else {
      S.draft.players[0] = "";
      delete S.forms.p0;
      announce("Participant 1 cleared.");
    }
    /* Everything on this screen has just been read into the draft by hand, so the
       read render() does for itself has to be skipped. Without this it would read
       the untouched first box straight back over the name that was just copied
       into it, and the tick would appear to do nothing. */
    S.refocus = null;
    S.inPlace = true;
    S.skipCapture = true;
    render();
    const again = document.getElementById("sameasorg");
    if (again) again.focus({ preventScroll:true });
  }
});
document.addEventListener("submit", function(ev){ ev.preventDefault(); });

/* Keyboard must never bury the primary action or a validation message */
document.addEventListener("focusin", function(ev){
  const t = ev.target;
  if (t.matches && t.matches("input, select, textarea")){
    const d = document.getElementById("dock");
    if (d){ d.classList.add("dock-static"); document.documentElement.style.setProperty("--dock-h","0px"); }
  }
});
document.addEventListener("focusout", function(){
  setTimeout(function(){
    const a = document.activeElement;
    if (a && a.matches && a.matches("input, select, textarea")) return;
    const d = document.getElementById("dock");
    if (d){ d.classList.remove("dock-static"); measureDock(); }
  }, 60);
});
if (window.ResizeObserver){
  let pending = false;
  const ro = new ResizeObserver(function(){
    if (pending) return;
    pending = true;
    requestAnimationFrame(function(){ pending = false; measureDock(); });
  });
  const host = document.getElementById("dockhost");
  if (host) ro.observe(host);
}
/* Belt and braces for the on-screen keyboard. Some mobile browsers suppress or
   reorder focus events, so the shrinking visual viewport is the second signal. */
if (window.visualViewport){
  const vv = window.visualViewport;
  let tallest = vv.height;
  vv.addEventListener("resize", function(){
    tallest = Math.max(tallest, vv.height);
    const d = document.getElementById("dock");
    if (!d){ measureDock(); return; }
    if (tallest - vv.height > 120){
      d.classList.add("dock-static");
      document.documentElement.style.setProperty("--dock-h", "0px");
    } else {
      const a = document.activeElement;
      if (!(a && a.matches && a.matches("input, select, textarea"))) d.classList.remove("dock-static");
      measureDock();
    }
  });
}

/* ============================================================
   BOOT
   ============================================================ */
/* Back to top belongs to the landing page and nowhere else. That page is a long
   scroll a reader browses; every other screen is a task with a sticky bar at the
   bottom, and a second floating control sitting next to that bar was competing
   with the one button the step actually wants pressed. It still appears only once
   there is a screenful to come back from. */
(function(){
  const btn = document.getElementById("totop");
  if (!btn) return;
  let queued = false;
  function sync(){
    queued = false;
    btn.hidden = currentPath() !== "/" || window.scrollY < window.innerHeight * 0.6;
    watchHero();
  }
  window.addEventListener("scroll", function(){
    if (queued) return;
    queued = true;
    requestAnimationFrame(sync);
  }, { passive:true });
  window.addEventListener("resize", sync, { passive:true });
  window.addEventListener("hashchange", function(){ requestAnimationFrame(sync); });
  sync();
})();

/* ============================================================
   SCROLL CUE
   A pair of overlay indicators, one per axis, shared by every scrollable thing on
   the page. They are positioned from the scrolling element's own rectangle on each
   frame, so the same two elements serve the document, a sheet body, a menu panel, a
   month grid, and the staff timeline without any of them knowing about this.

   Capture phase, because a scroll event does not bubble. It does still propagate
   down, so one capturing listener on the document sees every element's scroll,
   including containers that do not exist yet.

   A modal dialog is painted in the top layer, which sits above every z-index there
   is, so a cue parented to the body would be behind the backdrop rather than over
   the panel. When the thing that scrolled is inside an open dialog, the cue is
   moved into that dialog for as long as it is showing.

   Fine pointers only. A touch platform already does all of this natively.
   ============================================================ */
(function(){
  if (!window.matchMedia || !matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  if (!document.body) return;

  function make(cls){
    const e = document.createElement("div");
    e.className = cls;
    e.setAttribute("aria-hidden","true");
    document.body.appendChild(e);
    return e;
  }
  const V = make("scrollcue scrollcue--v");
  const H = make("scrollcue scrollcue--h");
  const MIN = 26;          /* a cue shorter than this stops reading as a cue */
  const GAP = 3;           /* clear of the content edge, inside the padding */
  let hideT = null, queued = false, pending = null;

  function rest(){
    V.removeAttribute("data-on");
    H.removeAttribute("data-on");
    /* Back to the body once they are out of sight, so a dialog that closes never
       takes a cue out of the document with it. */
    if (V.parentNode !== document.body) document.body.appendChild(V);
    if (H.parentNode !== document.body) document.body.appendChild(H);
  }
  function arm(){
    clearTimeout(hideT);
    hideT = setTimeout(rest, 620);
  }

  function paint(){
    queued = false;
    const t = pending;
    pending = null;
    if (!t) return;
    const doc = (t === document || t === document.documentElement || t === document.body);
    const el = doc ? document.documentElement : t;
    if (!doc && el.nodeType !== 1) return;

    let top, left, vw, vh;
    if (doc){
      top = 0; left = 0;
      vw = document.documentElement.clientWidth;
      vh = document.documentElement.clientHeight;
    } else {
      const r = el.getBoundingClientRect();
      top = r.top + el.clientTop;
      left = r.left + el.clientLeft;
      vw = el.clientWidth;
      vh = el.clientHeight;
    }
    const host = (!doc && el.closest && el.closest("dialog[open]")) || document.body;

    const sh = el.scrollHeight, sw = el.scrollWidth;
    const st = doc ? (window.scrollY || el.scrollTop) : el.scrollTop;
    const sl = doc ? (window.scrollX || el.scrollLeft) : el.scrollLeft;

    if (sh > vh + 1 && vh > MIN * 2){
      const len = Math.max(MIN, Math.round(vh * vh / sh));
      const y = Math.round(top + (st / (sh - vh)) * (vh - len));
      V.style.top = y + "px";
      V.style.height = len + "px";
      V.style.left = Math.round(left + vw - GAP - 6) + "px";
      if (V.parentNode !== host) host.appendChild(V);
      V.setAttribute("data-on","1");
    }
    if (sw > vw + 1 && vw > MIN * 2){
      const len = Math.max(MIN, Math.round(vw * vw / sw));
      const x = Math.round(left + (sl / (sw - vw)) * (vw - len));
      H.style.left = x + "px";
      H.style.width = len + "px";
      H.style.top = Math.round(top + vh - GAP - 6) + "px";
      if (H.parentNode !== host) host.appendChild(H);
      H.setAttribute("data-on","1");
    }
    arm();
  }

  document.addEventListener("scroll", function(ev){
    pending = ev.target;
    if (queued) return;
    queued = true;
    requestAnimationFrame(paint);
  }, true);
  /* A resize while a cue is showing would leave it measuring a box that has moved.
     Cheaper to retire it than to recompute against a target we would have to keep
     a reference to. */
  window.addEventListener("resize", rest, { passive:true });
})();

/* ============================================================
   BOOT: PULL THE DIALS IN
   The theme was already settled in the head. The other four dials are pulled in
   here, before the first render, so a walkthrough that set Front Desk and a dead
   payment provider still has both after a reload and after a trip through the
   admin console.

   The armed scenario is deliberately NOT replayed. It is remembered, and the
   harness shows which one is armed, and the console renders its own sample for
   it, but this document does not re-seed the order graph on load. Replaying it
   would mint a fresh order with a new identifier and a new hold deadline while
   the address bar still pointed at the one the previous run created, which is a
   404 dressed up as a feature. Dials persist; bookings do not, and the harness
   copy says so in those words.
   ============================================================ */
function hydrateDials(){
  const d = STAGING.get();
  S.surface = d.surface;
  S.connectivity = d.connectivity;
  S.capacityDial = d.capacity;
  S.clockOffsetMs = d.clockOffset;
  /* The same two fixups the surface control itself applies, so arriving at a
     surface by reload lands in the same state as arriving at it by tapping. */
  if (S.surface === "player" && !S.account) S.account = { name:"Sample Player", mobile:"0917 555 0100", email:"" };
  if (S.surface === "visitor") S.account = null;
}
STAGING.registerScenarios(SCENARIOS.map(function(s){ return s.key; }));
hydrateDials();
/* A dial moved in the OTHER document. Pull it in and repaint; never push back,
   or the two would answer each other forever. Local changes are ignored here
   because the control that made them has already moved S and rendered, and
   re-running that on the echo would render twice for every tap. Theme has its
   own subscriber above, which does listen to both, because there the local path
   deliberately delegates the painting rather than duplicating it. */
STAGING.subscribe(function(state, changed, origin){
  if (origin !== "remote") return;
  const dials = ["surface", "connectivity", "capacity", "clockOffset"];
  if (!changed.some(function(c){ return dials.indexOf(c) >= 0; })) return;
  hydrateDials();
  S.inPlace = true; render();
});

window.addEventListener("hashchange", render);
if (!location.hash) location.hash = "/";
render();
</script>
